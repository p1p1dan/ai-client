name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  # D41 — every packaging path goes through the four gates first. Without this
  # a red gate still produced a full release: build-app has no dependencies of
  # its own, and build-remote-runtime-linux uploads its asset straight into the
  # release job. Both now hang off `gate`.
  #
  # timeout-minutes = ceil(3N/10)*10 from the first fully green run's measured
  # duration N (packaging spec §5.6), run 32442630099 on 2026-08-21:
  #   gate 2m25s -> 10 | build-app 2m09s -> 10 | build-windows 6m23s -> 20
  #   build-linux 6m22s -> 20 | build-remote-runtime-linux 1m18s -> 10
  # That run built both packaging jobs on COLD electron/npm caches, so N is a
  # conservative reading. generate-release-notes keeps its 10 (tag-only, never
  # ran here). Raise a value if a job legitimately grows, do not delete it.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      # 24 across every job (user decision, 2026-08-21), matching
      # src/agent-host/package.json engines (>=24) — the version that actually
      # runs the Host. It started here out of necessity: the behaviour-lock tests
      # spawn the real entry with `node --experimental-strip-types`, a flag that
      # only exists from Node 22.6, so on Node 20 the child died with exit 9
      # before emitting anything and every test in protocolErrors.test.ts failed
      # identically. Leaving the other jobs on 20 would have kept three
      # contradictory Node truths in the repo (.nvmrc 22 / CI 20 / engines 24).
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --omit=optional on purpose: the gates need types and tests, not
      # cometix's cli.js or codex's ~347MB platform package. cometix's
      # install.cjs only console.errors when its platform package is missing,
      # so this does not fail. If a gate turns red purely from the missing
      # optional packages, fall back to a full `npm ci` and accept the time —
      # never make the tests skip on a missing package.
      - name: Install agent-host dependencies
        run: npm ci --omit=optional
        working-directory: src/agent-host

      # Four gates run serially, never chained into one command: the combined
      # form has OOM'd (exit 137) before — see baseline/test-and-release-gates.md.
      - name: Gate 1/4 — typecheck
        run: pnpm typecheck

      - name: Gate 2/4 — typecheck:agent-host
        run: pnpm typecheck:agent-host

      - name: Gate 3/4 — lint
        run: pnpm lint

      - name: Gate 4/4 — test
        run: pnpm test

  build-app:
    needs: [gate]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload build output
        uses: actions/upload-artifact@v5
        with:
          name: app-build
          path: out/
          retention-days: 1

  build-windows:
    needs: build-app
    timeout-minutes: 20
    # Pin to windows-2022: windows-latest 已升级到 windows-2025，仅装 VS 2026 (path \18\),
    # 而 @electron/rebuild@4.0.1 bundled node-gyp@11.5.0 的 find-visualstudio.js 白名单
    # 只到 [2019, 2022]，找不到 VS 2026 → "Could not find any Visual Studio installation".
    # windows-2022 runner 仍由 GitHub 维护，且预装 VS 2022。等 @electron/rebuild 升级
    # 带新 node-gyp 支持 VS 2026 后再切回 windows-latest。
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download build output
        uses: actions/download-artifact@v5
        with:
          name: app-build
          path: out/

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@p1p1dan'

      # windows-latest is now the windows-2025 image; @electron/rebuild's
      # bundled node-gyp can't locate VS 2022 without MSBuild on PATH.
      # microsoft/setup-msbuild wires the MSBuild + vswhere paths so the
      # @parcel/watcher rebuild inside `electron-builder install-app-deps`
      # (run via postinstall) succeeds and sqlite3's node-pre-gyp can
      # download/place node_sqlite3.node into the asarUnpack bundle.
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Cache Electron
        uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No agent-host npm cache here on purpose (REQ-7 accounting, decided
      # 2026-08-21). It was measured on runs 32444722264 / 32448401467: with the
      # cache restored, `npm ci` took 8s on Windows and 11s on Linux — against
      # 7s and 11s with a cold cache. Zero gain, for a 278-362 MB entry competing
      # with the electron/pnpm caches inside the repo's 10 GB LRU budget.
      #
      # Agent Host artifact (extraResources: out-agent-host -> resources/agent-host).
      # src/agent-host is a standalone npm project; npm ci must include optional
      # deps so the cometix postinstall can copy cli.js + vendor/.
      - name: Install agent-host dependencies
        run: npm ci
        working-directory: src/agent-host

      # REQ-7 accounting. The cache-entry and disk figures are the inputs for
      # the first run's baseline; they are printed, never gated on.
      # Every filesystem drive, not just C:. The workspace lives on D: on hosted
      # Windows runners, so the first run's three C: readings were identical
      # (80.2 GB free throughout) and said nothing about the packaging cost.
      - name: Report disk after install (REQ-7)
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      # Spec §11-Q1 evidence: this repo has never produced a Windows artifact,
      # so the vendor layout, the per-file bytes and codex.exe's real size are
      # all unmeasured. Print them BEFORE anything can fail on them — a run that
      # dies inside a gate produces none of the readings the gate needs.
      - name: Inspect codex payload (spec §11-Q1 evidence)
        run: node scripts/inspect-codex-payload.mjs

      # Step two of spec §11-Q1: run 32442630099 measured every Q1 item and all
      # of them passed, so win32-x64 joined CODEX_MEASURED_PLATFORMS and the
      # --observe flag is gone. They are hard gates here now.
      - name: Build agent-host artifact
        run: node scripts/build-agent-host.mjs

      # Key on the pin file's hash, not a hardcoded version: actions/cache never
      # overwrites an existing key, so a literal key survives a pin bump and
      # keeps restoring the stale runtime — the cache silently stops working and
      # nobody notices.
      - name: Cache bundled Node runtime
        uses: actions/cache@v5
        with:
          path: out-node-runtime
          key: node-runtime-${{ runner.os }}-${{ hashFiles('scripts/node-runtime-pin.mjs') }}

      - name: Fetch bundled Node runtime
        run: node scripts/fetch-node-runtime.mjs --platform win32-x64

      - name: Report disk before packaging (REQ-7)
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      - name: Build Windows
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report disk after packaging (REQ-7)
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      - name: Verify packaged agent-host (structure)
        run: node scripts/verify-packaged-app.mjs --app-dir dist/win-unpacked --skip-smoke

      # Without these, a workflow_dispatch run builds a Windows package and then
      # throws it away — the only way to obtain a test build was a Windows machine.
      # Tag runs also publish a draft release; these artifacts are the fallback.
      - name: Upload Windows installers
        uses: actions/upload-artifact@v5
        with:
          name: windows-installers
          path: dist/*.exe
          retention-days: 14
          if-no-files-found: error

      # Directory build: the encrypted-machine test plan requires win-unpacked
      # (portable re-extracts to a temp dir, so the bundled node.exe path drifts).
      # Only on manual runs — tag runs get the installers from the draft release.
      - name: Upload Windows unpacked directory
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: windows-unpacked
          path: dist/win-unpacked/**
          retention-days: 7
          if-no-files-found: error

  build-linux:
    needs: build-app
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download build output
        uses: actions/download-artifact@v5
        with:
          name: app-build
          path: out/

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@p1p1dan'

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Cache Electron
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No agent-host npm cache — see the Windows job for the measurement.
      #
      # Agent Host artifact (extraResources: out-agent-host -> resources/agent-host).
      - name: Install agent-host dependencies
        run: npm ci
        working-directory: src/agent-host

      - name: Report disk after install (REQ-7)
        run: df -h /

      # Prints the @openai tree file by file. Linux is already measured, so this
      # is the comparison baseline for the Windows listing (spec §10.3 hoist
      # belief: project installs hoist, global installs do not).
      - name: Inspect codex payload (spec §11-Q1 evidence)
        run: node scripts/inspect-codex-payload.mjs

      # No --observe: linux-x64 is in CODEX_MEASURED_PLATFORMS, every Q1 item is
      # a hard gate here.
      - name: Build agent-host artifact
        run: node scripts/build-agent-host.mjs

      - name: Cache bundled Node runtime
        uses: actions/cache@v5
        with:
          path: out-node-runtime
          key: node-runtime-${{ runner.os }}-${{ hashFiles('scripts/node-runtime-pin.mjs') }}

      - name: Fetch bundled Node runtime
        run: node scripts/fetch-node-runtime.mjs --platform linux-x64

      - name: Report disk before packaging (REQ-7)
        run: df -h /

      - name: Build Linux
        run: npx electron-builder --linux --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report disk after packaging (REQ-7)
        run: df -h /

      - name: Verify packaged agent-host (structure)
        run: node scripts/verify-packaged-app.mjs --app-dir dist/linux-unpacked --skip-smoke

      - name: Upload Linux packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 7
          if-no-files-found: error

  build-remote-runtime-linux:
    needs: [gate]
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: remote-runtime-${{ runner.os }}-${{ matrix.arch }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: remote-runtime-${{ runner.os }}-${{ matrix.arch }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux remote runtime bundle (${{ matrix.arch }})
        run: node scripts/build-remote-runtime-bundle.mjs --arch=${{ matrix.arch }}

      - name: Upload remote runtime artifact
        uses: actions/upload-artifact@v5
        with:
          name: remote-runtime-linux-${{ matrix.arch }}
          path: dist/remote-runtime/*
          retention-days: 1

  generate-release-notes:
    needs: [build-windows, build-linux, build-remote-runtime-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set Tag
        id: tag
        run: |
          TAG="${{ github.ref_name }}"
          echo "name=$TAG" >> $GITHUB_OUTPUT
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download remote runtime artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: remote-runtime-linux-*
          path: remote-runtime-artifacts

      - name: Upload remote runtime bundles to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          for dir in remote-runtime-artifacts/remote-runtime-linux-*/; do
            gh release upload "$TAG" "$dir"* --clobber
          done

      - name: Verify Linux remote runtime release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"

          node - <<'NODE' > expected-remote-runtime-assets.txt
          const fs = require('node:fs');

          function readConstant(filePath, pattern) {
            const content = fs.readFileSync(filePath, 'utf8');
            const match = content.match(pattern);
            if (!match || !match[1]) {
              throw new Error(`Failed to read constant from ${filePath}`);
            }
            return match[1];
          }

          const serverVersion = readConstant(
            'src/main/services/remote/RemoteHelperSource.ts',
            /REMOTE_SERVER_VERSION = '([^']+)'/
          );
          const nodeVersion = readConstant(
            'src/main/services/remote/RemoteRuntimeAssets.ts',
            /MANAGED_REMOTE_NODE_VERSION = '([^']+)'/
          );

          for (const arch of ['x64', 'arm64']) {
            const archive = `aiclient-remote-runtime-v${serverVersion}-node-v${nodeVersion}-linux-${arch}.tar.gz`;
            console.log(archive);
            console.log(`${archive}.sha256`);
          }
          NODE

          echo "Expected remote runtime assets:"
          cat expected-remote-runtime-assets.txt

          echo "Actual release assets:"
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort | tee actual-release-assets.txt

          missing=0
          while IFS= read -r asset; do
            if ! grep -Fx -- "$asset" actual-release-assets.txt >/dev/null; then
              echo "Missing release asset: $asset"
              missing=1
            fi
          done < expected-remote-runtime-assets.txt

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Get Previous Tag
        id: prev_tag
        run: |
          CURRENT_TAG="${{ steps.tag.outputs.name }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -A1 "^${CURRENT_TAG}$" | tail -1)
          if [ "$PREV_TAG" = "$CURRENT_TAG" ] || [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        id: notes
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          VERSION="${{ steps.tag.outputs.version }}"
          PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"

          # 获取 commits
          COMMITS=$(git log ${PREV_TAG}..${TAG} --pretty=format:"%s" --no-merges)

          # 分类
          FEATURES=""
          FIXES=""
          CICD=""

          while IFS= read -r line; do
            [[ -z "$line" ]] && continue

            if [[ "$line" =~ ^feat ]]; then
              DESC=$(echo "$line" | sed 's/^feat[^:]*: //')
              FEATURES="${FEATURES}\n- **${DESC}**"
            elif [[ "$line" =~ ^fix ]]; then
              DESC=$(echo "$line" | sed 's/^fix[^:]*: //')
              FIXES="${FIXES}\n- **${DESC}**"
            elif [[ "$line" =~ ^ci ]] || [[ "$line" =~ ^build ]]; then
              DESC=$(echo "$line" | sed 's/^\(ci\|build\)[^:]*: //')
              CICD="${CICD}\n- ${DESC}"
            fi
          done <<< "$COMMITS"

          # 构建 notes
          {
            echo "## 更新内容"
            echo ""

            if [[ -n "$FEATURES" ]]; then
              echo "### ✨ 新功能"
              echo -e "$FEATURES"
              echo ""
            fi

            if [[ -n "$FIXES" ]]; then
              echo "### 🐛 问题修复"
              echo -e "$FIXES"
              echo ""
            fi

            if [[ -n "$CICD" ]]; then
              echo "### 🔨 CI/CD"
              echo -e "$CICD"
              echo ""
            fi

            echo "---"
            echo ""
            echo "## 📦 下载"
            echo ""
            echo "| 平台 | 文件 |"
            echo "|------|------|"
            echo "| Windows (x64 安装版) | [AiClient-Setup-${VERSION}.exe](https://github.com/${{ github.repository }}/releases/download/${TAG}/AiClient-Setup-${VERSION}.exe) |"
            echo "| Windows (x64 便携版) | [AiClient-${VERSION}-portable.exe](https://github.com/${{ github.repository }}/releases/download/${TAG}/AiClient-${VERSION}-portable.exe) |"
            echo "| Linux (x64 AppImage) | [AiClient-${VERSION}.AppImage](https://github.com/${{ github.repository }}/releases/download/${TAG}/AiClient-${VERSION}.AppImage) |"
            echo "| Linux (x64 deb) | [jyw-ai-client_${VERSION}_amd64.deb](https://github.com/${{ github.repository }}/releases/download/${TAG}/jyw-ai-client_${VERSION}_amd64.deb) |"
            echo ""
            echo "---"
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          } > release-notes.md

          cat release-notes.md

      - name: Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit ${{ steps.tag.outputs.name }} --draft=false --notes-file release-notes.md --latest
