name: DSH P0-4 Windows

# dsh-rebase P0-4 (decision 002): run the P0-4 kit and its one-click script
# run-p0-4.ps1 on a plain windows-2022 runner. The "encrypted" directory is an
# ordinary one, so every plaintext/ciphertext verdict is plaintext by
# construction; the point is whether the DSH host, its tools, sandbox, lock,
# PTY, spill and plugin install work on normal Windows. No -ControlGroup.
# Model turns only reach the kit's own fake gateway on 127.0.0.1.
on:
  push:
    branches:
      - ci/dsh-p0-windows
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-p0-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Same recipe as on the dev box: npm ci for win32-x64 with scripts ignored,
  # prune, verify every native binary is PE32+ x86-64, zip.
  build-kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          # The root packageManager field would turn on a pnpm cache; this job
          # only runs npm inside src/dsh-host.
          package-manager-cache: false

      - name: Build win32-x64 kit
        run: node src/dsh-host/p0-4/build-kit.mjs --platform win32 --out "$RUNNER_TEMP/kit"

      - name: Upload kit
        uses: actions/upload-artifact@v5
        with:
          name: p0-4-kit-win32-x64
          path: |
            ${{ runner.temp }}/kit/aiclient-p0-4-kit-win32-x64.zip
            ${{ runner.temp }}/kit/aiclient-p0-4-kit-win32-x64.zip.sha256
            ${{ runner.temp }}/kit/aiclient-p0-4-kit/kit-manifest.json
          if-no-files-found: error
          retention-days: 30

  # admin: the runner's own elevated account, script run by Windows PowerShell
  # 5.1 directly. standard: a fresh local account in Users only, script run by
  # a scheduled task under that account, closer to an office machine.
  windows:
    needs: build-kit
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        account: [admin, standard]
    defaults:
      run:
        shell: pwsh
    env:
      KIT_ROOT: C:\p04
      KIT_DIR: C:\p04\aiclient-p0-4-kit
      # A space in the path, as in the real install dir (Programs\PiLab Ai).
      APP_DIR: C:\p04app\PiLab Ai
      ENC_DIR: C:\p04enc
      OUT_DIR: C:\p04\out
    steps:
      # Only scripts/: fetch-node-runtime.mjs and the pinned sha256 of the
      # node.exe the packaged app bundles.
      - name: Checkout scripts
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts

      - name: Download kit
        uses: actions/download-artifact@v5
        with:
          name: p0-4-kit-win32-x64
          path: C:\p04dl

      - name: Verify and extract kit
        run: |
          $zip = 'C:\p04dl\aiclient-p0-4-kit-win32-x64.zip'
          $want = ((Get-Content -Raw 'C:\p04dl\aiclient-p0-4-kit-win32-x64.zip.sha256') -split '\s+')[0]
          $have = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "kit zip sha256 $have (expected $want)"
          if ($have -ne $want) { throw 'kit zip checksum mismatch' }
          New-Item -ItemType Directory -Force $env:KIT_ROOT, $env:OUT_DIR, $env:ENC_DIR | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf $zip -C $env:KIT_ROOT
          if ($LASTEXITCODE -ne 0) { throw "tar exited $LASTEXITCODE" }
          Copy-Item 'C:\p04dl\aiclient-p0-4-kit-win32-x64.zip.sha256' $env:OUT_DIR
          Get-ChildItem $env:KIT_DIR | Format-Table -AutoSize | Out-String | Write-Host

      # The script borrows resources\node-runtime\node.exe of an installed app;
      # lay out the same directory with the pinned runtime the app ships.
      - name: Stage bundled node.exe (-AppDir)
        run: |
          node scripts/fetch-node-runtime.mjs --platform win32-x64
          if ($LASTEXITCODE -ne 0) { throw "fetch-node-runtime exited $LASTEXITCODE" }
          $dir = Join-Path $env:APP_DIR 'resources\node-runtime'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item 'out-node-runtime\node.exe' $dir
          & (Join-Path $dir 'node.exe') -v

      - name: Record environment
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $gitBash = 'C:\Program Files\Git\bin\bash.exe'
          $pwsh7 = 'C:\Program Files\PowerShell\7\pwsh.exe'
          $lines = @(
            "account=${{ matrix.account }}",
            "image=$env:ImageOS $env:ImageVersion",
            "os=$($os.Caption) $($os.Version) build $($os.BuildNumber)",
            "windowsPowerShell=$(powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')",
            "pwsh7=$(if (Test-Path $pwsh7) { & $pwsh7 -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' } else { 'absent' })",
            "gitBash=$(if (Test-Path $gitBash) { (& $gitBash --version | Select-Object -First 1) } else { 'absent' })",
            "systemNode=$((Get-Command node -ErrorAction SilentlyContinue).Source) $(node -v)",
            "kitNode=$(& (Join-Path $env:APP_DIR 'resources\node-runtime\node.exe') -v)",
            "runnerUser=$env:USERNAME temp=$env:TEMP localAppData=$env:LOCALAPPDATA",
            "commit=$env:GITHUB_SHA run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT"
          )
          $lines | Tee-Object -FilePath (Join-Path $env:OUT_DIR 'env.txt')
          whoami /all | Out-File -Encoding utf8 (Join-Path $env:OUT_DIR 'whoami-runner.txt')
          whoami /groups | Select-String 'Mandatory Label'

      # Windows PowerShell 5.1 is the script's target; parse it there first so a
      # syntax error reads as one, not as a half-run.
      - name: Parse run-p0-4.ps1 in Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$env:KIT_DIR\run-p0-4.ps1", [ref]$null, [ref]$errors) | Out-Null
          $errors | ForEach-Object { "$($_.Extent.StartLineNumber):$($_.Extent.StartColumnNumber) $($_.Message)" }
          if ($errors.Count -gt 0) { exit 1 }
          'parse ok'

      - name: Run run-p0-4.ps1 (runner admin, Windows PowerShell 5.1)
        if: matrix.account == 'admin'
        shell: cmd
        run: |
          chcp 65001 >NUL
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File %KIT_DIR%\run-p0-4.ps1 -EncDir %ENC_DIR% -AppDir "%APP_DIR%" > %OUT_DIR%\console.log 2>&1
          set RC=%ERRORLEVEL%
          type %OUT_DIR%\console.log
          echo run-p0-4.ps1 exit %RC%
          exit /b %RC%

      # Office-machine stand-in: a fresh local account in Users only, and no
      # PowerShell 7 (the DSH pwsh tool prefers %ProgramFiles%\PowerShell\7 and
      # falls back to Windows PowerShell 5.1, which is what most office machines
      # have). pwsh 7 is hidden from that account with a deny ACE, not removed.
      - name: Run run-p0-4.ps1 (local standard user, scheduled task)
        if: matrix.account == 'standard'
        run: |
          $user = 'p04std'
          $password = 'Aa1!' + [guid]::NewGuid().ToString('N')
          net user $user $password /add /y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "net user exited $LASTEXITCODE" }
          net user $user | Select-String 'Local Group Memberships' | Out-Host
          $sid = (New-Object System.Security.Principal.NTAccount($user)).Translate([System.Security.Principal.SecurityIdentifier]).Value
          # A password-logon task needs the batch logon right, which Users lack
          # on Server SKUs. It adds the BATCH SID to the token; nothing else.
          # Files go through .NET: Set-Content's -Encoding is a dynamic
          # parameter that failed to bind here.
          $inf = 'C:\p04dl\rights.inf'
          secedit /export /cfg $inf /areas USER_RIGHTS | Out-Null
          $text = [System.IO.File]::ReadAllText($inf)
          if ($text -match '(?m)^SeBatchLogonRight\s*=') {
            $text = $text -replace '(?m)^(SeBatchLogonRight\s*=[^\r\n]*)', "`$1,*$sid"
          } else {
            $text = $text -replace '\[Privilege Rights\]', "[Privilege Rights]`r`nSeBatchLogonRight = *$sid"
          }
          [System.IO.File]::WriteAllText($inf, $text, [System.Text.Encoding]::Unicode)
          secedit /configure /db C:\p04dl\rights.sdb /cfg $inf /areas USER_RIGHTS | Out-Host
          # secedit may exit 1 for unrelated warnings; check the right itself.
          secedit /export /cfg C:\p04dl\rights-after.inf /areas USER_RIGHTS | Out-Null
          $batch = [System.IO.File]::ReadAllLines('C:\p04dl\rights-after.inf') | Where-Object { $_ -like 'SeBatchLogonRight*' }
          "after: $batch"
          # The export names a resolvable account (p04std) instead of *SID.
          if ("$batch" -notlike "*$sid*" -and "$batch" -notmatch "(=|,)\s*$user(,|$)") { throw 'batch logon right was not granted' }
          foreach ($dir in @($env:KIT_DIR, $env:ENC_DIR, $env:OUT_DIR)) {
            icacls $dir /grant "${user}:(OI)(CI)M" /Q | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "icacls $dir exited $LASTEXITCODE" }
          }
          icacls $env:APP_DIR /grant "${user}:(OI)(CI)RX" /Q | Out-Null
          icacls 'C:\Program Files\PowerShell\7' /deny "${user}:(OI)(CI)RX" /Q | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "icacls deny pwsh7 exited $LASTEXITCODE" }
          # Which right does the ACL sandbox's grant need? As the account: a DACL
          # edit (WRITE_DAC, implicit for the owner) and a Low label edit
          # (WRITE_OWNER), in a dir under C:\ root and in the user profile.
          $aclProbe = @'
          $ErrorActionPreference = 'Continue'
          foreach ($base in @($env:P04_ENC_DIR, $env:USERPROFILE)) {
            $dir = Join-Path $base ('acl-test-' + [guid]::NewGuid().ToString('N').Substring(0, 6))
            New-Item -ItemType Directory -Path $dir | Out-Null
            "== $dir (owner $((Get-Acl $dir).Owner))"
            icacls $dir
            '-- DACL edit (WRITE_DAC): icacls /grant *S-1-5-32-545:(OI)(CI)(RX)'
            icacls $dir /grant '*S-1-5-32-545:(OI)(CI)(RX)'
            "exit $LASTEXITCODE"
            '-- Low label edit (WRITE_OWNER): icacls /setintegritylevel (OI)(CI)L'
            icacls $dir /setintegritylevel '(OI)(CI)L'
            "exit $LASTEXITCODE"
            Remove-Item -Recurse -Force $dir
          }
          '@
          [System.IO.File]::WriteAllText("$env:OUT_DIR\acl-probe.ps1", $aclProbe, [System.Text.Encoding]::ASCII)
          # Two runs: the workspace root in a dir under C:\ root (inherits
          # Authenticated Users:M), then in the account's own profile (F).
          $wrapper = @"
          @echo off
          chcp 65001 >NUL
          whoami /all > $env:OUT_DIR\whoami-standard.txt
          if exist "C:\Program Files\PowerShell\7\pwsh.exe" (echo pwsh7 visible> $env:OUT_DIR\pwsh7-standard.txt) else (echo pwsh7 hidden> $env:OUT_DIR\pwsh7-standard.txt)
          set P04_ENC_DIR=$env:ENC_DIR
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $env:OUT_DIR\acl-probe.ps1 > $env:OUT_DIR\acl-probe-standard.txt 2>&1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $env:KIT_DIR\run-p0-4.ps1 -EncDir $env:ENC_DIR -AppDir "$env:APP_DIR" > $env:OUT_DIR\console-root.log 2>&1
          echo %ERRORLEVEL% > $env:OUT_DIR\exit-root.txt
          mkdir "%USERPROFILE%\p04enc"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $env:KIT_DIR\run-p0-4.ps1 -EncDir "%USERPROFILE%\p04enc" -AppDir "$env:APP_DIR" > $env:OUT_DIR\console-profile.log 2>&1
          echo %ERRORLEVEL% > $env:OUT_DIR\exit-standard.txt
          "@
          [System.IO.File]::WriteAllText("$env:OUT_DIR\run-standard.cmd", ($wrapper -replace "`r?`n", "`r`n"), [System.Text.Encoding]::ASCII)
          $action = New-ScheduledTaskAction -Execute 'cmd.exe' -Argument "/c $env:OUT_DIR\run-standard.cmd"
          $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 30) -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries
          Register-ScheduledTask -TaskName 'p04-standard' -Action $action -Settings $settings -User $user -Password $password -RunLevel Limited | Out-Null
          Start-ScheduledTask -TaskName 'p04-standard'
          $done = Join-Path $env:OUT_DIR 'exit-standard.txt'
          $deadline = (Get-Date).AddMinutes(30)
          while (-not (Test-Path $done) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 10
            $info = Get-ScheduledTaskInfo -TaskName 'p04-standard'
            $state = "$((Get-ScheduledTask -TaskName 'p04-standard').State)"
            if ($state -eq 'Ready' -and -not (Test-Path $done)) {
              Start-Sleep -Seconds 5
              if (-not (Test-Path $done)) { "task ended without the exit marker (state $state, last result 0x{0:x})" -f $info.LastTaskResult; break }
            }
          }
          Get-ScheduledTaskInfo -TaskName 'p04-standard' | Format-List | Out-String | Write-Host
          foreach ($name in @('pwsh7-standard.txt', 'acl-probe-standard.txt', 'console-root.log', 'console-profile.log')) {
            $file = Join-Path $env:OUT_DIR $name
            if (Test-Path $file) { [System.IO.File]::ReadAllLines($file) }
          }
          if (-not (Test-Path $done)) { throw 'standard-user run did not finish' }
          "run-p0-4.ps1 exit $(([System.IO.File]::ReadAllText($done)).Trim())"

      # The script exits 0 whenever it gets as far as writing a report; gate on
      # the checks of every report. Known failures are DSH behaviour located in
      # docs/plantree/plans/dsh-rebase/evidence/p0-4-windows-ci-2026-09-26.md;
      # they are reported as warnings, anything else fails the job.
      - name: Gate on report
        run: |
          $known = @{}
          if ('${{ matrix.account }}' -eq 'standard') {
            # dsh-sandbox-windows-acl grantWrite: SetNamedSecurityInfoW sets a
            # Low label, which needs WRITE_OWNER on the workspace root; a
            # standard user lacks it in a dir that only inherits Modify.
            $known['root'] = @('F-on-shell-read', 'F-on-shell-write', 'F-on-shell-spill', 'F-on-read-shell-written', 'F-on-node-verify', 'F-on-acl')
          }
          $dirs = @(Get-ChildItem $env:KIT_DIR -Directory -Filter 'report-*' | Sort-Object Name)
          if ($dirs.Count -eq 0) { throw 'no report-* directory' }
          $unexpected = New-Object System.Collections.Generic.List[string]
          foreach ($dir in $dirs) {
            $file = Join-Path $dir.FullName 'p0-4-report.json'
            if (-not (Test-Path $file)) { $unexpected.Add("$($dir.Name): no p0-4-report.json"); continue }
            $report = Get-Content -Raw -Encoding UTF8 -LiteralPath $file | ConvertFrom-Json
            $encDir = "$($report.powershell.machine.encDir)"
            $scenario = if ($encDir -like 'C:\Users\*') { 'profile' } else { 'root' }
            "== $($dir.Name): $scenario ($encDir) counts $($report.summary.counts | ConvertTo-Json -Compress)"
            $report.checks | ForEach-Object {
              $text = ($_.observed -replace '\s+', ' ')
              '{0,-5} {1,-26} {2}' -f $_.status, $_.id, $text.Substring(0, [Math]::Min(150, $text.Length))
            }
            $allowed = @($known[$scenario] | Where-Object { $_ })
            $bad = @($report.checks | Where-Object { $_.status -in @('fail', 'error') } | ForEach-Object id)
            foreach ($id in $bad) {
              if ($allowed -contains $id) { "::warning::$($dir.Name) ($scenario): known failure $id" }
              else { $unexpected.Add("$($dir.Name) ($scenario): $id") }
            }
            foreach ($id in $allowed) {
              if ($bad -notcontains $id) { "::notice::$($dir.Name) ($scenario): known failure $id now passes" }
            }
          }
          if ($unexpected.Count -gt 0) { throw "unexpected failures: $($unexpected -join '; ')" }

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: p0-4-windows-${{ matrix.account }}
          path: |
            C:\p04\out
            C:\p04\aiclient-p0-4-kit\report-*
          if-no-files-found: warn
          retention-days: 30
