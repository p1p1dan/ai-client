name: DSH P1-6d S18 Windows

# dsh-rebase P1-6d (decision 129): S18 — the app's permission gate on DSH's
# pwsh tool (plan P1-6 shard 04 §5: pwsh's S1, S3, S4 and S7, and every
# workspace's ACL left as it was), driven by src/dsh-host/tools/perm-pwsh-probe.ts
# through a real DSH host from the source checkout and the product bridge.
# Two lanes, as in dsh-p0-windows.yml: the runner's elevated account, where
# DSH's pwsh tool finds PowerShell 7, and a fresh local standard user with
# PowerShell 7 hidden, so the tool falls back to Windows PowerShell 5.1 as on
# most office machines. Model turns only reach the probe's own fake gateway on
# 127.0.0.1. Nothing here pushes, publishes or signs anything.
on:
  push:
    branches:
      - ci/dsh-p1-6d-windows
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-p1-6d-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s18:
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        account: [admin, standard]
    defaults:
      run:
        shell: pwsh
    env:
      OUT_DIR: C:\s18\out
      WORK_ROOT: C:\s18\work
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          # Only npm inside src/dsh-host runs here; no pnpm cache to restore.
          package-manager-cache: false

      # As build.yml's gate installs it: prebuilt natives, no install scripts.
      # The host from the source checkout needs nothing from the root package.
      - name: Install dsh-host dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: src/dsh-host

      # The probe and the host it starts run under the node.exe the app bundles.
      - name: Fetch the bundled node.exe
        run: |
          node scripts/fetch-node-runtime.mjs --platform win32-x64
          if ($LASTEXITCODE -ne 0) { throw "fetch-node-runtime exited $LASTEXITCODE" }
          & .\out-node-runtime\node.exe -v

      - name: Record environment
        run: |
          New-Item -ItemType Directory -Force $env:OUT_DIR, $env:WORK_ROOT | Out-Null
          $os = Get-CimInstance Win32_OperatingSystem
          $pwsh7 = 'C:\Program Files\PowerShell\7\pwsh.exe'
          $lines = @(
            "account=${{ matrix.account }}",
            "image=$env:ImageOS $env:ImageVersion",
            "os=$($os.Caption) $($os.Version) build $($os.BuildNumber)",
            "windowsPowerShell=$(powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')",
            "pwsh7=$(if (Test-Path $pwsh7) { & $pwsh7 -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' } else { 'absent' })",
            "bundledNode=$(& .\out-node-runtime\node.exe -v)",
            "runnerUser=$env:USERNAME workspace=$env:GITHUB_WORKSPACE",
            "commit=$env:GITHUB_SHA run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT"
          )
          $lines | Tee-Object -FilePath (Join-Path $env:OUT_DIR 'env.txt')

      # cmd, not pwsh: the probe logs to stderr, and a redirected native stderr
      # must not become a PowerShell error record.
      - name: Run S18 (runner admin, PowerShell 7)
        if: matrix.account == 'admin'
        shell: cmd
        run: |
          chcp 65001 >NUL
          out-node-runtime\node.exe src\dsh-host\tools\perm-pwsh-probe.ts --shell pwsh --work %WORK_ROOT%\admin --out %OUT_DIR%\report-admin.json > %OUT_DIR%\console-admin.log 2>&1
          set RC=%ERRORLEVEL%
          type %OUT_DIR%\console-admin.log
          echo perm-pwsh-probe exit %RC%
          exit /b %RC%

      # Office-machine stand-in: a fresh local account in Users only, the probe
      # run by a scheduled task under that account (P0-4's recipe), and
      # PowerShell 7 hidden from it with a deny ACE, so DSH's pwsh tool falls
      # back to Windows PowerShell 5.1.
      - name: Run S18 (local standard user, Windows PowerShell 5.1)
        if: matrix.account == 'standard'
        run: |
          $user = 's18std'
          $password = 'Aa1!' + [guid]::NewGuid().ToString('N')
          net user $user $password /add /y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "net user exited $LASTEXITCODE" }
          net user $user | Select-String 'Local Group Memberships' | Out-Host
          $sid = (New-Object System.Security.Principal.NTAccount($user)).Translate([System.Security.Principal.SecurityIdentifier]).Value
          # A password-logon task needs the batch logon right, which Users lack
          # on Server SKUs. It adds the BATCH SID to the token; nothing else.
          $inf = Join-Path $env:RUNNER_TEMP 'rights.inf'
          secedit /export /cfg $inf /areas USER_RIGHTS | Out-Null
          $text = [System.IO.File]::ReadAllText($inf)
          if ($text -match '(?m)^SeBatchLogonRight\s*=') {
            $text = $text -replace '(?m)^(SeBatchLogonRight\s*=[^\r\n]*)', "`$1,*$sid"
          } else {
            $text = $text -replace '\[Privilege Rights\]', "[Privilege Rights]`r`nSeBatchLogonRight = *$sid"
          }
          [System.IO.File]::WriteAllText($inf, $text, [System.Text.Encoding]::Unicode)
          secedit /configure /db (Join-Path $env:RUNNER_TEMP 'rights.sdb') /cfg $inf /areas USER_RIGHTS | Out-Host
          $after = Join-Path $env:RUNNER_TEMP 'rights-after.inf'
          secedit /export /cfg $after /areas USER_RIGHTS | Out-Null
          $batch = [System.IO.File]::ReadAllLines($after) | Where-Object { $_ -like 'SeBatchLogonRight*' }
          "after: $batch"
          if ("$batch" -notlike "*$sid*" -and "$batch" -notmatch "(=|,)\s*$user(,|$)") { throw 'batch logon right was not granted' }
          # Read the checkout (sources, node_modules, node.exe); write only where the report and the probe's work go.
          icacls $env:GITHUB_WORKSPACE /grant "${user}:(OI)(CI)RX" /Q | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "icacls workspace exited $LASTEXITCODE" }
          foreach ($dir in @($env:OUT_DIR, $env:WORK_ROOT)) {
            icacls $dir /grant "${user}:(OI)(CI)M" /Q | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "icacls $dir exited $LASTEXITCODE" }
          }
          icacls 'C:\Program Files\PowerShell\7' /deny "${user}:(OI)(CI)RX" /Q | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "icacls deny pwsh7 exited $LASTEXITCODE" }
          $wrapper = @"
          @echo off
          chcp 65001 >NUL
          whoami /all > $env:OUT_DIR\whoami-standard.txt
          if exist "C:\Program Files\PowerShell\7\pwsh.exe" (echo pwsh7 visible> $env:OUT_DIR\pwsh7-standard.txt) else (echo pwsh7 hidden> $env:OUT_DIR\pwsh7-standard.txt)
          cd /d $env:GITHUB_WORKSPACE
          out-node-runtime\node.exe src\dsh-host\tools\perm-pwsh-probe.ts --shell pwsh --work $env:WORK_ROOT\standard --out $env:OUT_DIR\report-standard.json > $env:OUT_DIR\console-standard.log 2>&1
          echo %ERRORLEVEL% > $env:OUT_DIR\exit-standard.txt
          "@
          $cmdFile = Join-Path $env:OUT_DIR 'run-standard.cmd'
          [System.IO.File]::WriteAllText($cmdFile, ($wrapper -replace "`r?`n", "`r`n"), [System.Text.Encoding]::ASCII)
          $action = New-ScheduledTaskAction -Execute 'cmd.exe' -Argument "/c $cmdFile"
          $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 20) -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries
          Register-ScheduledTask -TaskName 's18-standard' -Action $action -Settings $settings -User $user -Password $password -RunLevel Limited | Out-Null
          Start-ScheduledTask -TaskName 's18-standard'
          $done = Join-Path $env:OUT_DIR 'exit-standard.txt'
          $deadline = (Get-Date).AddMinutes(20)
          while (-not (Test-Path $done) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 10
            $info = Get-ScheduledTaskInfo -TaskName 's18-standard'
            $state = "$((Get-ScheduledTask -TaskName 's18-standard').State)"
            if ($state -eq 'Ready' -and -not (Test-Path $done)) {
              Start-Sleep -Seconds 5
              if (-not (Test-Path $done)) { "task ended without the exit marker (state $state, last result 0x{0:x})" -f $info.LastTaskResult; break }
            }
          }
          Get-ScheduledTaskInfo -TaskName 's18-standard' | Format-List | Out-String | Write-Host
          foreach ($name in @('pwsh7-standard.txt', 'console-standard.log')) {
            $file = Join-Path $env:OUT_DIR $name
            if (Test-Path $file) { [System.IO.File]::ReadAllLines($file) }
          }
          if (-not (Test-Path $done)) { throw 'standard-user run did not finish' }
          "perm-pwsh-probe exit $(([System.IO.File]::ReadAllText($done)).Trim())"

      # The probe exits non-zero on any failed check; this step prints every
      # check of the lane's report and fails on a missing report or a failure,
      # whichever lane ran.
      - name: Gate on report
        run: |
          $file = Join-Path $env:OUT_DIR 'report-${{ matrix.account }}.json'
          if (-not (Test-Path $file)) { throw "no report at $file" }
          $report = Get-Content -Raw -Encoding UTF8 -LiteralPath $file | ConvertFrom-Json
          "== ${{ matrix.account }}: shell $($report.shell) on $($report.platform), node $($report.node)"
          $report.checks | ForEach-Object {
            $text = ($_.observed -replace '\s+', ' ')
            '{0,-5} {1,-16} {2}' -f $_.status, $_.id, $text.Substring(0, [Math]::Min(160, $text.Length))
          }
          $failed = @($report.checks | Where-Object { $_.status -ne 'pass' } | ForEach-Object id)
          if ($report.checks.Count -lt 14) { throw "only $($report.checks.Count) checks ran (expected 14)" }
          if ($failed.Count -gt 0) { throw "failed checks: $($failed -join ', ')" }

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dsh-p1-6d-s18-${{ matrix.account }}
          path: |
            C:\s18\out
            C:\s18\work\*\gateway.jsonl
            C:\s18\work\*\hooks.jsonl
          if-no-files-found: warn
          retention-days: 30
