<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>P1-7 / P1-11 原型 · 待办目标条 + 后台任务/子代理子窗口 + 终端按钮（决策 090）</title>
<style>
/* ------------------------------------------------------------------
   Static prototype for decision 090 (revises 068) + Q003. Not product code.
   Color tokens copied verbatim from src/renderer/styles/globals.css
   (Flexoki light / dark). Size, radius and spacing follow the @theme tokens
   and docs/design-system.md (h-7 rows, h-6 buttons, gap-1 / gap-2,
   text-meta / text-ui / text-code, min-w-0 flex-1 truncate).
   The app frame size is switchable (1440x900 / 1280x720 / 1024x640) via
   --app-w / --app-h, driven by the "画幅" segmented control.
   ------------------------------------------------------------------ */
:root {
  --background: oklch(0.9931 0.012 96.42);
  --foreground: oklch(0.1696 0.0017 17.32);
  --card: oklch(0.97 0.0106 100.82);
  --popover: oklch(0.97 0.0106 100.82);
  --primary: oklch(0.5665 0.1523 45.02);
  --primary-foreground: oklch(0.9931 0.012 96.42);
  --secondary: oklch(0.962 0.0111 89.72);
  --muted: oklch(0.965 0.0093 99.98);
  --muted-foreground: oklch(0.4531 0.005 91.5);
  --accent: oklch(0.935 0.0122 96.43);
  --selection: oklch(0.91 0.0109 95.17);
  --hover: oklch(0.935 0.0122 96.43);
  --status-running: oklch(0.4818 0.1315 254.79);
  --destructive: oklch(0.5042 0.1648 27.84);
  --destructive-foreground: oklch(0.9931 0.012 96.42);
  --success: oklch(0.5593 0.1335 122.92);
  --info: oklch(0.4818 0.1315 254.79);
  --folder: oklch(0.6333 0.1295 85.81);
  --border: oklch(0.875 0.0137 97.46);
  --input: oklch(0.8463 0.0137 102.05);
  --tool-arg: color-mix(in oklab, var(--muted-foreground) 62%, var(--background));

  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 12px;
  --text-code: 13px;
  --text-meta: 14px;
  --text-ui: 15px;
  --text-chat-body: 17px;
  --text-chat-process: 14px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", "Ubuntu",
    "Cantarell", "Noto Sans", "Liberation Sans", Arial, "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", "Noto Sans SC",
    "WenQuanYi Micro Hei", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "SFMono-Regular", "Menlo", "Cascadia Mono", "Consolas",
    "Liberation Mono", "DejaVu Sans Mono", "PingFang SC", "Microsoft YaHei UI", "Noto Sans CJK SC",
    monospace;
  /* Prototype-only annotation ink. Deliberately the brand orange so it never
     reads as a UI state colour. */
  --anno: var(--primary);
  /* App frame size, switched by the 画幅 control (default 1440x900). */
  --app-w: 1440px;
  --app-h: 900px;
}
.dark {
  --background: oklch(0.1981 0.0032 17.43);
  --foreground: oklch(0.8463 0.0137 102.05);
  --card: oklch(0.262 0.0037 48.55);
  --popover: oklch(0.262 0.0037 48.55);
  --primary: oklch(0.6576 0.1539 49.3);
  --primary-foreground: oklch(0.1981 0.0032 17.43);
  --secondary: oklch(0.276 0.0024 67.71);
  --muted: oklch(0.268 0.0025 67.7);
  --muted-foreground: oklch(0.6956 0.0103 93.62);
  --accent: oklch(0.305 0.0029 17.32);
  --selection: oklch(0.325 0.0029 17.31);
  --hover: oklch(0.305 0.0029 17.32);
  --status-running: oklch(0.5988 0.1104 247);
  --destructive: oklch(0.597 0.1692 28.38);
  --destructive-foreground: oklch(0.1981 0.0032 17.43);
  --success: oklch(0.7227 0.1178 117.2);
  --info: oklch(0.5988 0.1104 247);
  --folder: oklch(0.7346 0.1462 87.46);
  --border: oklch(0.34 0.0038 84.58);
  --input: oklch(0.3651 0.0044 67.69);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font-sans);
  font-size: var(--text-ui);
  line-height: 1.55;
  background: var(--background);
  color: var(--foreground);
  -webkit-font-smoothing: antialiased;
  font-synthesis-weight: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
p { margin: 0; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { border-radius: 999px; background: color-mix(in oklab, var(--muted-foreground) 20%, transparent); }
::-webkit-scrollbar-thumb:hover { background: color-mix(in oklab, var(--muted-foreground) 40%, transparent); }

.i { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round; }
.s12 { width: 12px; height: 12px; }
.s13 { width: 13px; height: 13px; }
.s14 { width: 14px; height: 14px; }
.s18 { width: 18px; height: 18px; }
.s28 { width: 28px; height: 28px; }
.m { color: var(--muted-foreground); }
.run { color: var(--status-running); }
.ok { color: var(--success); }
.bad { color: var(--destructive); }
.folder { color: var(--folder); }
.tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: var(--text-code); }
.trunc { min-width: 0; flex: 1 1 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow { flex: 1 1 0; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes locateFlash { from { background: var(--selection); } to { background: transparent; } }
.flash { animation: locateFlash 1.4s ease-out; border-radius: var(--radius-sm); }

/* ---------------- page chrome (not part of the app) ---------------- */
.page-bar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--card);
}
.page-bar h1 { margin: 0; font-size: var(--text-ui); font-weight: 600; }
.pg-label { font-size: var(--text-meta); color: var(--muted-foreground); margin-right: -4px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.seg button {
  height: 28px; padding: 0 10px; font-size: var(--text-meta); color: var(--muted-foreground);
  border-right: 1px solid var(--border); transition: background-color 150ms; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 4px;
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--selection); color: var(--foreground); }
.seg button:hover:not([aria-pressed="true"]) { background: var(--hover); }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-meta); }
.notes {
  width: var(--app-w); margin: 16px auto; padding: 12px 16px;
  border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card);
  font-size: var(--text-meta); line-height: 1.6;
}
.notes h2 { margin: 0 0 4px; font-size: var(--text-ui); font-weight: 600; }
.notes ol { margin: 6px 0 6px; padding-left: 20px; }
.notes .measure { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }
.notes .measure b { color: var(--anno); }
.frame-wrap {
  width: calc(var(--app-w) + 2px); margin: 0 auto 40px; border: 1px solid var(--border);
  border-radius: var(--radius-lg); overflow: hidden;
}
body.shot .page-bar, body.shot .notes { display: none; }
body.shot .frame-wrap { margin: 0; border: 0; border-radius: 0; width: var(--app-w); }
body.shot *, body.shot *::before { animation: none !important; transition: none !important; }

/* ---------------- app shell ---------------- */
.app { position: relative; width: var(--app-w); height: var(--app-h); display: flex; flex-direction: column;
  overflow: hidden; background: var(--background); }
.titlebar { height: 32px; flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding-left: 12px; border-bottom: 1px solid var(--border); font-size: var(--text-meta); }
.titlebar .logo { font-weight: 700; font-size: 13px; }
.titlebar .wc { margin-left: auto; display: flex; }
.titlebar .wc span { width: 44px; height: 31px; display: grid; place-items: center; color: var(--muted-foreground); }
.shell { flex: 1; min-height: 0; display: flex; }
.rail { width: 44px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center;
  gap: 2px; padding: 6px 0 8px; background: var(--card); border-right: 1px solid var(--border); }
.rb { position: relative; width: 32px; height: 32px; border-radius: var(--radius-sm);
  display: grid; place-items: center; color: var(--muted-foreground); }
.rb.on { background: var(--selection); color: var(--foreground); }
.rb.on::before { content: ""; position: absolute; left: -6px; top: 7px; bottom: 7px; width: 2px;
  border-radius: 1px; background: var(--primary); }

.side { width: 280px; flex-shrink: 0; display: flex; flex-direction: column; min-height: 0;
  background: var(--card); border-right: 1px solid var(--border); }
.side-head { height: 36px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px;
  border-bottom: 1px solid var(--border); font-weight: 600; }
.side-scroll { flex: 1; min-height: 0; overflow: auto; }
.side-scroll.pad { padding: 8px; }
.side-foot { height: 40px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px;
  border-top: 1px solid var(--border); }
.sp-actions { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
.obtn { height: 24px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px;
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--background);
  font-size: var(--text-meta); }
.search { height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 12px; margin-bottom: 4px;
  border: 1px solid var(--border); border-radius: 999px; background: var(--background);
  color: var(--muted-foreground); font-size: var(--text-meta); }
.grp { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--muted-foreground); }
.srow { height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: var(--radius-sm); }
.srow.on { background: var(--selection); }
.srow.nest { margin-left: 12px; }
.srow .rt { flex-shrink: 0; font-size: var(--text-meta); color: var(--muted-foreground); }
.frow { height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 8px; font-weight: 600; }
.dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.dot.run { background: var(--status-running); }
.dot.idle { border: 1px solid var(--muted-foreground); }

/* ---------------- terminal surface (left dock, Q003) ---------------- */
.term-body { flex: 1; min-height: 0; overflow: auto; padding: 10px 12px; font-family: var(--font-mono);
  font-size: var(--text-code); line-height: 1.7; color: var(--foreground); background: var(--background); }
.term-line { white-space: pre-wrap; overflow-wrap: anywhere; }
.term-cwd { color: var(--muted-foreground); }
.term-cursor { display: inline-block; width: 6px; background: var(--foreground); animation: spin 1s steps(1) infinite alternate; opacity: 0.8; }
@keyframes blink { 50% { opacity: 0; } }

/* ---------------- terminal, variant 2: whole-column switch (supplementary
   variant, matches 1.0.x's GUI/TUI swap of the whole centre column) ---------------- */
.column-terminal { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--background); }
.colterm-head { height: 36px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px;
  border-bottom: 1px solid var(--border); font-weight: 600; }
.colterm-head .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.colterm-head .hint { font-weight: 400; font-size: var(--text-meta); color: var(--muted-foreground); }

.center { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
.sessionbar { height: 36px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 8px;
  border-bottom: 1px solid var(--border); }
.sessionbar .title { font-weight: 600; white-space: nowrap; }
.vsep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }
.timeline { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px 16px; }
.col { width: 100%; max-width: 720px; margin: 0 auto; }
.dock { flex-shrink: 0; padding: 0 24px 14px; position: relative; z-index: 5; }
.empty-tl { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; color: var(--muted-foreground); text-align: center; }
.empty-tl .i { width: 32px; height: 32px; opacity: 0.5; }
.empty-tl p:first-of-type { color: var(--foreground); font-size: var(--text-chat-body); }

/* ghost chip / icon button (design-system: no border, hover fill, h-6, rounded-sm) */
.gbtn { height: 24px; display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; flex-shrink: 0;
  border-radius: var(--radius-sm); font-size: var(--text-meta); white-space: nowrap;
  transition: background-color 150ms; }
.gbtn:hover, .gbtn:focus-visible { background: var(--hover); }
.gbtn[aria-pressed="true"] { background: var(--selection); }
.gbtn.ui { font-size: var(--text-ui); }
.gbtn.tight { padding: 0 6px; }
.gbtn.disabled { opacity: 0.5; cursor: not-allowed; }
.ibtn { width: 24px; height: 24px; flex-shrink: 0; display: inline-grid; place-items: center;
  border-radius: var(--radius-sm); color: var(--muted-foreground); transition: background-color 150ms; }
.ibtn:hover, .ibtn:focus-visible { background: var(--hover); color: var(--foreground); }
.cbadge { display: inline-flex; align-items: center; justify-content: center; height: 16px; min-width: 16px;
  padding: 0 4px; border-radius: 999px; background: var(--primary); color: var(--primary-foreground);
  font-size: 11px; font-weight: 500; }

/* ---------------- timeline ---------------- */
.turns { display: flex; flex-direction: column; gap: 20px; }
.turn { display: flex; flex-direction: column; gap: 12px; }
.turn.settled { padding-bottom: 24px; }
.bubble-row { display: flex; justify-content: flex-end; }
.bubble { min-width: 0; max-width: 80%; padding: 8px 14px; border: 1px solid var(--input);
  border-radius: var(--radius-md); border-top-right-radius: var(--radius-xs); background: var(--accent);
  font-size: var(--text-chat-body); line-height: 1.5; }
.clock { display: flex; align-items: center; gap: 6px; padding: 4px 0; font-size: var(--text-ui);
  color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.divider { display: flex; align-items: center; gap: 8px; padding-top: 4px; font-size: var(--text-meta);
  color: var(--muted-foreground); }
.divider::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
.answer { font-size: var(--text-chat-body); line-height: 1.625; }
.answer code { font-family: var(--font-mono); font-size: 0.85em; padding: 1px 4px; border-radius: var(--radius-xs);
  background: var(--muted); border: 1px solid var(--border); }
.zone { display: flex; align-items: center; gap: 6px; font-size: var(--text-ui); color: var(--muted-foreground);
  font-variant-numeric: tabular-nums; }
.proc { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: baseline; gap: 6px; min-width: 0; font-size: var(--text-chat-process);
  line-height: 1.5; color: var(--tool-arg); }
.row > .i { width: 13px; height: 13px; align-self: center; opacity: 0.8; }
.row.fail { color: var(--destructive); }
.row .arg { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .dim { color: color-mix(in oklab, currentColor 55%, var(--background)); }
.row .rtail { flex-shrink: 0; font-size: var(--text-meta); }
.lane { margin: -2px 0 0 2px; padding-left: 14px; border-left: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 4px; }
.autohead { display: flex; align-items: center; gap: 8px; font-size: var(--text-meta); color: var(--muted-foreground); }
.autohead .rule { flex: 1; border-top: 1px solid var(--border); }

/* ---------------- decision 090: todo + goal strips above the composer ---------------- */
/* Same wrapper contract as the queue strip: queueStripWrapperClass() =
   'mb-2 flex flex-col gap-1', rows 'h-7 rounded-sm border bg-muted/50 text-meta'.
   The background-jobs strip from decision 068 is REMOVED here: jobs and
   subagents moved into the floating/embedded sub-windows below (decision 090). */
.strips { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
.strips:empty { display: none; }
.strip { position: relative; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: color-mix(in oklab, var(--muted) 50%, transparent); font-size: var(--text-meta); line-height: 1.5; }
.strip-head { height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 1px 0 8px; cursor: pointer; }
.strip-head > .i { width: 14px; height: 14px; color: var(--muted-foreground); }
.strip-head > .i.run { color: var(--status-running); }
.strip-head .lbl { min-width: 0; flex: 1 1 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strip-head .acts { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.strip-body { padding: 0 8px 6px; }
.todo { height: 24px; display: flex; align-items: center; gap: 8px; padding-left: 20px; }
.todo .i { width: 14px; height: 14px; }
.todo.done { color: var(--muted-foreground); }
.todo.done .trunc { text-decoration: line-through; }
.goal-full { padding: 2px 0 2px 20px; }
.goal-full .m { font-size: var(--text-meta); }
.menu-anchor { position: relative; display: inline-flex; }
.menu { position: absolute; right: 0; bottom: calc(100% + 4px); z-index: 30; min-width: 168px; padding: 4px;
  border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--popover);
  box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
.menu button { width: 100%; min-height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 8px;
  border-radius: var(--radius-sm); font-size: var(--text-ui); text-align: left; }
.menu button:hover { background: var(--accent); }
.menu .danger { color: var(--destructive); }

/* ---------------- composer ---------------- */
.composer { display: flex; flex-direction: column; gap: 8px; min-height: 74px; padding: 8px;
  border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card); }
.composer .ph { height: 25.5px; line-height: 25.5px; font-size: var(--text-chat-body); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; color: color-mix(in oklab, var(--muted-foreground) 72%, transparent); }
.cbar { height: 24px; display: flex; align-items: center; gap: 8px; }
.chip { height: 24px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: var(--radius-sm);
  font-size: var(--text-ui); white-space: nowrap; }
.rbtn { width: 24px; height: 24px; flex-shrink: 0; display: grid; place-items: center; border-radius: 999px; }
.rbtn.send { background: var(--foreground); color: var(--background); }
.rbtn.stop { background: var(--destructive); color: var(--destructive-foreground); }
.rbtn.off { opacity: 0.64; }
.target { margin-top: 8px; height: 24px; display: flex; align-items: center; gap: 4px; }

/* ---------------- sub-windows: background jobs / subagents (decision 090) ---------------- */
.subwin-layer { position: absolute; inset: 0; pointer-events: none; z-index: 15; }
/* `overflow: hidden` is a defence-in-depth clip: the real fix for the header
   overflow bug (coordinator round 2, defect 1) is the two-line head below
   (min-width:0 + ellipsis on the title, icon-only "stop all"), but nothing
   here is EVER allowed to spill past the card into the timeline again. */
.subwin { pointer-events: auto; display: flex; flex-direction: column; border: 1px solid var(--border);
  border-radius: var(--radius-lg); overflow: hidden; background: var(--card);
  box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1); }
.subwin.floating, .subwin.docked { position: absolute; }
.subwin.embedded { border-radius: 0; }
/* Docked is flush against the right edge of .center: square off that side so
   it visually reads as "attached", not "floating with a corner cut off". */
.subwin.docked { border-radius: var(--radius-lg) 0 0 var(--radius-lg); border-right: 0; }
.subwin.anno-outline { outline: 1.5px dashed var(--anno); outline-offset: 1px; }
/* Two-line head (coordinator round 2, defect 1): a single 32px row does not
   fit icon + title + count + "stop all" + close inside a 300-340px window
   without either the title or the trailing buttons overflowing the card.
   Line 1 is title + close ONLY (close must never be pushed out); line 2 is
   count + actions. Both lines truncate via min-width:0, never the buttons. */
.subwin-head-l1 { height: 30px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 8px;
  border-bottom: 1px solid var(--border); }
.subwin-head-l1[data-drag] { cursor: grab; }
.subwin-head-l1 .grip { display: inline-flex; flex-shrink: 0; color: var(--muted-foreground); }
.subwin-head-l1 .lbl { min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-weight: 600; }
.subwin-head-l1 .fallback-note { min-width: 0; flex-shrink: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-weight: 400; font-size: 11px; }
.subwin-head-l2 { min-height: 26px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 8px;
  font-size: var(--text-meta); color: var(--muted-foreground); border-bottom: 1px solid var(--border); }
.subwin-head-l2 .cnt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subwin-head-l2 .jacts { flex-shrink: 0; display: flex; gap: 2px; }
.subwin-body { flex: 1; min-height: 0; overflow: auto; padding: 4px 4px 6px; }
.subwin-empty { padding: 20px 8px; text-align: center; color: var(--muted-foreground); font-size: var(--text-meta); }

/* embedded form: a fixed-height flex child between .timeline and .dock, so it
   reflows the layout instead of overlaying it (structurally cannot cover the
   dock — see README "两种形态的取舍"). */
.embedded-drawer { flex-shrink: 0; display: flex; flex-direction: column; border-top: 1px solid var(--border);
  background: var(--card); }
.embedded-drawer .subwin.embedded { flex: 1 1 0; min-height: 84px; border: 0; border-radius: 0; box-shadow: none; }
.embedded-drawer .subwin.embedded + .subwin.embedded { border-top: 1px solid var(--border); }

/* job / agent rows inside a sub-window (same visual language as the retired
   jobs strip, decision 068's §4, just re-hosted). Two lines, like .arow below:
   a single 28px line does not fit id + label + status + result + two action
   buttons inside a 300-340px sub-window without hiding the command label. */
.jrow { padding: 3px 8px; border-radius: var(--radius-sm); }
.jrow:hover { background: var(--hover); }
.jrow-l1 { height: 24px; display: flex; align-items: center; gap: 6px; }
.jrow-l1 .jid { flex-shrink: 0; color: var(--muted-foreground); }
.jrow-l1 .jlabel { min-width: 0; flex: 1 1 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jrow-l1 .jtime { flex-shrink: 0; text-align: right; color: var(--muted-foreground); }
.jrow-l2 { height: 24px; display: flex; align-items: center; gap: 6px; padding-left: 20px; font-size: var(--text-meta); color: var(--muted-foreground); }
.jrow-l2 .jacts { margin-left: auto; display: flex; gap: 2px; flex-shrink: 0; }
.badge { display: inline-flex; align-items: center; height: 18px; padding: 0 5px; border: 1px solid var(--border);
  border-radius: var(--radius-xs); font-size: 12px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
.tail { margin: 0 0 6px 30px; padding-left: 12px; border-left: 1px solid var(--border); }
.tail-title { font-size: var(--text-meta); color: var(--muted-foreground); }
.tail pre { margin: 0; max-height: 160px; overflow: auto; font-family: var(--font-mono); font-size: var(--text-code);
  line-height: 1.55; color: var(--muted-foreground); white-space: pre-wrap; overflow-wrap: anywhere; }
.mini-lane { display: flex; flex-direction: column; gap: 2px; font-size: var(--text-meta); color: var(--muted-foreground); }

.arow { padding: 3px 8px; border-radius: var(--radius-sm); }
.arow:hover { background: var(--hover); }
.arow-l1 { height: 24px; display: flex; align-items: center; gap: 6px; }
.arow-l1 .name { flex-shrink: 0; font-weight: 500; }
.arow-l2 { height: 24px; display: flex; align-items: center; gap: 2px; padding-left: 20px; font-size: var(--text-meta);
  color: var(--muted-foreground); }
.arow-l2 .gbtn { color: var(--foreground); padding: 0 6px; }

/* ---------------- small-screen collapse (app.compact = 1280 / 1024 preset) ---------------- */
.app.compact .lbltext { display: none; }
.app.compact .gbtn.ui { padding: 0 6px; }

/* ---------------- prototype annotations (not UI) ---------------- */
.anno-layer { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
.anno-bracket { position: absolute; width: 10px; border: 1.5px solid var(--anno); border-left: 0;
  border-radius: 0 3px 3px 0; }
.anno-guide { position: absolute; height: 0; border-top: 1px dashed var(--anno); opacity: 0.7; }
.anno-label { position: absolute; transform: translateY(-50%); width: 158px; color: var(--anno);
  font-size: 13px; line-height: 1.45; font-weight: 600; font-variant-numeric: tabular-nums; }
.anno-label b { font-size: 18px; }
.anno-label small { display: block; font-size: 12px; font-weight: 400; color: var(--muted-foreground); }
.anno-tag { display: inline-flex; align-items: center; height: 16px; padding: 0 4px; margin-left: 6px;
  border: 1px dashed var(--anno); border-radius: var(--radius-xs); color: var(--anno); font-size: 11px;
  letter-spacing: 0.02em; font-weight: 500; flex-shrink: 0; }
</style>

  function dockedFits() {

  // ---------------- todo + goal strips (decision 090, revises 068) ----------------
  function strip(key, icon, iconCls, label, acts, body, title = '') {
    const open = state.ui.stripsOpen[key];

      </div>${open ? body : ''}</div>`;
  }

  function todoStrip() {
    const done = TODOS.filter((t) => t.s === 'done').length;
    const doing = TODOS.filter((t) => t.s === 'doing');
    const cur = doing.length > 1 ? `${doing[0].t} 等 ${doing.length} 项` : doing[0]?.t;
    const label = done === TODOS.length
      ? `待办 <span class="tnum">${done}/${TODOS.length}</span> 已完成`
      : `待办 <span class="tnum">${done}/${TODOS.length}</span><span class="m"> · 正在：</span>${cur}`;
    const iconFor = { done: 'circle-check', doing: 'circle-dot', pending: 'circle' };
    const body = `<div class="strip-body">${TODOS.map((t) =>
      `<div class="todo ${t.s === 'pending' ? '' : t.s}">${ic(iconFor[t.s])}<span class="trunc">${t.t}</span></div>`).join('')}</div>`;
    return strip('todo', 'list-checks', '', label, '', body);
  }

  function goalStrip() {
    const mode = state.ui.goalMode;
    const g = GOAL_STATES[mode];
    const menu = state.ui.menu ? `<div class="menu" role="menu">
        <button data-act="menu-item">${ic('pencil', 's14 m')}编辑目标…</button>

  function tailContent(j) {
    if (j.kind === 'cmd') {
      return `<div class="tail"><div class="tail-title">${j.id} 输出 · 最近 16 KB</div><pre>${esc(TAILS[j.id] || '')}</pre></div>`;
    }
    const lines = j.kind === 'agent' ? (j.activity || []) : (j.stages || []);
    const title = j.kind === 'agent' ? '最近活动（非字节尾部，取子代理活动事件）' : '阶段（非字节尾部）';
    return `<div class="tail"><div class="tail-title">${title}</div><div class="mini-lane">${lines.map((l) => `<div>${esc(l)}</div>`).join('')}</div></div>`;
  }
  function jrow(j) {
    const isCmd = j.kind === 'cmd';
    const isContinuable = j.kind === 'agent' && j.continuable;
    const killed = state.ui.killed[j.id];
    const status = killed ? (isContinuable ? '已打断' : '已停止')
      : { running: '运行中', completed: '已完成', failed: '失败' }[j.status];
    const res = j.exit != null ? `<span class="badge tnum">退出码 ${j.exit}</span>` : '';
    // Only the timeout-conversion provenance needs a tag; kind already reads
    // "workflow" / "子代理" via idLabel, a second "workflow" badge is noise.
    const tag = j.origin === 'timeout' ? '<span class="badge">超时转入</span>' : '';
    const tailOpen = !!state.ui.tails[j.id];
    const running = j.status === 'running' && !killed;
    const expandLabel = isCmd ? '输出' : j.kind === 'agent' ? '活动' : '阶段';
    let acts;
    if (running) {
      const stopVerb = isContinuable ? gbtn('hand', '打断', 'job-stop', j.id, null, 'tight') : gbtn('square', '停止', 'job-stop', j.id, null, 'tight');
      acts = gbtn('scroll-text', expandLabel, 'tail', j.id, tailOpen, 'tight') + stopVerb;
    } else {
      acts = gbtn('scroll-text', expandLabel, 'tail', j.id, tailOpen, 'tight') + gbtn('eye-off', '移除', 'job-remove', j.id, null, 'tight');
    }
    const icon = { cmd: 'square-terminal', agent: 'users', workflow: 'workflow' }[j.kind];
    const idLabel = isCmd ? j.id : j.kind === 'workflow' ? 'workflow' : '子代理';
    return `<div class="jrow">
      <div class="jrow-l1">${ic(icon)}<span class="jid ${isCmd ? 'mono' : ''}">${idLabel}</span>
        <span class="jlabel ${isCmd ? 'mono' : ''}" title="${esc(j.label)}">${j.label}</span>
        <span class="jtime tnum">${j.time}</span></div>
      <div class="jrow-l2"><span>${status}</span>${tag}${res}<span class="jacts">${acts}</span></div>

  }
  /**
   * Shared sub-window chrome. Two-line head, always — see the CSS comment on
   * `.subwin-head-l1/l2` (coordinator round 2, defect 1): a single line does
   * not fit icon + title + count + actions + close inside a 300-340px window
   * without something overflowing the card. Line 1 = title + close (never
   * truncated away); line 2 = count + actions (both can truncate/shrink).
   * `formOverride` lets a caller render a window as plain "floating" even
   * while the user's saved preference is "docked" (the docked-does-not-fit
   * fallback, see `effectiveForm()`); `fallbackNote` prints why, inline.
   */
  function subwinShell(key, icon, titleHtml, countHtml, headActs, bodyHtml, formOverride, fallbackNote) {
    const form = formOverride || effectiveForm();
    const tag = state.anno ? '<span class="anno-tag">新增</span>' : '';
    const draggable = form === 'floating';
    const grip = draggable ? `<span class="grip">${ic('grip-horizontal', 's14')}</span>` : '';
    const note = fallbackNote ? `<span class="m fallback-note">（空间不够，已按浮动显示）</span>` : '';
    return `<div class="subwin ${form}${state.anno ? ' anno-outline' : ''}" data-win="${key}" data-form="${form}" id="win-${key}">
      <div class="subwin-head-l1" ${draggable ? `data-drag="${key}"` : ''}>
        ${grip}${ic(icon, 's14 m')}<span class="lbl">${titleHtml}</span>${note}${tag}<span class="grow"></span>
        <button class="ibtn" data-act="close-${key}" aria-label="关闭">${ic('x', 's14')}</button>
      </div>
      <div class="subwin-head-l2"><span class="cnt">${countHtml}</span><span class="grow"></span><span class="jacts">${headActs}</span></div>
      <div class="subwin-body">${bodyHtml}</div>
    </div>`;
  }
  function jobsWindow(list, formOverride, fallbackNote) {
    const items = list.filter((j) => !state.ui.removed[j.id]);
    const running = items.filter((j) => j.status === 'running' && !state.ui.killed[j.id]).length;
    const ended = items.length - running;
    const body = items.length ? items.map(jrow).join('') : '<div class="subwin-empty">当前没有后台任务</div>';
    // Icon-only "stop all" (defect 1 fix option 2, combined with the two-line
    // head for extra margin): a text button here was the single biggest
    // contributor to the header overflowing a 300-340px window.
    const stopAll = running > 1
      ? `<button class="ibtn" data-act="jobs-stop-all" title="全部停止" aria-label="全部停止">${ic('square', 's14')}</button>` : '';
    const count = items.length ? `${running} 运行中${ended ? ` · ${ended} 已结束` : ''}` : '';
    return subwinShell('jobs', 'layers', '后台任务', count, stopAll, body, formOverride, fallbackNote);
  }

  // ---------------- subagents sub-window (decision 090) ----------------
  function arow(s) {

  // ---------------- overlay window layout (shared by floating + docked) ----------------
  // Both stack top-right inside `.center` and share the same "stop above the
  // dock, split available height in two when both are open" rule (coordinator
  // round 2, defect 2 asks this to be MEASURED, not just eyeballed — see
  // `measure()`'s `coversMessages` check below). They differ only in the
  // horizontal anchor/width and in whether dragging is allowed.
  function layoutOverlayWindows(mode) {
    const layer = $('#floatLayer');
    const wins = [...layer.querySelectorAll('.subwin.floating, .subwin.docked')];
    if (!wins.length) return;
    const centerEl = $('#center');
    const centerRect = centerEl.getBoundingClientRect();
    const sessionbarH = $('.sessionbar').getBoundingClientRect().height;
    const dockRect = $('#dock').getBoundingClientRect();
    const dockTop = dockRect.top - centerRect.top;
    const top0 = sessionbarH + 8;
    const gap = 8;
    const rightGap = mode === 'docked' ? 0 : 12;
    const winWidth = mode === 'docked' ? DOCK_PANEL_WIDTH : (state.size === '1024' ? 300 : 340);
    const bottomSafe = dockTop - gap; // overlay windows must stop above this line
    const availH = Math.max(96, bottomSafe - top0);
    const perH = wins.length === 2 ? Math.floor((availH - gap) / 2) : availH;
    let cursorTop = top0;
    for (const win of wins) {
      const key = win.dataset.win;
      const h = Math.max(88, Math.min(perH, 420));
      const isDraggable = win.classList.contains('floating');
      const saved = isDraggable ? state.ui.pos[key] : null; // docked ignores manual drag positions
      win.style.width = winWidth + 'px';
      win.style.maxHeight = h + 'px';
      if (saved) {
        win.style.top = saved.top + 'px';
        win.style.left = saved.left + 'px';
        win.style.right = 'auto';
      } else {
        win.style.top = cursorTop + 'px';
        win.style.right = rightGap + 'px';
        win.style.left = 'auto';
      }
      cursorTop += h + gap;
    }
  }

  // ---------------- sub-window mount (floating / embedded drawer / docked) ----------------
  function renderSubwindows(jobsList, agentsList) {
    const openJobs = state.ui.open.jobs;
    const openAgents = state.ui.open.agents;
    const floatLayer = $('#floatLayer');
    const embedSlot = $('#embeddedSlot');
    const tl = $('#timeline');
    const eff = effectiveForm();

    if (eff === 'embedded') {
      tl.style.paddingRight = '';
      floatLayer.innerHTML = '';
      embedSlot.innerHTML = (openJobs || openAgents)
        ? `<div class="embedded-drawer" id="embedDrawer">${openJobs ? jobsWindow(jobsList, 'embedded') : ''}${openAgents ? agentsWindow(agentsList, 'embedded') : ''}</div>`
        : '';
      const drawer = $('#embedDrawer');
      if (drawer) {
        const centerH = $('#center').getBoundingClientRect().height;
        const both = openJobs && openAgents;
        const h = Math.round(Math.min(centerH * (both ? 0.42 : 0.3), both ? 340 : 220));
        drawer.style.height = Math.max(120, h) + 'px';
      }
      return;
    }

    // floating, or docked (possibly folded back to floating — `eff` already
    // reflects that; `dockedFallback` only controls the inline explanatory note).
    embedSlot.innerHTML = '';
    const dockedFallback = state.form === 'docked' && eff === 'floating';
    floatLayer.innerHTML = [
      openJobs ? jobsWindow(jobsList, eff, dockedFallback) : '',
      openAgents ? agentsWindow(agentsList, eff, dockedFallback) : '',
    ].join('');
    layoutOverlayWindows(eff);
    tl.style.paddingRight = eff === 'docked' ? `${24 + DOCK_PANEL_WIDTH + DOCK_GAP}px` : '';
  }

  // ---------------- measurement + annotation ----------------
  // Selector for "a piece of message content a user is meant to read", used
  // by the defect-2 coverage check below: bubbles, answer text, tool rows,
  // dividers, auto-turn heads, notices, the turn clock/zone lines.
  const MSG_SELECTOR = '.timeline .bubble, .timeline .answer, .timeline .divider, .timeline .row, '
    + '.timeline .autohead, .timeline .notice, .timeline .clock, .timeline .zone';
  /** True when any child of the window's head row is wider than the row
   * itself — i.e. something (typically the trailing buttons) is being pushed
   * outside the card instead of wrapping/truncating (coordinator round 2,
   * defect 1). */
  function headRowOverflows(win) {
    return [...win.querySelectorAll('.subwin-head-l1, .subwin-head-l2')]
      .some((row) => row.scrollWidth > row.clientWidth + 0.5);
  }
  /** Which visible timeline message elements a sub-window's rect visually
   * intersects (coordinator round 2, defect 2). Returns human-readable
   * `tag:"snippet"` strings, not just a count, so the README/report can name
   * exactly what is covered instead of asserting a bare boolean. */
  function coveredMessages(rect) {
    const hits = [];
    for (const el of document.querySelectorAll(MSG_SELECTOR)) {
      const r = el.getBoundingClientRect();
      if (r.width === 0 || r.height === 0) continue;
      const intersects = r.left < rect.right && r.right > rect.left && r.top < rect.bottom && r.bottom > rect.top;
      if (intersects) {
        const text = (el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 24);
        hits.push(`${el.className.split(' ')[0]}:"${text}"`);
      }
    }
    return hits;
  }
  function measure() {
    if (state.ui.open.terminal && state.termPos === 'column') {
      // Whole-column terminal (variant 2): timeline/strips/dock/sub-windows
      // are all hidden, nothing here applies. Report a minimal, honest shape
      // rather than stale numbers from before the switch.
      return {
        scene: state.scene, theme: state.theme, form: state.form, size: state.size, termPos: state.termPos,
        columnTerminal: true, strips: 0, expanded: [], perStripPx: [], stripsPx: 0, gapBelowPx: 0, addedPx: 0,
        timelinePxWithout: 0, timelinePxWith: 0, dockTopPx: 0, centerHeightPx: 0, subwindows: [],
        embeddedDrawerPx: null, anyOverlap: false, anyHeaderOverflow: false, anyMessageCovered: false,
        anyMessageCoveredUnexpected: false,
      };
    }
    const strips = $('#strips');
    const tl = $('#timeline');
    const kids = [...strips.children];
    const n = kids.length;
    const stripsPx = n ? strips.getBoundingClientRect().height : 0;
    const gapBelowPx = n ? parseFloat(getComputedStyle(strips).marginBottom) : 0;
    const timelineWith = tl.clientHeight;
    strips.style.display = 'none';
    const timelineWithout = tl.clientHeight;
    strips.style.display = '';
    // Always finish on the correct bottom-scrolled state before reading any
    // message-element geometry below, regardless of how many times this runs:
    // render() calls it once per paint, and shoot.cjs calls it once more,
    // externally, after the page has already settled — the strips hide/show
    // above can otherwise leave a stale scrollTop (see git history for the
    // long version of this note).
    tl.scrollTop = tl.scrollHeight;
    const centerRect = $('#center').getBoundingClientRect();
    const dockRect = $('#dock').getBoundingClientRect();
    const eff = effectiveForm();
    const subwindows = [...document.querySelectorAll('.subwin')].map((w) => {
      const r = w.getBoundingClientRect();
      return {
        id: w.dataset.win, form: w.dataset.form || eff,
        top: px(r.top - centerRect.top), left: px(r.left - centerRect.left),
        width: px(r.width), height: px(r.height), bottom: px(r.bottom - centerRect.top),
        overlapsDock: r.bottom > dockRect.top + 0.5,
        headerOverflow: headRowOverflows(w),
        coversMessages: coveredMessages(r),
      };
    });
    const embedDrawer = document.getElementById('embedDrawer');
    return {
      scene: state.scene, theme: state.theme, form: state.form, effectiveForm: eff, size: state.size,
      termPos: state.termPos, columnTerminal: false,
      strips: n,
      expanded: Object.keys(state.ui.stripsOpen).filter((k) => state.ui.stripsOpen[k] && kids.some((el) => el.dataset.strip === k)),
      perStripPx: kids.map((el) => ({ strip: el.dataset.strip, px: px(el.getBoundingClientRect().height) })),
      stripsPx: px(stripsPx),
      gapBelowPx,
      addedPx: px(n ? stripsPx + gapBelowPx : 0),
      timelinePxWithout: timelineWithout,
      timelinePxWith: timelineWith,
      dockTopPx: px(dockRect.top - centerRect.top),
      centerHeightPx: px(centerRect.height),
      subwindows,
      embeddedDrawerPx: embedDrawer ? px(embedDrawer.getBoundingClientRect().height) : null,
      anyOverlap: subwindows.some((w) => w.overlapsDock),
      anyHeaderOverflow: subwindows.some((w) => w.headerOverflow),
      // Floating windows are EXPECTED to be able to cover timeline content —
      // that is the documented trade-off (README). embedded/docked promise
      // NOT to, so coverage from those two is a real bug, not a trade-off.
      anyMessageCovered: subwindows.some((w) => w.coversMessages.length > 0),
      anyMessageCoveredUnexpected: subwindows.some((w) => w.coversMessages.length > 0 && w.form !== 'floating'),
    };
  }
  window.__measure = measure;

  function drawAnno(m) {
    const layer = $('#anno');
    layer.innerHTML = '';
    if (!state.anno || !m.strips) return;
    const center = $('#center').getBoundingClientRect();
    const sr = $('#strips').getBoundingClientRect();
    const top = sr.top - center.top;
    const h = m.addedPx;
    const x = sr.right - center.left + 12;
    const what = m.strips === 2 ? '两条' : '一条';
    const state2 = m.expanded.length ? '（含展开）' : '（折叠）';
    layer.innerHTML = `
      <div class="anno-guide" style="left:${sr.left - center.left}px;width:${sr.width + 12}px;top:${top}px"></div>
      <div class="anno-guide" style="left:${sr.left - center.left}px;width:${sr.width + 12}px;top:${top + h}px"></div>
      <div class="anno-bracket" style="left:${x}px;top:${top}px;height:${h}px"></div>
      <div class="anno-label" style="left:${x + 18}px;top:${top + h / 2}px">
        输入框上方多占<br><b>${h} px</b>
        <small>${what}${state2} ${m.stripsPx} px</small>
        <small>+ 下方间距 ${m.gapBelowPx} px</small></div>`;
  }

  function renderNotes(m) {
    const n = NOTES[state.scene];
    if (m.columnTerminal) {
      $('#notes').innerHTML = `<h2>${n.title}</h2><p class="m">依据：${n.decisions}</p><p>${n.desc}</p>
        <ol>${n.ask.map((q) => `<li>${q}</li>`).join('')}</ol>
        <div class="measure">终端位置＝整列切换：时间线、待办/目标条、后台任务/子代理子窗口全部让位，与 1.0.x GUI/TUI 开关同形，故本场景下无高度/遮挡实测。</div>`;
      return;
    }
    const per = m.perStripPx.map((p) => `${{ todo: '待办', goal: '目标' }[p.strip]} ${p.px}`).join(' + ');
    const gaps = m.strips > 1 ? ` + 条间距 4 × ${m.strips - 1}` : '';
    const measureLine = m.strips
      ? `实测：${per}${gaps} = <b>${m.stripsPx} px</b>；再加与输入框之间的 ${m.gapBelowPx} px，输入框上方共多占 <b>${m.addedPx} px</b>。聊天区可视高度 ${m.timelinePxWithout} px → ${m.timelinePxWith} px（画幅 ${state.size}）。`
      : '本场景输入框上方没有待办 / 目标条。';
    const fmtCover = (hits) => hits.length ? `<b style="color:var(--destructive)"> · 盖住时间线内容 ${hits.length} 处：${hits.join('；')}</b>` : '';
    const winLines = m.subwindows.length
      ? m.subwindows.map((w) => `${w.id === 'jobs' ? '后台任务' : '子代理'}窗（${w.form}）：${w.width}×${w.height}px，底边距输入框上边界 ${px(m.dockTopPx - w.bottom)}px`
          + `${w.overlapsDock ? '<b style="color:var(--destructive)"> · 遮挡输入框！</b>' : ''}`
          + `${w.headerOverflow ? '<b style="color:var(--destructive)"> · 标题行溢出！</b>' : ''}`
          + fmtCover(w.coversMessages)).join('<br>')
      : '';
    $('#notes').innerHTML = `<h2>${n.title}</h2><p class="m">依据：${n.decisions}</p><p>${n.desc}</p>
      <ol>${n.ask.map((q) => `<li>${q}</li>`).join('')}</ol>
      <div class="measure">${measureLine}${winLines ? `<br>${winLines}` : ''}<br><span class="m">橙色虚线、括号与"新增"小标是原型标注，不属于界面。聊天区与左栏的其余内容只作背景，不在本次确认范围内。</span></div>`;
  }

  // ---------------- render ----------------
  function render() {
    const sc = SCENES[state.scene];
    document.documentElement.classList.toggle('dark', state.theme === 'dark');
    document.body.classList.toggle('shot', state.shot);
    document.querySelectorAll('#sceneSeg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.scene === state.scene)));
    document.querySelectorAll('#themeSeg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.theme === state.theme)));
    document.querySelectorAll('#formSeg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.form === state.form)));
    document.querySelectorAll('#termPosSeg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.termpos === state.termPos)));
    document.querySelectorAll('#goalSeg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.goal === state.ui.goalMode)));
    document.querySelectorAll('#sizeSeg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.size === state.size)));
    $('#annoChk').checked = state.anno;

    const dims = SIZES[state.size];
    document.documentElement.style.setProperty('--app-w', dims.w + 'px');
    document.documentElement.style.setProperty('--app-h', dims.h + 'px');
    $('#app').classList.toggle('compact', state.size !== '1440');

    const jobsList = sc.session === 'empty' ? [] : JOBS_MAIN;
    const agentsList = sc.session === 'empty' ? [] : SUBAGENTS_MAIN;
    const columnTerminal = state.ui.open.terminal && state.termPos === 'column';

    $('#rail').innerHTML = rail();
    // The whole-column terminal (variant 2) only ever replaces the CENTRE;
    // the left dock stays the normal chat/session list either way. The
    // left-dock terminal panel (variant 1) only applies in `termPos: panel`.
    $('#side').innerHTML = (state.ui.open.terminal && state.termPos === 'panel') ? terminalPanel(sc) : chatPanel(sc);
    $('#sessionbar').innerHTML = sessionbar(sc, jobsList, agentsList);

    $('#timeline').style.display = columnTerminal ? 'none' : '';
    $('#dock').style.display = columnTerminal ? 'none' : '';
    $('#columnTerminal').style.display = columnTerminal ? 'flex' : 'none';
    if (columnTerminal) {
      $('#columnTerminal').innerHTML = columnTerminalView(sc);
      $('#embeddedSlot').innerHTML = '';
      $('#floatLayer').innerHTML = '';
    } else {
      $('#columnTerminal').innerHTML = '';
      $('#timeline').innerHTML = sc.tl === 'empty' ? emptyTimeline() : `<div class="col"><div class="turns">${TIMELINES[sc.tl]().join('')}</div></div>`;
      $('#timeline').style.paddingRight = '';
      $('#strips').innerHTML = [sc.todo ? todoStrip() : '', state.ui.goalMode ? goalStrip() : ''].join('');
      $('#composer').innerHTML = composer(sc.running);
      renderSubwindows(jobsList, agentsList);
    }

    const m = measure(); // also finalizes tl.scrollTop — see the comment inside measure()
    drawAnno(m);
    renderNotes(m);
    const q = new URLSearchParams({ scene: state.scene, theme: state.theme, form: state.form, size: state.size });
    if (state.ui.goalMode) q.set('goal', state.ui.goalMode);
    if (state.termPos !== 'panel') q.set('termpos', state.termPos);
    if (!state.anno) q.set('anno', '0');
    if (state.shot) q.set('shot', '1');
    history.replaceState(null, '', `?${q}`);
  }

  // ---------------- interaction ----------------
  function act(name, id) {
    const ui = state.ui;
    if (name !== 'goal-menu') ui.menu = false;
    switch (name) {
      case 'goal-pause': ui.goalMode = 'paused'; break;
      case 'goal-resume': ui.goalMode = 'running'; break;
      case 'goal-menu': ui.menu = !ui.menu; break;
      case 'menu-item': break;
      case 'tail': ui.tails[id] = !ui.tails[id]; break;
      case 'job-stop': ui.killed[id] = true; break;
      case 'jobs-stop-all': JOBS_MAIN.forEach((j) => { if (j.status === 'running') ui.killed[j.id] = true; }); break;
      case 'job-remove': ui.removed[id] = true; break;
      case 'agent-interrupt': ui.killed[`agent-${id}`] = true; break;
      case 'toggle-terminal': ui.open.terminal = !ui.open.terminal; break;
      case 'toggle-jobs': ui.open.jobs = !ui.open.jobs; break;
      case 'toggle-agents': ui.open.agents = !ui.open.agents; break;
      case 'close-jobs': ui.open.jobs = false; break;
      case 'close-agents': ui.open.agents = false; break;
      case 'locate': locate(id); break;
      default: break;
    }
    render();
  }

  function locate(agentId) {
    const target = document.querySelector(`[data-agent="${agentId}"]`);
    if (!target) return;
    target.scrollIntoView({ block: 'center', behavior: 'auto' });
    target.classList.remove('flash');
    // eslint-disable-next-line no-void
    void target.offsetWidth; // restart the animation if clicked twice in a row
    target.classList.add('flash');
    setTimeout(() => target.classList.remove('flash'), 1400);
  }

  $('#app').addEventListener('click', (e) => {
    const a = e.target.closest('[data-act]');
    if (a) { e.stopPropagation(); act(a.dataset.act, a.dataset.id); return; }
    const t = e.target.closest('[data-toggle]');
    if (t) {
      const k = t.dataset.toggle;
      state.ui.stripsOpen[k] = !state.ui.stripsOpen[k];
      state.ui.menu = false;
      render();
      return;
    }
    if (state.ui.menu) { state.ui.menu = false; render(); }
  });

  // Drag-to-move for floating sub-windows (pointer events; clamped to .center).
  let dragCtx = null;
  document.addEventListener('pointerdown', (e) => {
    const head = e.target.closest('[data-drag]');
    if (!head || e.target.closest('[data-act]')) return;
    const key = head.dataset.drag;
    const win = head.closest('.subwin');
    const centerRect = $('#center').getBoundingClientRect();
    const r = win.getBoundingClientRect();
    dragCtx = { key, win, startX: e.clientX, startY: e.clientY, startLeft: r.left - centerRect.left, startTop: r.top - centerRect.top, centerRect, width: r.width, height: r.height };
    win.style.right = 'auto';
    win.style.left = dragCtx.startLeft + 'px';
    win.style.top = dragCtx.startTop + 'px';
  });
  document.addEventListener('pointermove', (e) => {
    if (!dragCtx) return;
    const dx = e.clientX - dragCtx.startX;
    const dy = e.clientY - dragCtx.startY;
    const left = Math.max(0, Math.min(dragCtx.startLeft + dx, dragCtx.centerRect.width - dragCtx.width));
    const top = Math.max(0, Math.min(dragCtx.startTop + dy, dragCtx.centerRect.height - 40));
    dragCtx.win.style.left = left + 'px';
    dragCtx.win.style.top = top + 'px';
  });
  document.addEventListener('pointerup', () => {
    if (!dragCtx) return;
    state.ui.pos[dragCtx.key] = { top: parseFloat(dragCtx.win.style.top), left: parseFloat(dragCtx.win.style.left) };
    dragCtx = null;
  });

  $('#sceneSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-scene]');
    if (!b) return;
    state.scene = b.dataset.scene;
    resetUi();
    render();
  });
  $('#themeSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-theme]');
    if (!b) return;
    state.theme = b.dataset.theme;
    render();
  });
  $('#formSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-form]');
    if (!b) return;
    state.form = b.dataset.form;
    state.ui.pos = { jobs: null, agents: null };
    render();
  });
  $('#termPosSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-termpos]');
    if (!b) return;
    state.termPos = b.dataset.termpos;
    render();
  });
  $('#goalSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-goal]');
    if (!b || state.ui.goalMode === null) return;
    state.ui.goalMode = b.dataset.goal;
    render();
  });
  $('#sizeSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-size]');
    if (!b) return;
    state.size = b.dataset.size;
    state.ui.pos = { jobs: null, agents: null };
    render();
  });
  $('#annoChk').addEventListener('change', (e) => { state.anno = e.target.checked; render(); });

  resetUi();
  render();
  // Re-measure once web fonts / fallback fonts have settled.
  document.fonts.ready.then(() => render());
})();
</script>
</body>
</html>
