<script>
(() => {
  'use strict';

  // ------------------------------------------------------------------ state
  const params = new URLSearchParams(location.search);
  const pick = (v, allowed, dflt) => (allowed.includes(v) ? v : dflt);
  const SHOT = params.get('shot') === '1';
  const st = {
    mode: pick(params.get('mode'), ['current', 'proposal', 'compare'], 'proposal'),
    l1: pick(params.get('l1'), ['A', 'B'], 'A'),
    temp: pick(params.get('temp'), ['X', 'Y'], 'X'),
    theme: pick(params.get('theme'), ['light', 'dark'], 'light'),
    w: pick(params.get('w'), ['280', '360', '500'], '280'),
    recent: pick(params.get('recent'), ['expanded', 'collapsed'], 'expanded'),
    scroll: pick(params.get('scroll'), ['top', 'mid', 'bottom'], 'top'),
    cjk: params.get('cjk') === '1',
    tall: params.get('tall') === '1',
    guides: params.get('guides') === '1',
    tip: params.get('tip') === '1',
    select: params.get('select') === '1',
  };
  if (SHOT) document.body.classList.add('shot');

  // ------------------------------------------------------------------- data
  // Synthetic: 26 repository folders (one empty) holding 54 chats, plus 4
  // temporary chats = 58 chats. Clock frozen so ages and screenshots are stable.
  const MIN = 60000;
  const NOW = new Date(2026, 9, 9, 15, 20, 0).getTime();
  const ACTIVE_ID = 's1';
  const SELECTED = new Set(['a2', 's4']); // multi-select demo
  const RECENT_WINDOW = 48 * 60 * MIN;
  const RECENT_LIMIT = 7;
  const FOLDER_LIMIT = 8;
  const D = 1440;

  const S = (id, title, ageMin, extra = {}) => ({ id, title, ageMin, ...extra });
  const F = (id, name, branch, sessions, extra = {}) => ({ id, name, branch, sessions, ...extra });
  const FOLDERS = [
    F('atlas', 'atlas-web', 'main', [
      S('a1', '为结算流程补充端到端测试用例', 25, { wt: 'feature/checkout-e2e-tests', unread: true }),
      S('a2', '优化首页首屏加载时间', 300),
      S('a3', '统一按钮组件的尺寸与圆角', 1800),
      S('a4', '修复暗色主题下的对比度不足', 3120),
      S('a5', '生成 API 文档并校对示例', 3 * D),
      S('a6', '分析错误日志中的高频异常', 5 * D),
      S('a7', '设计通知中心的数据结构', 7 * D),
      S('a8', '补全国际化词条中的英文残留', 14 * D),
      S('a9', '把表单校验逻辑抽成通用钩子', 21 * D),
      S('a10', 'New chat', 30 * D),
    ]),
    F('beacon', 'beacon-api', 'develop', [
      S('b1', '梳理权限审批的边界情况', 6, { status: 'waiting', bound: true, pending: 2 }),
      S('b2', '给速率限制补充集成测试', 2900),
    ], { diff: [12, 4] }),
    F('cobalt', 'cobalt-cli', 'main', [
      S('c1', '为子命令补全 shell 自动补全脚本', 660),
      S('c2', '修复 Windows 路径分隔符问题', 3 * D),
    ]),
    F('delta', 'delta-docs', 'main', [
      S('d1', '把 README 拆成多页文档站', 840),
      S('d2', '校对安装指南里的命令', 6 * D),
    ]),
    F('ember', 'ember-ui', 'main', [
      S('e1', '实现可折叠的侧边面板组件', 2400),
      S('e2', '补充组件快照测试', 7 * D),
    ]),
    F('fjord', 'fjord-sync', 'main', [
      S('f1', '设计离线同步的冲突解决策略', 3 * D),
      S('f2', '压测增量同步接口', 14 * D),
    ]),
    F('garnet', 'garnet-ml', 'main', [
      S('g1', '整理训练数据清洗脚本', 5 * D),
      S('g2', '评估模型推理延迟', 21 * D),
    ]),
    F('harbor', 'harbor-infra', 'main', [S('h1', '编写 Terraform 模块的变量说明', 2940)]),
    F('iris', 'iris-mobile', 'main', [S('i1', '修复安卓端键盘遮挡输入框', 4 * D)]),
    F('juniper', 'juniper-etl', 'main', [S('j1', '优化每日汇总任务的执行时间', 6 * D)]),
    F('kestrel', 'kestrel-auth', 'main', [S('k1', '接入短信验证码的限流', 7 * D)]),
    F('lumen', 'lumen-site', 'master', [
      S('l1', '整理本周发布说明草稿', 5 * D, { legacy: true }),
      S('l2', '更新落地页文案与配图说明', 8 * D),
    ]),
    F('mosaic', 'mosaic-design', 'main', [S('m1', '整理设计令牌命名规范', 14 * D)]),
    F('nimbus', 'nimbus-agent', 'main', [
      S('s1', '拉取远端更新', 0.2, { status: 'running', bound: true }),
      S('s2', '重构侧栏会话列表的层级与间距', 18, { bound: true, wt: 'feature/sidebar-hierarchy' }),
      S('s3', '修复登录页在弱网下反复跳转的问题', 180, { wt: 'fix/login-redirect-loop' }),
      S('s4', '解释这段正则为什么会回溯超时', 420),
      S('s5', '给 CLI 增加 --dry-run 参数', 1200),
      S('s6', 'New chat', 1560),
      S('s7', '写一份数据库索引优化方案', 3000),
      S('s8', '评估迁移到新版路由库的工作量', 3 * D),
      S('s9', '检查依赖许可证并生成清单', 4 * D),
      S('s10', '排查构建产物体积突然变大的原因', 6 * D),
      S('s11', '把图片上传改成分片续传', 9 * D),
      S('s12', '复查缓存失效策略的边界条件', 12 * D),
    ], { diff: [128, 36] }),
    F('onyx', 'onyx-billing', 'main', [S('o1', '核对账单导出的金额精度', 21 * D)]),
    F('pylon', 'pylon-gateway', 'main', [
      S('p1', '排查网关偶发 502 的原因', 540),
      S('p2', '梳理灰度发布的回滚步骤', 4 * D),
    ], { remote: true }),
    F('quartz', 'quartz-search', 'main', [
      S('q1', '调研流式输出卡顿的原因', 120, { status: 'failed' }),
      S('q2', '对比两种分词方案的召回率', 6 * D),
    ]),
    F('raven', 'raven-notify', 'main', [S('r1', '合并重复的推送通道配置', 30 * D)]),
    F('sable', 'sable-admin', 'main', [S('sa1', '给后台列表加批量操作', 32 * D)]),
    F('tundra', 'tundra-cache', 'main', [S('t1', '分析缓存命中率下降的原因', 60 * D)]),
    F('umber', 'umber-report', 'release/2026.10', [S('u1', '生成季度报表的图表模板', 5 * D)]),
    F('vertex', 'vertex-sdk', 'main', [S('v1', '为 SDK 增加重试与退避', 15 * D)]),
    F('willow', 'willow-blog', 'main', [S('w1', '迁移博客评论系统', 90 * D)]),
    F('xenon', 'xenon-bench', 'main', [S('x1', '搭建基准测试的对比看板', 42 * D)]),
    F('yarrow', 'yarrow-bot', 'main', [S('y1', '让机器人支持多轮追问', 120 * D)]),
    F('zephyr', 'zephyr-tools', 'main', []),
  ];
  const TEMP = [
    S('tmp1', '把这段 JSON 转成 TypeScript 类型', 240),
    S('tmp2', '比较两种排序算法的复杂度', 3 * D),
    S('tmp3', '帮我起草一份会议纪要模板', 7 * D),
    S('tmp4', 'New chat', 14 * D),
  ];

  const SESSIONS = [];
  const mk = (s, folder) => {
    const status = s.status || 'idle';
    return {
      ...s,
      folder,
      temp: !folder,
      updatedAt: NOW - Math.round(s.ageMin * MIN),
      status,
      busy: status === 'running' || status === 'waiting',
      failed: status === 'failed',
      bound: !!s.bound,
    };
  };
  for (const f of FOLDERS) for (const s of f.sessions) SESSIONS.push(mk(s, f));
  for (const s of TEMP) SESSIONS.push(mk(s, null));
  const byId = new Map(SESSIONS.map((s) => [s.id, s]));

  // ----------------------------------------------------------- derivations
  const byUpdated = (a, b) => b.updatedAt - a.updatedAt;
  // deriveActiveRows: host-bound or busy; busy first, then last activity.
  const activeRows = () =>
    SESSIONS.filter((s) => s.bound || s.busy).sort((a, b) => Number(b.busy) - Number(a.busy) || byUpdated(a, b));
  // deriveRecentRows: busy or touched within 48h, newest first.
  const recentAll = () => SESSIONS.filter((s) => s.busy || NOW - s.updatedAt <= RECENT_WINDOW).sort(byUpdated);
  // 方案: the lower segment, deduped against the upper one BEFORE the 7-row cap.
  const recentLower = () => {
    const upper = new Set(activeRows().map((s) => s.id));
    return recentAll().filter((s) => !upper.has(s.id));
  };
  const folderRows = (f) => SESSIONS.filter((s) => s.folder === f).sort(byUpdated);
  const tempRows = () => SESSIONS.filter((s) => s.temp).sort(byUpdated);
  // limitFolderRows: 8 rows; the selected chat is appended when it sorts past the cap.
  const limitRows = (rows) => {
    if (rows.length <= FOLDER_LIMIT) return { rows, hidden: 0 };
    const vis = rows.slice(0, FOLDER_LIMIT);
    const pinned = rows.slice(FOLDER_LIMIT).find((r) => r.id === ACTIVE_ID);
    if (pinned) vis.push(pinned);
    return { rows: vis, hidden: rows.length - vis.length };
  };

  // ------------------------------------------------------------ formatting
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  const attrNl = (s) => esc(s).replace(/\n/g, '&#10;');
  const shownTitle = (s) => (s.title === 'New chat' ? '新建对话' : s.title);
  // src/renderer/lib/relativeTime.ts formatRelativeAge
  const relAge = (ts) => {
    const diff = NOW - ts;
    const H = 60 * MIN, DAY = 24 * H;
    if (diff < MIN) return 'now';
    if (diff < H) return `${Math.floor(diff / MIN)}m`;
    if (diff < DAY) return `${Math.floor(diff / H)}h`;
    if (diff < 7 * DAY) return `${Math.floor(diff / DAY)}d`;
    if (diff < 30 * DAY) return `${Math.floor(diff / (7 * DAY))}w`;
    if (diff < 365 * DAY) return `${Math.floor(diff / (30 * DAY))}mo`;
    return `${Math.floor(diff / (365 * DAY))}y`;
  };
  // The proposed formatAbsoluteDateTime: always date + time (YYYY-MM-DD HH:MM).
  const absDateTime = (ts) => {
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  const branchOf = (s) => s.wt || (s.folder && s.folder.branch) || null;
  const whereOf = (s) =>
    s.temp ? '临时对话' : `${s.folder.name} · ${branchOf(s)}${s.folder.remote ? '（远程）' : ''}`;
  const tooltipProposal = (s) => `${shownTitle(s)}\n${whereOf(s)}\n更新于 ${absDateTime(s.updatedAt)}`;

  const ic = (name, cls = '') =>
    `<svg class="${cls}" data-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-${name}"/></svg>`;
  const iconBtn = (name, cls, label, iconCls = '') =>
    `<button type="button" data-slot="button" class="btn btn-ghost btn-icon-xs ${cls}" aria-label="${label}" title="${label}">${ic(name, iconCls)}</button>`;

  // ------------------------------------------------------- shared row bits
  const markerInner = (s) => {
    if (s.busy) {
      return s.status === 'waiting'
        ? '<span role="img" aria-label="等待审批" title="等待审批" class="h-1.5 w-1.5 shrink-0 rounded-full bg-warning"></span>'
        : ic('loader-circle', 'size-3 shrink-0 text-status-running spin');
    }
    if (s.unread) {
      return `<span role="img" aria-label="离开期间已完成" title="离开期间已完成" class="h-1.5 w-1.5 shrink-0 rounded-full ${s.failed ? 'bg-destructive' : 'bg-success'}"></span>`;
    }
    if (s.bound) {
      return '<span aria-hidden="true" title="正在后台运行" class="h-1.5 w-1.5 shrink-0 rounded-full border border-muted-foreground"></span>';
    }
    return '';
  };
  const checkbox = (s) => {
    const on = SELECTED.has(s.id);
    return `<span aria-hidden="true" class="flex size-3.5 shrink-0 items-center justify-center rounded-xs border ${on ? 'border-primary bg-primary text-primary-foreground' : 'border-border'}">${on ? ic('check', 'size-2.5') : ''}</span>`;
  };
  const LEGACY_HINT = '这个对话迁移到当前引擎之后，又在 1.0.x 里继续聊过。';
  const badges = (s, lg) => {
    let h = '';
    if (s.legacy) {
      h += `<span data-slot="badge" class="badge ${lg ? 'badge-lg' : 'badge-sm'} badge-warning shrink-0" title="${LEGACY_HINT}">1.0.x</span>`;
    }
    if (s.pending) {
      h += `<span data-slot="badge" class="badge ${lg ? 'badge-lg' : 'badge-sm'} badge-warning shrink-0 gap-0.5 tabular-nums" title="${s.pending} 个待审批请求">${ic('shield-question', lg ? 'size-3.5' : 'size-3')}${s.pending}</span>`;
    }
    if (s.failed) h += '<span data-slot="badge" class="badge badge-lg badge-destructive shrink-0">失败</span>';
    return h;
  };
  const timeAndActions = (s, proposal) => {
    const btn = proposal ? 'size-5' : 'h-5 w-5';
    const icn = proposal ? 'size-3.5' : 'h-3 w-3';
    return (
      `<span class="shrink-0 text-right text-meta text-muted-foreground tabular-nums group-hover:hidden group-focus-within:hidden w-10" data-level="4" data-time>${relAge(s.updatedAt)}</span>` +
      `<div class="hidden shrink-0 items-center justify-end group-hover:flex group-focus-within:flex w-10">` +
      iconBtn('archive', btn, '归档', icn) +
      iconBtn('x', btn, '从列表中移除', icn) +
      '</div>'
    );
  };

  // ============================================================ 现状 (today)
  // Class strings copied from LeftNav.tsx / LeftDock.tsx at a0320fe2.
  const chipCurrent = (s) => {
    let label;
    let kind = true;
    if (s.temp) label = '临时';
    else if (s.folder.remote) label = '远程';
    else {
      label = branchOf(s);
      kind = false;
    }
    return `<span data-slot="badge" class="badge ${kind ? 'badge-lg' : 'badge-sm'} badge-outline min-w-0 max-w-24 shrink" title="${esc(label)}" data-context><span class="min-w-0 truncate">${esc(label)}</span></span>`;
  };
  const rowCurrent = (s, depth) => {
    const active = s.id === ACTIVE_ID;
    return (
      `<div role="button" tabindex="0" class="group flex h-7 w-full items-center gap-1.5 overflow-hidden rounded-md px-2 text-left text-ui ${active ? 'bg-selection text-accent-foreground' : 'hover:bg-hover'}" title="${esc(shownTitle(s))}" data-row data-session="${s.id}" data-depth="${depth}" data-box="L3">` +
      (st.select ? checkbox(s) : markerInner(s)) +
      `<span class="min-w-20 flex-1 truncate" data-level="3" data-title data-align-depth="${depth}">${esc(shownTitle(s))}</span>` +
      badges(s, false) +
      chipCurrent(s) +
      timeAndActions(s, false) +
      '</div>'
    );
  };
  const sectionHeadCurrent = (label, trailing = '') =>
    `<div class="flex h-7 items-center px-2" data-box="L1"><p class="text-ui font-medium tracking-[0.04em] text-muted-foreground" data-level="1">${label}</p>${trailing}</div>`;
  const folderHeaderCurrent = (name, diff, withActions) =>
    `<div class="group flex h-7 w-full items-center gap-1 rounded-md px-2 text-ui hover:bg-hover" data-folder-row data-box="L2">` +
    `<button type="button" class="flex min-w-0 flex-1 items-center gap-1 text-left">${ic('folder-open', 'h-3.5 w-3.5 shrink-0 text-folder')}<span class="min-w-0 flex-1 truncate font-semibold" data-level="2" data-name data-align-depth="0">${esc(name)}</span></button>` +
    (withActions
      ? '<span class="grid shrink-0 justify-items-end">' +
        (diff

  const rail = () => {

    return (
      '<div class="flex min-w-0 flex-col" style="width:320px">' +
      '<div class="flex h-9 shrink-0 items-center gap-2 overflow-hidden border-b bg-card/40 px-2"><div class="flex min-w-0 items-center gap-1.5">' +
      `<span aria-hidden="true" class="size-1.5 shrink-0 rounded-full bg-status-running"></span><span class="${titleCls}" data-sessionbar-title>${esc(shownTitle(s))}</span></div></div>` +

  const appHtml = (mode, withCenter) =>

    `<div class="dock bg-card/40">${rail()}` +

    dockTitle(mode) +

    toolbar(mode) +

  const compareHtml = () =>

      .join('') +
    '</div>';

  // ------------------------------------------------------------ post-render
  const drawGuides = (root) => {
    const panel = root.querySelector('[data-panel]');
    const host = root.querySelector('[data-guides]');
    const W = Number(st.w);
    const lines = root.dataset.mode === 'proposal' ? [16, 38, 50, W - 1 - 16] : [16, 28, 34, W - 1 - 16];
    host.innerHTML = lines
      .map(
        (x, i) =>
          `<div class="guide" style="left:${x}px"></div><div class="guide-label" style="left:${x}px;top:${38 + (i % 2) * 16}px">${x === W - 1 - 16 ? 'R-16' : x}</div>`
      )
      .join('');
    host.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:50';
    void panel;
  };
  const drawTip = (root) => {
    const row = root.querySelector('[data-section="recent"] [data-row][data-session="a1"]');
    if (!row) return;
    const s = byId.get('a1');
    const rr = row.getBoundingClientRect();
    const ar = root.getBoundingClientRect();
    const title = row.querySelector('[data-title]').getBoundingClientRect();
    const card = document.createElement('div');
    card.className = 'tipcard';

      `<div>${esc(shownTitle(s))}</div><div class="tip-sub">${esc(whereOf(s))}</div><div class="tip-sub">更新于 ${absDateTime(s.updatedAt)}</div>` +
      '<div class="tip-note">原型示意：悬停提示的内容（实现用 title 多行文本）</div>';

    card.style.top = `${Math.round(rr.bottom - ar.top + 4)}px`;

  };
  const postRender = () => {
    for (const root of document.querySelectorAll('[data-proto-root]')) {
      const vp = root.querySelector('[data-viewport]');
      if (st.tall) {

      } else if (st.scroll === 'mid') {
        // Anchor: the folder holding the selected chat, 120px below the viewport top.
        const anchor = root.querySelector('[data-folder="nimbus"]');
        const delta = anchor.getBoundingClientRect().top - vp.getBoundingClientRect().top;
        vp.scrollTop = Math.round(vp.scrollTop + delta - 120);
      } else if (st.scroll === 'bottom') {
        vp.scrollTop = vp.scrollHeight;
      }

      if (st.tip && root.dataset.mode === 'proposal') drawTip(root);
    }
  };

  // --------------------------------------------------------------- measure
  const round1 = (n) => Math.round(n * 10) / 10;
  const round2 = (n) => Math.round(n * 100) / 100;
  const visible = (el) => el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden';
  const textOf = (el) => (el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 24);
  const CJK = /[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF\u3000-\u303F]/;
  const oklchL = (c) => {
    const m = /oklch\(\s*([\d.]+)/.exec(c);
    return m ? Number(m[1]) : null;
  };

  const measureRoot = (root) => {
    const mode = root.dataset.mode;
    const panel = root.querySelector('[data-panel]');
    const vp = root.querySelector('[data-viewport]');
    const pr = panel.getBoundingClientRect();
    const vr = vp.getBoundingClientRect();
    const relX = (x) => round1(x - pr.left);
    const W = Math.round(pr.width);
    const out = { mode, panelWidth: W, checks: {}, coords: {}, gaps: {}, titleWidths: {}, carriers: {} };

    // (1) nothing spills out of a row's content box
    const overflow = [];
    root
      .querySelectorAll('[data-row],[data-folder-row],[data-folder-row] > button,[data-box="L1"],[data-more],[data-sublabel]')
      .forEach((row) => {
        if (!visible(row)) return;
        const r = row.getBoundingClientRect();
        const cs = getComputedStyle(row);
        const lo = r.left + parseFloat(cs.borderLeftWidth) + parseFloat(cs.paddingLeft) - 0.5;
        const hi = r.right - parseFloat(cs.borderRightWidth) - parseFloat(cs.paddingRight) + 0.5;
        const spill = [];
        for (const c of row.children) {
          if (!visible(c) || getComputedStyle(c).position === 'absolute') continue;
          const cr = c.getBoundingClientRect();
          if (cr.width === 0) continue;
          if (cr.left < lo || cr.right > hi) {
            spill.push({ child: textOf(c) || c.tagName.toLowerCase(), byLeft: round1(lo - cr.left), byRight: round1(cr.right - hi) });
          }
        }
        if (row.scrollWidth > row.clientWidth + 1) spill.push({ scrollWidth: row.scrollWidth, clientWidth: row.clientWidth });
        if (spill.length) overflow.push({ row: row.dataset.session || textOf(row), spill });
      });
    out.checks.noRowOverflow = { pass: overflow.length === 0, count: overflow.length, overflow: overflow.slice(0, 8) };

    // (2) a chat appears at most once inside 「最近」 (现状: 正在活动 + 最近 together)
    const scopeSel =
      mode === 'proposal'
        ? '[data-section="recent"] [data-row]'
        : '[data-section="active"] [data-row], [data-section="recent"] [data-row]';
    const inRecent = new Map();
    root.querySelectorAll(scopeSel).forEach((r) => inRecent.set(r.dataset.session, (inRecent.get(r.dataset.session) || 0) + 1));
    const dup = [...inRecent].filter(([, n]) => n > 1).map(([id, n]) => ({ id, title: shownTitle(byId.get(id)), times: n }));
    const everywhere = new Map();
    root.querySelectorAll('[data-row]').forEach((r) => everywhere.set(r.dataset.session, (everywhere.get(r.dataset.session) || 0) + 1));
    const missingFromFolder = [...inRecent.keys()].filter(
      (id) =>
        ![...root.querySelectorAll(`[data-row][data-session="${id}"]`)].some(
          (r) => !r.closest('[data-section="recent"],[data-section="active"]')
        )
    );
    const moreBtn = [...root.querySelectorAll('[data-section="recent"] [data-more]')].find(visible);
    const shownN = moreBtn ? Number((/（(\d+)）/.exec(moreBtn.textContent) || [])[1]) : 0;
    const expectedN =
      st.recent === 'collapsed'
        ? 0
        : Math.max(0, (mode === 'proposal' ? recentLower() : recentAll()).length - RECENT_LIMIT);
    out.checks.recentAtMostOnce = {
      pass: dup.length === 0 && missingFromFolder.length === 0 && shownN === expectedN,
      duplicates: dup,
      maxAppearancesInSidebar: Math.max(0, ...everywhere.values()),
      selectedRowHighlights: root.querySelectorAll(`[data-row][data-session="${ACTIVE_ID}"].bg-selection`).length,
      recentRowsMissingFromFolder: missingFromFolder,
      viewMore: { shown: shownN, expected: expectedN },
    };

    // (3) L0–L4 use only 14/15px and 400/600 (buttons and badges excluded)
    const allowedW = st.cjk ? [400, 700] : [400, 600];
    const levelBad = [];
    const seen = {};
    root.querySelectorAll('[data-panel] [data-level]').forEach((el) => {
      if (el.closest('[data-slot="button"],[data-slot="badge"]') || !visible(el)) return;
      const cs = getComputedStyle(el);
      const fs = parseFloat(cs.fontSize);
      const fw = Number(cs.fontWeight);
      const key = `L${el.dataset.level}`;
      (seen[key] = seen[key] || new Set()).add(`${fs}px/${fw}`);
      if (![14, 15].includes(fs) || !allowedW.includes(fw)) {
        if (!levelBad.some((v) => v.level === key && v.fontSize === fs && v.fontWeight === fw)) {
          levelBad.push({ level: key, text: textOf(el), fontSize: fs, fontWeight: fw });
        }
      }
    });
    out.checks.levelFonts = {
      pass: levelBad.length === 0,
      allowedWeights: allowedW,
      seen: Object.fromEntries(Object.entries(seen).sort().map(([k, v]) => [k, [...v]])),
      violations: levelBad,
    };

    // (4) no CJK text under 14px anywhere in the panel
    const small = [];
    const walker = document.createTreeWalker(panel, NodeFilter.SHOW_TEXT);
    for (let n = walker.nextNode(); n; n = walker.nextNode()) {
      if (!CJK.test(n.data)) continue;
      const el = n.parentElement;
      if (!visible(el)) continue;
      const fs = parseFloat(getComputedStyle(el).fontSize);
      if (fs < 14) small.push({ text: n.data.trim().slice(0, 12), fontSize: fs, inButton: !!el.closest('[data-slot="button"]') });
    }
    panel.querySelectorAll('input').forEach((inp) => {
      const fs = parseFloat(getComputedStyle(inp).fontSize);
      if (CJK.test(inp.placeholder || '') && fs < 14) small.push({ text: inp.placeholder, fontSize: fs, placeholder: true });
    });
    out.checks.noSmallCjk = { pass: small.length === 0, violations: small };

    // (5) same-depth titles share one x
    const xs = {};
    root.querySelectorAll('[data-panel] [data-align-depth]').forEach((el) => {
      if (!visible(el)) return;
      const d = `depth${el.dataset.alignDepth}`;
      const x = relX(el.getBoundingClientRect().left);
      xs[d] = xs[d] || new Map();
      xs[d].set(x, (xs[d].get(x) || 0) + 1);
    });
    out.checks.sameDepthX = {
      pass: Object.values(xs).every((m) => Math.max(...m.keys()) - Math.min(...m.keys()) <= 0.5),
      xByDepth: Object.fromEntries(
        Object.entries(xs).map(([d, m]) => [d, Object.fromEntries([...m].sort((a, b) => a[0] - b[0]).map(([x, n]) => [String(x), n]))])
      ),
    };

    // (6) title widths
    const plain1 = [];
    const ctx1 = [];
    const badge1 = [];
    const any0 = [];
    root.querySelectorAll('[data-row]').forEach((r) => {
      if (!visible(r)) return;
      const w = round1(r.querySelector('[data-title]').getBoundingClientRect().width);
      const hasCtx = !!r.querySelector('[data-context]');
      const hasBadge = !!r.querySelector('[data-slot="badge"]:not([data-context])');
      if (r.dataset.depth === '1') (hasCtx ? ctx1 : hasBadge ? badge1 : plain1).push(w);
      else any0.push(w);
    });
    const stats = (a) => (a.length ? { n: a.length, min: Math.min(...a), max: Math.max(...a) } : null);
    out.titleWidths = {
      inFolderPlain: stats(plain1),
      inFolderWithContext: stats(ctx1),
      inFolderWithAlertBadge: stats(badge1),
      unnested: stats(any0),
    };
    if (W === 280 && mode === 'proposal') {
      const floorOk = ctx1.concat(badge1).every((w) => w >= 80 - 0.5);
      out.checks.titleWidth160 = {
        pass: plain1.length > 0 && Math.min(...plain1) >= 160 - 0.5 && floorOk,
        rule: 'rows in folders without context text or alert badges: title >= 160px; every other row: >= 80px (min-w-20)',
        inFolderPlainMin: plain1.length ? Math.min(...plain1) : null,
        othersMin: ctx1.concat(badge1).length ? Math.min(...ctx1.concat(badge1)) : null,
      };
    }

    // (7) sticky: the header of the section crossing the viewport top sits on it
    if (vp.scrollTop > 0) {
      const sec = [...root.querySelectorAll('[data-section]')].find((s) => {
        const r = s.getBoundingClientRect();
        return r.top <= vr.top + 0.5 && r.bottom > vr.top + 0.5;
      });
      if (sec) {
        const sticky = sec.querySelector('[data-sticky]');
        const hdr = sticky || sec.querySelector('[data-box="L1"]');
        const hr = hdr.getBoundingClientRect();
        const expected = Math.min(vr.top, sec.getBoundingClientRect().bottom - hr.height);
        out.checks.sticky = {
          applicable: true,
          pass: !!sticky && Math.abs(hr.top - expected) < 0.5,
          section: sec.dataset.section,
          headerTopMinusViewportTop: round1(hr.top - vr.top),
          scrollTop: Math.round(vp.scrollTop),
        };
        // info: keyboard focus is not left under the sticky header
        if (sticky && mode === 'proposal' && st.scroll === 'mid') {
          const saved = vp.scrollTop;
          const cand = [...sec.querySelectorAll('[data-row]')].find((r) => r.getBoundingClientRect().top > vr.top + 60);
          if (cand) {
            vp.scrollTop += cand.getBoundingClientRect().top - (vr.top + 8);
            const before = round1(cand.getBoundingClientRect().top - vr.top);
            cand.focus();
            const after = round1(cand.getBoundingClientRect().top - vr.top);
            cand.blur();
            vp.scrollTop = saved;
            out.checks.focusClearsStickyHeader = {
              info: true,
              pass: after >= 32 - 0.5,
              rowTopBeforeFocus: before,
              rowTopAfterFocus: after,
            };
          }
        }
      }
    } else {
      out.checks.sticky = { applicable: false, pass: true };
    }

    // coordinates (panel-relative x, border-box)
    const first = (sel) => [...root.querySelectorAll(sel)].find(visible) || null;
    const left = (el) => (el ? relX(el.getBoundingClientRect().left) : null);
    const height = (el) => (el ? round1(el.getBoundingClientRect().height) : null);
    const time = first('[data-row] [data-time]');
    out.coords = {
      L0TextX: left(first('[data-level="0"]')),
      L1TextX: left(first('[data-level="1"]')),
      sublabelTextX: (() => {
        const el = first('[data-sublabel]');
        return el ? relX(el.getBoundingClientRect().left + parseFloat(getComputedStyle(el).paddingLeft)) : null;
      })(),
      folderIconX: left(first('[data-folder-row] [data-icon]')),
      folderNameX: left(first('[data-level="2"]')),
      unnestedSlotX: left(first('[data-row][data-depth="0"] [data-slot-marker]')),
      unnestedTitleX: left(first('[data-row][data-depth="0"] [data-title]')),
      inFolderSlotX: left(first('[data-row][data-depth="1"] [data-slot-marker]')),
      inFolderTitleX: left(first('[data-row][data-depth="1"] [data-title]')),
      timeBoxRightInset: time ? round1(pr.right - 1 - time.getBoundingClientRect().right) : null,
      heights: {
        L0: height(first('[data-box="L0"]')),
        L1: height(first('[data-box="L1"]')),
        L2: height(first('[data-folder-row]')),
        L3: height(first('[data-row]')),
        L4aux: height(first('[data-more]')),
        L4sublabel: height(first('[data-sublabel]')),
      },
    };
    const gapBetween = (a, b) => (a && b ? round1(b.getBoundingClientRect().top - a.getBoundingClientRect().bottom) : null);
    const secs = [...root.querySelectorAll('[data-section]')];
    const fA = root.querySelector('[data-folder="atlas"]');
    const fB = root.querySelector('[data-folder="beacon"]');
    out.gaps = {
      betweenSections: secs.length > 1 ? gapBetween(secs[secs.length - 2], secs[secs.length - 1]) : null,
      betweenFolderGroups: gapBetween(fA, fB),
      folderHeaderToFirstRow: fA ? gapBetween(fA.querySelector('[data-folder-row]'), fA.querySelector('[data-row]')) : null,
      betweenRows: (() => {
        const rows = fA ? fA.querySelectorAll('[data-row]') : [];
        return rows.length > 1 ? gapBetween(rows[0], rows[1]) : null;
      })(),
    };

    // carriers between adjacent levels
    const bgL = oklchL(getComputedStyle(root).backgroundColor);
    const describe = (el, lvl) => {
      if (!el) return null;
      const cs = getComputedStyle(el);
      const box = el.closest('[data-box]') || el;
      const er = el.getBoundingClientRect();
      const icon = [...box.querySelectorAll('[data-icon]')].find(
        (i) => visible(i) && !i.closest('[data-slot="button"]') && i.getBoundingClientRect().right <= er.left + 0.5
      );
      const fw = Number(cs.fontWeight);
      const L = oklchL(cs.color);
      return {
        text: textOf(el),
        fontSize: parseFloat(cs.fontSize),
        fontWeight: fw,
        // Win10 Segoe UI / YaHei UI: 500 falls to 400, 600 renders as Bold.
        winWeight: fw === 500 ? 400 : fw >= 600 ? 700 : fw,
        color: cs.color,
        contrastL: L != null && bgL != null ? round2(Math.abs(L - bgL)) : null,
        letterSpacingEm: round2(parseFloat(cs.letterSpacing) / parseFloat(cs.fontSize) || 0),
        boxHeight: round1(box.getBoundingClientRect().height),
        textX: relX(er.left),
        leadingIcon: !!icon,
        divider:
          lvl === 0
            ? parseFloat(getComputedStyle(box).borderBottomWidth) > 0
            : lvl === 1
              ? secs.some((s) => parseFloat(getComputedStyle(s).borderTopWidth) > 0)
              : false,
      };
    };
    const reps = [
      describe(first('[data-level="0"]'), 0),
      describe(first('[data-level="1"]'), 1),
      describe(first('[data-level="2"]'), 2),
      describe(root.querySelector('[data-folder="atlas"] [data-row][data-session="a2"] [data-title]'), 3),
      describe(first('[data-folder="atlas"] [data-more] [data-align-depth]'), 4),
    ];
    const carriersOf = (a, b) => {
      const d = [];
      if (Math.abs(a.fontSize - b.fontSize) >= 1) d.push('字号');
      if (a.winWeight !== b.winWeight) d.push('字重');
      if (a.color !== b.color) d.push('颜色');
      if (Math.abs(a.letterSpacingEm - b.letterSpacingEm) >= 0.01) d.push('字距');
      if (Math.abs(a.boxHeight - b.boxHeight) >= 2) d.push('行高');
      if (Math.abs(a.textX - b.textX) >= 6) d.push('缩进');
      if (a.leadingIcon !== b.leadingIcon) d.push('图标');
      if (a.divider !== b.divider) d.push('分隔线');
      return d;
    };
    // "hi is not weaker than lo": size, Win-reliable weight, contrast.
    const notWeaker = (hi, lo) =>
      hi.fontSize >= lo.fontSize &&
      hi.winWeight >= lo.winWeight &&
      (hi.contrastL == null || lo.contrastL == null || hi.contrastL >= lo.contrastL - 0.005);
    const pairs = [[0, 1], [1, 2], [2, 3], [3, 4], [1, 3], [1, 4]].map(([i, j]) => {
      const a = reps[i];
      const b = reps[j];
      if (!a || !b) return { pair: `L${i}-L${j}`, missing: true };
      const c = carriersOf(a, b);
      return { pair: `L${i}-L${j}`, adjacent: j === i + 1, carriers: c, count: c.length, higherNotWeaker: notWeaker(a, b) };
    });
    out.carriers = { levels: reps, pairs };
    out.checks.carriers = {
      pass: pairs.filter((p) => p.adjacent).every((p) => !p.missing && p.count >= 2),
      adjacentCounts: Object.fromEntries(pairs.filter((p) => p.adjacent).map((p) => [p.pair, p.count])),
    };
    out.checks.monotonic = {
      info: true,
      pass: pairs.filter((p) => p.adjacent).every((p) => p.higherNotWeaker),
      weakerThanLowerLevel: pairs.filter((p) => p.adjacent && !p.higherNotWeaker).map((p) => p.pair),
    };
    return out;
  };

  window.__measure = () => ({
    state: { ...st },
    roots: [...document.querySelectorAll('[data-proto-root]')].map(measureRoot),
  });
  window.__pageSize = () => {
    const r = document.getElementById('stage').getBoundingClientRect();
    return { w: Math.ceil(r.width), h: Math.ceil(r.height) };
  };

  // --------------------------------------------------------------- controls
  const CONTROLS = [
    ['mode', '视图', [['current', '现状'], ['proposal', '方案'], ['compare', '并排对比']]],
    ['l1', '板块标题颜色', [['A', 'A 正文色'], ['B', 'B 灰色']]],
    ['temp', '临时对话', [['X', 'X 独立板块'], ['Y', 'Y 仓库列表内文件夹']]],
    ['theme', '主题', [['light', '浅色'], ['dark', '深色']]],
    ['w', '面板宽度', [['280', '280'], ['360', '360'], ['500', '500']]],
    ['recent', '「最近」', [['expanded', '展开'], ['collapsed', '折叠']]],
    ['scroll', '滚动', [['top', '顶部'], ['mid', '仓库列表中段'], ['bottom', '底部']]],
  ];
  const TOGGLES = [
    ['cjk', 'CJK / Win10 字重（500→400，600→700）'],
    ['tall', '全长'],
    ['guides', '对齐参考线'],
    ['tip', '悬停提示示例'],
    ['select', '多选模式'],
  ];
  const renderControls = () => {
    const el = document.getElementById('controls');
    el.innerHTML =
      CONTROLS.map(
        ([key, label, opts]) =>
          `<div class="grp"><span>${label}</span><div class="seg">${opts
            .map(([v, t]) => `<button type="button" data-key="${key}" data-v="${v}" aria-pressed="${st[key] === v}">${t}</button>`)
            .join('')}</div></div>`
      ).join('') +
      `<div class="grp">${TOGGLES.map(([key, t]) => `<label><input type="checkbox" data-toggle="${key}" ${st[key] ? 'checked' : ''} />${t}</label>`).join('')}</div>`;
  };
  document.getElementById('controls').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-key]');
    if (!b) return;
    st[b.dataset.key] = b.dataset.v;
    apply();
  });
  document.getElementById('controls').addEventListener('change', (e) => {
    const t = e.target.closest('input[data-toggle]');
    if (!t) return;
    st[t.dataset.toggle] = t.checked;
    apply();
  });
  const summary = (m) =>
    m.roots
      .map((r) => {
        const lines = [`【${r.mode === 'proposal' ? '方案' : '现状'}】面板 ${r.panelWidth}px`];
        for (const [k, v] of Object.entries(r.checks)) {
          if (v.applicable === false) continue;
          lines.push(`  ${v.pass ? '✓' : '✗'} ${k}${v.info ? '（参考）' : ''}`);
        }
        lines.push(`  坐标 ${JSON.stringify(r.coords)}`);
        lines.push(`  间距 ${JSON.stringify(r.gaps)}`);
        lines.push(`  标题宽 ${JSON.stringify(r.titleWidths)}`);
        lines.push(`  载体 ${r.carriers.pairs.map((p) => `${p.pair}:${(p.carriers || []).join('+') || '无'}`).join('  ')}`);
        return lines.join('\n');
      })
      .join('\n\n');

  const apply = () => {
    document.documentElement.classList.toggle('dark', st.theme === 'dark');
    document.body.classList.toggle('cjkwin', st.cjk);
    const stage = document.getElementById('stage');
    stage.innerHTML = st.mode === 'compare' ? compareHtml() : appHtml(st.mode, true);
    postRender();
    if (!SHOT) {
      renderControls();
      const q = new URLSearchParams();
      for (const [k, v] of Object.entries(st)) if (v !== false) q.set(k, v === true ? '1' : v);
      history.replaceState(null, '', `?${q}`);
      document.getElementById('report').textContent = summary(window.__measure());
    }
  };
  apply();
})();
</script>
</body>
</html>
