.composer-ph { display: flex; flex-direction: column; min-height: 6.5rem; padding: .75rem; border: 1px solid var(--border);
  border-radius: var(--radius-lg); background: var(--card); box-shadow: 0 1px 2px 0 rgb(0 0 0 / .05); }
.send-ph { display: inline-flex; align-items: center; justify-content: center; width: 1.75rem; height: 1.75rem; border-radius: 9999px;
  background: var(--primary); color: var(--primary-foreground); }
/* 「仓库顺序标注」 overlay (prototype only) */
.ann-col { position: relative; flex-shrink: 0; height: 100%; border-left: 1px dashed rgb(220 0 160 / .5); }
.ann-head { position: absolute; top: 44px; left: 10px; right: 8px; font: 600 14px/20px var(--font-sans); color: rgb(190 0 140); }
.ann-label { position: absolute; left: 10px; height: 18px; white-space: nowrap; padding: 0 6px; border-radius: 3px;
  font: 600 12px/18px var(--font-sans); color: #fff; background: rgb(220 0 160 / .85); }

/* ---- issue #6 v3: the home page with the real composer ---- */
/* --text-chat-body is globals.css's D1 value (17px: chat prose and the composer).
   PROPOSED --text-display: the home title. v4: 26px / 1.3, the sentence 400 and
   the workspace 600. v3 drew it at 28px / 600 (kept as .text-display-v3 for the
   comparison). Both are >= 18px, so the heading tracking -0.01em is allowed
   (design-system "Letter-spacing"). */
:root { --text-chat-body: 17px; --text-display: 1.625rem; }
.text-display { font-size: var(--text-display); line-height: 1.3; }
.text-display-v3 { font-size: 1.75rem; line-height: 1.3; }
.font-heading { font-family: var(--font-sans); }
.tracking-\[-0\.01em\] { letter-spacing: -0.01em; }
.min-h-full { min-height: 100%; } .min-h-18\.5 { min-height: 4.625rem; }
.ms-auto { margin-inline-start: auto; } .-me-1 { margin-inline-end: -.25rem; } .mx-3 { margin-inline: .75rem; }
.mt-1\.5 { margin-top: .375rem; } .mt-10 { margin-top: 2.5rem; } .my-2 { margin-block: .5rem; }
.max-w-md { max-width: 28rem; } .max-w-40 { max-width: 10rem; } .max-w-56 { max-width: 14rem; } .max-w-60 { max-width: 15rem; }
.p-1 { padding: .25rem; } .pt-0 { padding-top: 0; } .pb-1 { padding-bottom: .25rem; } .pb-3\.5 { padding-bottom: .875rem; }
.px-1\.5 { padding-inline: .375rem; } .py-1\.5 { padding-block: .375rem; }
.h-3 { height: .75rem; } .w-3 { width: .75rem; }
.place-items-center { place-items: center; } .whitespace-nowrap { white-space: nowrap; } .opacity-80 { opacity: .8; }
.rounded-t-xs { border-top-left-radius: var(--radius-xs); border-top-right-radius: var(--radius-xs); }
.rounded-t-md { border-top-left-radius: var(--radius-md); border-top-right-radius: var(--radius-md); }
.grid-rows-\[minmax\(0\,1fr\)\] { grid-template-rows: minmax(0, 1fr); }
/* the home title: the workspace is the work bar's repository, in the brand ink */
.home-ws { display: inline-flex; align-items: center; gap: .2em; max-width: 14em; vertical-align: top; color: var(--primary); }
.home-ws svg { width: .8em; height: .8em; flex-shrink: 0; color: var(--folder); }
.home-ws > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.home-spacer-top { flex: 2 1 0%; min-height: 3rem; }
.home-spacer-bottom { flex: 3 1 0%; min-height: 2rem; }
/* ChatComposer pieces (middleColumnLayout.ts, desktop values). The textarea is
   drawn as its placeholder: session = one line of calc(--text-chat-body * 1.5),
   empty = min-h-14 with the textarea's own 5px block padding. */
.composer-input { width: 100%; min-height: calc(var(--text-chat-body) * 1.5 * var(--composer-rows, 1)); overflow: hidden; white-space: nowrap;
  text-overflow: ellipsis; font-size: var(--text-chat-body); line-height: calc(var(--text-chat-body) * 1.5);
  color: color-mix(in oklab, var(--muted-foreground) 72%, transparent); }
.composer-input-empty { min-height: 3.5rem; padding-block: 5px; }
/* ComposerRoundButton: size-6 rounded-full; send / enqueue foreground, stop destructive */
.round-btn { display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; width: 1.5rem; height: 1.5rem;
  border-radius: 9999px; border: 1px solid transparent; }
.round-send { border-color: var(--foreground); background: var(--foreground); color: var(--background); }
.round-stop { border-color: var(--destructive); background: var(--destructive); color: var(--destructive-foreground); }
.round-disabled { opacity: .64; }
/* BranchSwitcher size="xs" (SelectTrigger): transparent border, input-coloured on hover / open */
.branch-trigger { display: inline-flex; min-width: 0; max-width: 15rem; flex-shrink: 1; align-items: center; gap: .25rem;
  padding: .25rem .5rem; border: 1px solid transparent; border-radius: var(--radius-md); font-size: .75rem; line-height: 1rem;
  color: var(--muted-foreground); }
.branch-trigger:hover:not(:disabled), .branch-trigger.branch-open { border-color: var(--input); color: var(--foreground); }
.branch-trigger:disabled { opacity: .64; cursor: default; }
/* the work bar's popups (coss Combobox / Select popup chrome; CJK at 14px) */
.menu-popup { position: absolute; z-index: 50; display: flex; flex-direction: column; overflow: hidden;
  border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--popover); color: var(--popover-foreground);
  box-shadow: 0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1); }
.menu-head, .menu-foot { flex-shrink: 0; }
.menu-list { flex: 0 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: none; }
.menu-list::-webkit-scrollbar { display: none; }
.menu-label { padding: .25rem .5rem; font-size: var(--text-meta); line-height: 1.5; color: var(--muted-foreground); }
.menu-item { display: grid; grid-template-columns: 1rem minmax(0, 1fr); align-items: center; gap: .5rem; min-height: 1.75rem;
  padding: .25rem 1rem .25rem .5rem; border-radius: var(--radius-sm); font-size: var(--text-meta); line-height: 1.25rem; }
.menu-item:hover { background: var(--accent); color: var(--accent-foreground); }
.menu-check { display: flex; align-items: center; justify-content: center; }
.menu-sep { height: 1px; margin: .25rem .5rem; background: var(--border); }
.menu-empty { padding: .5rem; text-align: center; font-size: var(--text-meta); color: var(--muted-foreground); }
.menu-foot { border-top: 1px solid var(--border); padding: .25rem; }
.menu-foot-btn { display: flex; width: 100%; height: 1.75rem; align-items: center; gap: .5rem; padding: 0 .5rem;
  border-radius: var(--radius-sm); font-size: var(--text-ui); line-height: 1.5; }
.menu-foot-btn:hover { background: var(--hover); }
/* the first message, as the timeline shows it right after the send (stand-in) */
.user-bubble { max-width: 80%; padding: .5rem .75rem; border-radius: var(--radius-lg); background: var(--secondary);
  border: 1px solid var(--border); font-size: var(--text-chat-body); line-height: 1.55; }
/* LeftNav's empty state: EmptyMedia variant="icon" (two tilted ghost cards behind) */
.empty-media { position: relative; margin-bottom: 1.5rem; }
.empty-card { position: relative; display: flex; width: 2.25rem; height: 2.25rem; flex-shrink: 0; align-items: center;
  justify-content: center; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card);
  color: var(--foreground); box-shadow: 0 1px 2px 0 rgb(0 0 0 / .05); }
.empty-ghost { position: absolute; bottom: 1px; box-shadow: none; }
.empty-ghost-l { transform-origin: bottom left; transform: translateX(-.125rem) rotate(-10deg) scale(.84); }
.empty-ghost-r { transform-origin: bottom right; transform: translateX(.125rem) rotate(10deg) scale(.84); }

/* ---- issue #6 v4: the anchored home title, the send-time branch ---- */
/* The title's centre sits at --home4-anchor of the area over the composer
   (container-query units of that area): the top spacer is the anchor minus half
   the title's line box. The recent list hangs below. When the block would come
   closer than 2rem to the composer, the top spacer shrinks (the only item that
   may) and the block slides up; at 3rem it stops and the area scrolls. */
.home4-area { container-type: size; }
.home4-col { display: flex; flex-direction: column; height: 100%; padding-inline: 1.5rem; }
.home4-pos-golden { --home4-anchor: 38.2cqh; }
.home4-pos-center { --home4-anchor: 50cqh; }
.home4-t-v4 { --home4-title-half: calc(var(--text-display) * 0.65); }
.home4-t-v3 { --home4-title-half: calc(1.75rem * 0.65); }
.home4-top { flex: 0 1 auto; height: calc(var(--home4-anchor) - var(--home4-title-half)); min-height: 3rem; }
.home4-body { flex: 0 0 auto; }
.home4-bottom { flex: 1 0 auto; min-height: 2rem; }
/* The v4 title: a quiet sentence (400, secondary ink) around one emphasised
   token (600, foreground): the workspace, or PiLab when there is none. */
.home4-title { font-family: var(--font-sans); font-size: var(--text-display); line-height: 1.3; font-weight: 400;
  letter-spacing: -0.01em; color: var(--muted-foreground); }
.home4-em { display: inline-block; max-width: 14em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  vertical-align: bottom; font-weight: 600; color: var(--foreground); }
.cjkwin .home4-em { font-weight: 700; }
.cjkwin .alert-title { font-weight: 400; }
.composer-input-typed { color: var(--foreground); }
/* v4.1: the empty composer rests at --composer-rows lines (2 by default, user 2026-10-10) of
   the chat body line box; content still grows it to the existing 8-line cap. */
/* coss Tooltip (ui/tooltip.tsx: rounded-md border bg-popover shadow-md px-2 py-1),
   text lifted from its text-xs (12px) to 14px for CJK; BranchColumn's max-w-66. */
.tip-popup { position: absolute; z-index: 50; max-width: 16.5rem; padding: .25rem .5rem; border: 1px solid var(--border);
  border-radius: var(--radius-md); background: var(--popover); color: var(--popover-foreground);
  font-size: var(--text-meta); line-height: 1.5; text-wrap: balance;
  box-shadow: 0 4px 6px -1px rgb(0 0 0 / .05), 0 2px 4px -2px rgb(0 0 0 / .05); }
/* coss Alert variant="warning" (ui/alert.tsx), as ModelMissingNotice uses it
   above the composer card (`className="mb-2"`): icon | title | actions. */
.alert { position: relative; display: grid; grid-template-columns: 1rem minmax(0, 1fr) auto; align-items: start;
  column-gap: .5rem; row-gap: .125rem; width: 100%; padding: .75rem .875rem; border: 1px solid var(--border);
  border-radius: var(--radius-md); font-size: .875rem; line-height: 1.25rem; color: var(--card-foreground); }
.alert > svg { width: 1rem; height: 1.25rem; }
.alert-warning { border-color: color-mix(in oklab, var(--warning) 32%, transparent);
  background-color: color-mix(in oklab, var(--warning) 4%, transparent); }
.alert-warning > svg { color: var(--warning); }
.alert-title { grid-column-start: 2; font-weight: 500; }
.alert-action { grid-column-start: 3; grid-row: 1 / 3; align-self: center; display: flex; gap: .25rem; }
.mb-2 { margin-bottom: .5rem; }

/* ---- 「CJK / Win10 字重」 simulation ----
   Microsoft YaHei UI has Light / Regular / Bold only, Segoe UI (Win10) has no
   500: a requested 500 falls to 400 and 600 rounds up to Bold 700. This dev
   box's CJK face (Noto Sans CJK SC, Regular / Bold) already behaves that way
   for Chinese; the toggle makes the Latin text follow too. */
.cjkwin .font-medium, .cjkwin .badge, .cjkwin .btn { font-weight: 400; }
.cjkwin .font-semibold { font-weight: 700; }

/* ---- prototype shell (not part of the design) ---- */
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 1s linear infinite; }
body.shot .spin { animation: none; }
.proto-root { position: relative; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden;
  background: var(--background); color: var(--foreground); }
.titlebar .logo { width: 20px; height: 20px; border-radius: 5px; border: 1px solid var(--border); background: var(--muted); }
.app { position: relative; display: flex; flex: 1 1 0%; min-height: 0; }
.dock { position: relative; display: flex; height: 100%; flex-shrink: 0; }
.rail-mark { position: absolute; top: .375rem; bottom: .375rem; left: -.375rem; width: .125rem;
  border-radius: 9999px; background: var(--primary); }
.center-note { padding: 12px 16px; line-height: 1.6; }
.guide { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed rgb(220 0 160 / .75); }
.guide-label { position: absolute; transform: translateX(-50%); padding: 0 3px; white-space: nowrap; font: 600 11px/14px var(--font-mono);
  color: #fff; background: rgb(220 0 160 / .85); border-radius: 3px; }
#stage { display: flex; gap: 24px; align-items: flex-start; padding: 16px; }
.cmp { display: flex; gap: 16px; align-items: flex-start; }
.cmp-label { height: 28px; display: flex; align-items: center; font-size: 14px; font-weight: 600; color: var(--foreground); }
.cmp-label small { margin-left: 8px; font-weight: 400; color: var(--muted-foreground); font-size: 14px; }
body.shot { overflow: hidden; }
body.shot #stage { display: inline-flex; padding: 0; gap: 0; }
body.shot #controls, body.shot #report { display: none; }
#controls { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 10px 16px;
  border-bottom: 1px solid var(--border); background: var(--card); font-size: 14px; }
#controls .grp { display: flex; align-items: center; gap: 6px; }
#controls .grp > span { color: var(--muted-foreground); }
#controls .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
#controls .seg button { padding: 2px 10px; border-right: 1px solid var(--border); }
#controls .seg button:last-child { border-right: 0; }
#controls .seg button[aria-pressed="true"] { background: var(--selection); font-weight: 600; }
#controls label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
#report { margin: 0 16px 16px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--card); font: 12px/1.45 var(--font-mono); white-space: pre-wrap; max-width: 1200px; }
</style>
</head>

<script>
(() => {
  'use strict';

  // ------------------------------------------------------------------ state
  const params = new URLSearchParams(location.search);
  const pick = (v, allowed, dflt) => (allowed.includes(v) ? v : dflt);
  const on = (k) => params.get(k) === '1'; // off unless =1
  const notOff = (k) => params.get(k) !== '0'; // on unless =0
  const SHOT = on('shot');
  const st = {
    mode: pick(params.get('mode'), ['current', 'proposal', 'compare'], 'proposal'),

    pos: pick(params.get('pos'), ['golden', 'center'], 'golden'),
    branch: params.get('branch') || '',
    tip: pick(params.get('tip'), ['none', 'branch-lock'], 'none'),

    // v4.1: the empty composer's resting height (方案 only): dsh.8's one line, 2, 3 or 4 lines; the user settled on 2 (2026-10-10).

    // states
    recent: pick(params.get('recent'), ['expanded', 'collapsed'], 'expanded'),
    active: pick(params.get('active'), ['less', 'all'], 'less'),

    ink: pick(params.get('ink'), ['mix', 'soft850', 'soft', 'fg'], 'mix'),

  if (SHOT) document.body.classList.add('shot');
  // The blocked prompt is about a branch picked before the lock arrived.
  if (st.blocked && !st.branch) st.branch = 'feature/home-composer';

  // ------------------------------------------------------------------- data
  // Synthetic. Issue #3's 26 repository folders (one empty) with 54 chats and
  // 4 temporary chats, plus the 「临时工作区」 folder (the synthetic Temp
  // project, listed last) with 2 chats: 60 chats. In the 「使用中」 scene
  // seven of them are active (host-bound or running); in the 「启动时」 scene
  // none is — nothing is started on the engine right after a launch.
  // v3 adds 「新用户」 (three repositories, no chat yet) and 「没有仓库」
  // (a fresh install: no repository, no chat).
  // Clock frozen so ages and screenshots are stable.
  const MIN = 60000;
  const NOW = new Date(2026, 9, 9, 15, 20, 0).getTime();
  const RECENT_WINDOW = 48 * 60 * MIN;
  const LIMIT = {
    current: { active: Infinity, lower: 7 }, // dsh.8: decision 167 section 1
    proposal: { active: 5, lower: 5 }, // issue #6 ruling 4 (v1); v2 keeps 5 for 「正在活动」

  const FOLDER_LIMIT = 8;
  const HOME_LIMIT = 10;
  const D = 1440;
  // Window width for each window height option (1280x720, 1440x900, 1920x1080).
  const WIN_W = { 720: 1280, 900: 1440, 1080: 1920 };

  const S = (id, title, ageMin, extra = {}) => ({ id, title, ageMin, ...extra });
  const F = (id, name, branch, sessions, extra = {}) => ({ id, name, branch, sessions, ...extra });
  const ALL_FOLDERS = [
    F('atlas', 'atlas-web', 'main', [

    ]),
    F('beacon', 'beacon-api', 'develop', [
      S('b1', '梳理权限审批的边界情况', 6, { status: 'waiting', bound: true, pending: 2 }),

    F('cobalt', 'cobalt-cli', 'main', [
      S('c1', '为子命令补全 shell 自动补全脚本', 660, { bound: true }),
      S('c2', '修复 Windows 路径分隔符问题', 3 * D),
    ]),
    F('delta', 'delta-docs', 'main', [
      S('d1', '把 README 拆成多页文档站', 840),
      S('d2', '校对安装指南里的命令', 6 * D),
    ]),
    F('ember', 'ember-ui', 'main', [
      S('e1', '实现可折叠的侧边面板组件', 2400),

    ]),
    F('fjord', 'fjord-sync', 'main', [

    F('garnet', 'garnet-ml', 'main', [

    ]),
    F('harbor', 'harbor-infra', 'main', [S('h1', '编写 Terraform 模块的变量说明', 2940)]),
    F('iris', 'iris-mobile', 'main', [S('i1', '修复安卓端键盘遮挡输入框', 4 * D)]),
    F('juniper', 'juniper-etl', 'main', [S('j1', '优化每日汇总任务的执行时间', 6 * D)]),
    F('kestrel', 'kestrel-auth', 'main', [S('k1', '接入短信验证码的限流', 7 * D)]),
    F('lumen', 'lumen-site', 'master', [
      S('l1', '整理本周发布说明草稿', 5 * D, { legacy: true }),
      S('l2', '更新落地页文案与配图说明', 8 * D),
    ]),
    F('mosaic', 'mosaic-design', 'main', [S('m1', '整理设计令牌命名规范', 14 * D)]),
    F('nimbus', 'nimbus-agent', 'main', [
      S('s1', '拉取远端更新', 0.2, { status: 'running', bound: true }),
      S('s2', '重构侧栏会话列表的层级与间距', 18, { bound: true, wt: 'feature/sidebar-hierarchy' }),
      S('s3', '修复登录页在弱网下反复跳转的问题', 180, { wt: 'fix/login-redirect-loop' }),
      S('s4', '解释这段正则为什么会回溯超时', 420),

      S('s6', 'New chat', 1560),
      S('s7', '写一份数据库索引优化方案', 3000),
      S('s8', '评估迁移到新版路由库的工作量', 3 * D),
      S('s9', '检查依赖许可证并生成清单', 4 * D),
      S('s10', '排查构建产物体积突然变大的原因', 6 * D),

      S('s12', '复查缓存失效策略的边界条件', 12 * D),
    ], { diff: [128, 36] }),
    F('onyx', 'onyx-billing', 'main', [S('o1', '核对账单导出的金额精度', 21 * D)]),
    // Remote: the derivation gives remote repositories no branch today, so the
    // folder row says only 「远程」 (decision 167 section 14).
    F('pylon', 'pylon-gateway', null, [
      S('p1', '排查网关偶发 502 的原因', 540, { bound: true }),
      S('p2', '梳理灰度发布的回滚步骤', 4 * D),

    F('quartz', 'quartz-search', 'main', [
      S('q1', '调研流式输出卡顿的原因', 120, { status: 'failed' }),
      S('q2', '对比两种分词方案的召回率', 6 * D),
    ]),
    F('raven', 'raven-notify', 'main', [S('r1', '合并重复的推送通道配置', 30 * D)]),
    F('sable', 'sable-admin', 'main', [S('sa1', '给后台列表加批量操作', 32 * D)]),
    F('tundra', 'tundra-cache', 'main', [S('t1', '分析缓存命中率下降的原因', 60 * D)]),
    F('umber', 'umber-report', 'release/2026.10', [S('u1', '生成季度报表的图表模板', 5 * D)]),
    F('vertex', 'vertex-sdk', 'main', [S('v1', '为 SDK 增加重试与退避', 15 * D)]),
    F('willow', 'willow-blog', 'main', [S('w1', '迁移博客评论系统', 90 * D)]),
    F('xenon', 'xenon-bench', 'main', [S('x1', '搭建基准测试的对比看板', 42 * D)]),
    F('yarrow', 'yarrow-bot', 'main', [S('y1', '让机器人支持多轮追问', 120 * D)]),
    F('zephyr', 'zephyr-tools', 'main', []),
    // The synthetic Temp project (setting "temporary workspaces" on): no branch,
    // no repository menu, three hover actions per row (decision 167 section 22).
    F('tempws', '临时工作区', null, [
      S('tw1', '试跑一段日志解析脚本', 3 * D),
      S('tw2', '对比两种 CSV 解析库的速度', 10 * D),
    ], { tempWorkspace: true }),
  ];
  const ALL_TEMP = [
    S('tmp1', '把这段 JSON 转成 TypeScript 类型', 240, { bound: true }),
    S('tmp2', '比较两种排序算法的复杂度', 3 * D),
    S('tmp3', '帮我起草一份会议纪要模板', 7 * D),
    S('tmp4', 'New chat', 14 * D),
  ];
  // dsh.8 at startup: the tree sync activates a blank 「新建对话」 seed in the
  // selected repository (`aiclient-selected-repo`); assumed nimbus-agent here.
  const SEED_FOLDER = 'nimbus';
  const NEWUSER_FOLDERS = [F('atlas', 'atlas-web', 'main', []), F('beacon', 'beacon-api', 'develop', []), F('cobalt', 'cobalt-cli', 'main', [])];
  // The scene's folders and temporary chats (set by useData).
  let FOLDERS = ALL_FOLDERS;
  let TEMP = ALL_TEMP;
  // v3 「已从首页发送」: the conversation the home page's first message started.
  const SENT_MESSAGE = '把首页的版式规则整理成一份说明，包括标题、最近对话和输入框的位置。';
  const SENT_TITLE = '整理首页的版式规则';
  const KNOWN = new Set([...ALL_FOLDERS.flatMap((f) => f.sessions.map((s) => s.id)), ...ALL_TEMP.map((s) => s.id), 'new1']);
  if (!KNOWN.has(st.open)) st.open = 's1';

  // The session list of the root being rendered or measured (scene-dependent),
  // and the conversation open in its center column (null = the home page).
  let SESSIONS = [];
  let byId = new Map();
  let SELECTED = null;
  let RENDER_MODE = 'proposal';
  const useData = (mode) => {
    RENDER_MODE = mode;
    // Only 「使用中」 has live chats; every other scene is right after a launch.
    const quiet = st.scene !== 'busy';
    FOLDERS = st.scene === 'newuser' ? NEWUSER_FOLDERS : st.scene === 'norepo' ? [] : ALL_FOLDERS;
    TEMP = st.scene === 'newuser' || st.scene === 'norepo' ? [] : ALL_TEMP;
    const list = [];
    const mk = (s, folder, live = false) => {
      const status = quiet && !live ? 'idle' : s.status || 'idle';
      return {
        ...s,
        folder,
        temp: !folder,
        updatedAt: NOW - Math.round(s.ageMin * MIN),
        status,
        busy: status === 'running' || status === 'waiting',
        failed: status === 'failed',
        bound: (!quiet || live) && !!s.bound,
        unread: (!quiet || live) && !!s.unread,
        pending: quiet && !live ? 0 : s.pending || 0,
      };
    };
    for (const f of FOLDERS) for (const s of f.sessions) list.push(mk(s, f));
    for (const s of TEMP) list.push(mk(s, null));
    // dsh.8 has no "no conversation" state: its stand-in for the home page is
    // the blank seed chat the tree sync opens at startup (none without a repository).
    const seedFolder = FOLDERS.find((f) => f.id === SEED_FOLDER) || null;
    const seed = mode === 'current' && st.center === 'home' && !!seedFolder;
    if (seed) list.push(mk(S('seed', 'New chat', 0), seedFolder));
    SESSIONS = list;
    // v3: the first message sent from the home page started a conversation in
    // the work bar's repository; it is running, so it is also 「正在活动」.
    const sent = mode === 'proposal' && st.home !== 'v2' && st.sent;
    if (sent) {
      const target = homeTargetFolder();
      // v4: a branch picked on the home was switched to at send time.
      const branchNow = target ? homeDraftBranch(target) || undefined : undefined;
      list.push(mk(S('new1', SENT_TITLE, 0, { status: 'running', bound: true, firstMessage: SENT_MESSAGE, branchNow }), target, true));
    }
    byId = new Map(list.map((s) => [s.id, s]));
    SELECTED =
      sent && st.center === 'chat' ? 'new1' : st.center === 'chat' ? (byId.has(st.open) ? st.open : null) : seed ? 'seed' : null;
  };

  // Interaction state that is not worth a URL parameter.
  const ui = { collapsed: new Set(), showAll: new Set(), tempCollapsed: false };
  const syncFolders = () => {
    const n = FOLDERS.filter((f) => ui.collapsed.has(f.id)).length;
    st.folders = n === FOLDERS.length ? 'collapsed' : n === 0 ? 'open' : 'mixed';
  };
  if (st.folders === 'collapsed') for (const f of ALL_FOLDERS) ui.collapsed.add(f.id);

  // ----------------------------------------------------------- derivations
  const byUpdated = (a, b) => b.updatedAt - a.updatedAt;
  // deriveActiveRows: host-bound or busy; busy first, then last activity.
  const activeRows = () =>
    SESSIONS.filter((s) => s.bound || s.busy).sort((a, b) => Number(b.busy) - Number(a.busy) || byUpdated(a, b));
  // deriveRecentRows: busy or touched within 48h, newest first.
  const recentAll = () => SESSIONS.filter((s) => s.busy || NOW - s.updatedAt <= RECENT_WINDOW).sort(byUpdated);
  // v1: the lower segment drops EVERY upper row (folded ones included) before its cap.
  const recentLower = () => {
    const upper = new Set(activeRows().map((s) => s.id));
    return recentAll().filter((s) => !upper.has(s.id));
  };
  // A capped list: N rows + 「查看更多（rest）」, or all + 「收起」.
  const capRows = (rows, limit, showAll) => {
    if (showAll || rows.length <= limit) return { rows, hidden: 0, collapsible: showAll && rows.length > limit };
    return { rows: rows.slice(0, limit), hidden: rows.length - limit, collapsible: false };
  };
  const folderRows = (f) => SESSIONS.filter((s) => s.folder === f).sort(byUpdated);
  const tempRows = () => SESSIONS.filter((s) => s.temp).sort(byUpdated);
  // limitFolderRows: 8 rows; the open chat is appended when it sorts past the cap.
  const limitFolder = (rows, showAll) => {
    if (rows.length <= FOLDER_LIMIT) return { rows, hidden: 0, collapsible: false };
    if (showAll) return { rows, hidden: 0, collapsible: true };
    const vis = rows.slice(0, FOLDER_LIMIT);
    const pinned = rows.slice(FOLDER_LIMIT).find((r) => r.id === SELECTED);
    if (pinned) vis.push(pinned);
    return { rows: vis, hidden: rows.length - vis.length, collapsible: false };
  };
  // v2: a folder's last activity = its newest chat's.
  const lastActivity = (f) => {
    const rows = SESSIONS.filter((s) => s.folder === f);
    return rows.length ? Math.max(...rows.map((s) => s.updatedAt)) : null;
  };
  // v2 ruling: folders by last activity, newest first; folders without chats
  // after them in their old relative order; 「临时工作区」 always last.
  // Array.prototype.sort is stable, so ties keep the old order too.
  const orderedFolders = (P) => {
    if (!P || st.order === 'original') return FOLDERS;
    const repos = FOLDERS.filter((f) => !f.tempWorkspace);
    const withChats = repos.filter((f) => lastActivity(f) != null).sort((a, b) => lastActivity(b) - lastActivity(a));
    return [...withChats, ...repos.filter((f) => lastActivity(f) == null), ...FOLDERS.filter((f) => f.tempWorkspace)];
  };
  // Home page: every chat, newest first, grouped by local calendar day.
  const homeRows = () => [...SESSIONS].sort(byUpdated);
  const homeGroup = (ts) => {
    const today = new Date(NOW);
    today.setHours(0, 0, 0, 0);
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    return ts >= today.getTime() ? '今天' : ts >= yesterday.getTime() ? '昨天' : '更早';
  };

  // ------------------------------------------------------------ formatting
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  const attrNl = (s) => esc(s).replace(/\n/g, '&#10;');
  const shownTitle = (s) => (s.title === 'New chat' ? '新建对话' : s.title);
  // src/renderer/lib/relativeTime.ts formatRelativeAge
  const relAge = (ts) => {
    const diff = NOW - ts;
    const H = 60 * MIN;
    const DAY = 24 * H;
    if (diff < MIN) return 'now';
    if (diff < H) return `${Math.floor(diff / MIN)}m`;
    if (diff < DAY) return `${Math.floor(diff / H)}h`;
    if (diff < 7 * DAY) return `${Math.floor(diff / DAY)}d`;
    if (diff < 30 * DAY) return `${Math.floor(diff / (7 * DAY))}w`;
    if (diff < 365 * DAY) return `${Math.floor(diff / (30 * DAY))}mo`;
    return `${Math.floor(diff / (365 * DAY))}y`;
  };
  // formatAbsoluteDateTime: always date + time (YYYY-MM-DD HH:MM).
  const absDateTime = (ts) => {
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  // lastBranchSegment (decision 167 section 2): feature/x -> x
  const lastSeg = (name) => name.split('/').filter(Boolean).pop() || name;
  // sidebarRowTooltip's second line; also the home page row's L4 text.
  const whereOf = (s) => {
    if (s.temp) return '临时对话';
    const f = s.folder;
    const branch = s.wt || f.branch;
    const where = branch ? `${f.name} · ${branch}` : f.name;
    return f.remote ? `${where}（远程）` : where;
  };
  const tooltip = (s) => `${shownTitle(s)}\n${whereOf(s)}\n更新于 ${absDateTime(s.updatedAt)}`;

  const ic = (name, cls = '') =>
    `<svg class="${cls}" data-icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-${name}"/></svg>`;
  const iconBtn = (name, cls, label, iconCls = '', action = '', extra = '') =>
    `<button type="button" data-slot="button" class="btn btn-ghost btn-icon-xs ${cls}" aria-label="${label}" title="${label}"${action ? ` data-action="${action}"` : ''}${extra}>${ic(name, iconCls)}</button>`;
  // L1 title buttons: size-6, icon size-3.5, muted (decision 167).
  const headBtn = (name, label, action = '') => iconBtn(name, 'size-6 text-muted-foreground', label, 'size-3.5', action);

  // ------------------------------------------------------- shared row bits
  const markerInner = (s) => {
    if (s.busy) {
      return s.status === 'waiting'
        ? '<span role="img" aria-label="等待审批" title="等待审批" class="h-1.5 w-1.5 shrink-0 rounded-full bg-warning"></span>'
        : ic('loader-circle', 'size-3 shrink-0 text-status-running spin');
    }
    if (s.unread) {
      return `<span role="img" aria-label="离开期间已完成" title="离开期间已完成" class="h-1.5 w-1.5 shrink-0 rounded-full ${s.failed ? 'bg-destructive' : 'bg-success'}"></span>`;
    }
    if (s.bound) {
      return '<span aria-hidden="true" title="正在后台运行" class="h-1.5 w-1.5 shrink-0 rounded-full border border-muted-foreground"></span>';
    }
    return '';
  };
  const LEGACY_HINT = '这个对话迁移到当前引擎之后，又在 1.0.x 里继续聊过。';
  const badges = (s) => {
    let h = '';
    if (s.legacy) h += `<span data-slot="badge" class="badge badge-lg badge-warning shrink-0" title="${LEGACY_HINT}">1.0.x</span>`;
    if (s.pending) {
      h += `<span data-slot="badge" class="badge badge-lg badge-warning shrink-0 gap-0.5 tabular-nums" title="${s.pending} 个待审批请求">${ic('shield-question', 'size-3.5')}${s.pending}</span>`;
    }
    if (s.failed) h += '<span data-slot="badge" class="badge badge-lg badge-destructive shrink-0">失败</span>';
    return h;
  };
  const timeAndActions = (s) => {
    // Temporary-workspace rows carry a third (delete) action; both boxes widen together.
    const tw = !!(s.folder && s.folder.tempWorkspace);
    const box = tw ? 'w-[60px]' : 'w-10';
    return (
      `<span class="shrink-0 text-right text-meta text-muted-foreground tabular-nums group-hover:hidden group-focus-within:hidden ${box}" data-level="4" data-time>${relAge(s.updatedAt)}</span>` +
      `<div class="hidden shrink-0 items-center justify-end group-hover:flex group-focus-within:flex ${box}">` +
      iconBtn('archive', 'size-5 sm:size-5', '归档', 'size-3.5') +
      iconBtn('x', 'size-5 sm:size-5', '从列表中移除', 'size-3.5') +
      (tw ? iconBtn('trash-2', 'size-5 text-muted-foreground sm:size-5', '删除', 'size-3.5') : '') +
      '</div>'
    );
  };

  // A chat row. 现状: text-ui 15px, foreground. 方案: text-meta 14px and, unless
  // open, --foreground-soft (the 「正文色（dsh.8）」 option keeps foreground).
  const row = (s, depth, inRecent, P) => {
    const active = s.id === SELECTED;
    const ctx =
      !inRecent && s.wt
        ? `<span class="min-w-0 max-w-24 shrink truncate text-meta text-muted-foreground" data-level="4" data-context title="${esc(s.wt)}">${esc(lastSeg(s.wt))}</span>`
        : '';
    const size = P ? 'text-meta' : 'text-ui';
    const ink = P && st.ink !== 'fg' ? 'text-foreground-soft ' : '';
    const state = active ? 'bg-selection text-accent-foreground' : `${ink}hover:bg-hover focus-visible:bg-hover`;
    return (
      `<div role="button" tabindex="0" class="group flex h-7 w-full items-center gap-1.5 overflow-hidden rounded-sm px-2 text-left ${size} ${state}" title="${attrNl(tooltip(s))}" data-row data-session="${s.id}" data-depth="${depth}" data-box="L3" data-action="open" data-sid="${s.id}"${s.folder && s.folder.tempWorkspace ? ' data-tw' : ''}>` +
      `<span class="flex w-4 shrink-0 items-center justify-center" data-slot-marker>${markerInner(s)}</span>` +
      `<span class="min-w-20 flex-1 truncate" data-level="3" data-title data-align-depth="${depth}">${esc(shownTitle(s))}</span>` +
      badges(s) +
      ctx +
      timeAndActions(s) +
      '</div>'
    );
  };
  const subLabel = (text, extra = '') =>
    `<div class="flex h-6 items-center px-2 text-meta text-muted-foreground${extra}" data-level="4" data-sublabel data-box="L4">${text}</div>`;
  const auxRow = (text, depth, slot = '', attrs = '') =>
    `<button type="button" class="flex h-6 w-full items-center gap-1.5 rounded-sm px-2 text-meta text-muted-foreground tabular-nums hover:bg-hover focus-visible:bg-hover" data-more data-box="L4" ${attrs}><span class="flex w-4 shrink-0 items-center justify-center" aria-hidden="true">${slot}</span><span class="min-w-0 truncate" data-level="4" data-align-depth="${depth}">${text}</span></button>`;

  // Folder row: unchanged by issue #6 (L2 stays text-ui 15px / 600 / foreground).
  const folderHeader = (f) => {
    const collapsed = ui.collapsed.has(f.id);
    const branchText = f.tempWorkspace ? '' : f.remote ? (f.branch ? `${f.branch} · 远程` : '远程') : f.branch;
    const tip = f.tempWorkspace
      ? f.name
      : `${f.name}${f.branch ? `\n主工作区分支：${f.branch}` : ''}${f.remote ? '\n远程仓库' : ''}`;
    const diff = f.diff
      ? `<span class="col-start-1 row-start-1 flex items-center gap-1 text-meta tabular-nums group-hover:invisible group-focus-within:invisible" data-level="4"><span class="text-success">+${f.diff[0]}</span><span class="text-destructive">-${f.diff[1]}</span></span>`
      : '';
    const hoverBtn = 'size-5 shrink-0 text-muted-foreground opacity-0 group-hover:opacity-100 group-focus-within:opacity-100 sm:size-5';
    return (
      `<div class="group flex h-7 w-full items-center gap-1.5 rounded-sm px-2 text-ui hover:bg-hover has-focus-visible:bg-hover" data-folder-row data-box="L2">` +
      `<button type="button" class="flex min-w-0 flex-1 items-center gap-1.5 text-left" title="${attrNl(tip)}" data-action="folder-toggle" data-fid="${f.id}">` +
      ic(collapsed ? 'folder' : 'folder-open', 'size-4 shrink-0 text-folder') +
      `<span class="min-w-0 truncate font-semibold" data-level="2" data-name data-align-depth="0">${esc(f.name)}</span>` +
      (branchText
        ? `<span class="min-w-0 shrink-[1000] truncate text-meta text-muted-foreground" data-level="4" data-branch>${esc(branchText)}</span>`
        : '') +
      '</button>' +
      `<span class="grid shrink-0 justify-items-end">${diff}<span class="col-start-1 row-start-1 flex items-center">` +
      (f.tempWorkspace ? '' : iconBtn('ellipsis', hoverBtn, '仓库操作', 'size-3.5')) +
      iconBtn('plus', hoverBtn, '新建对话', 'size-3.5', f.tempWorkspace ? '' : 'new-in-folder', f.tempWorkspace ? '' : ` data-fid="${f.id}"`) +
      '</span></span></div>'
    );
  };
  const folderBlock = (f, P) => {
    let body = '';
    if (!ui.collapsed.has(f.id)) {
      const rows = folderRows(f);
      const lim = limitFolder(rows, ui.showAll.has(f.id));
      body = lim.rows.map((s) => row(s, 1, false, P)).join('');
      if (lim.hidden) body += auxRow(`查看更多（${lim.hidden}）`, 1, '', `data-action="folder-more" data-fid="${f.id}"`);
      else if (lim.collapsible) body += auxRow('收起', 1, '', `data-action="folder-less" data-fid="${f.id}"`);
      if (!rows.length) body += auxRow('新建对话', 1, ic('plus', 'size-3.5'), `data-action="new-in-folder" data-fid="${f.id}"`);
      body = `<div class="mt-0.5 space-y-0.5 pl-3">${body}</div>`;
    }
    return `<section data-folder="${f.id}">${folderHeader(f)}${body}</section>`;
  };

  // v1 / dsh.8 「最近」: upper segment 「正在活动」, lower segment 「48 小时内」.
  // 现状 (dsh.8): upper uncapped, lower 7. 方案 v1: 5 + 5, both foldable.
  const recentInner = (P) => {
    const L = P ? LIMIT.proposal : LIMIT.current;
    const act = activeRows();
    const upper = capRows(act, L.active, st.active === 'all');
    const lower = capRows(recentLower(), L.lower, st.lower === 'all');
    const showLower = st.recent !== 'collapsed' && lower.rows.length > 0;
    let html = '';
    if (act.length) {
      let g = subLabel('正在活动') + upper.rows.map((s) => row(s, 0, true, P)).join('');
      if (upper.hidden) g += auxRow(`查看更多（${upper.hidden}）`, 0, '', 'data-action="active-more"');
      else if (upper.collapsible) g += auxRow('收起', 0, '', 'data-action="active-less"');
      html += `<div role="group" aria-label="正在活动" class="space-y-0.5" data-segment="active">${g}</div>`;
    }
    if (showLower) {
      let g = (act.length ? subLabel('48 小时内', ' mt-1') : '') + lower.rows.map((s) => row(s, 0, true, P)).join('');
      if (lower.hidden) g += auxRow(`查看更多（${lower.hidden}）`, 0, '', 'data-action="lower-more"');
      else if (lower.collapsible) g += auxRow('收起', 0, '', 'data-action="lower-less"');
      html += `<div ${act.length ? 'role="group" aria-label="48 小时内" ' : ''}class="space-y-0.5" data-segment="lower">${g}</div>`;
    }
    return html;
  };
  // v2 「正在活动」 region: one list, 5 rows + 「查看更多（N）」 / 「收起」.
  const activeInner = () => {
    const up = capRows(activeRows(), LIMIT.proposal.active, st.active === 'all');
    let g = up.rows.map((s) => row(s, 0, true, true)).join('');
    if (up.hidden) g += auxRow(`查看更多（${up.hidden}）`, 0, '', 'data-action="active-more"');
    else if (up.collapsible) g += auxRow('收起', 0, '', 'data-action="active-less"');
    return g;
  };
  const topChevron = (name) =>
    st.recent === 'collapsed'
      ? headBtn('chevron-right', `展开${name}`, 'toggle-recent')
      : headBtn('chevron-down', `收起${name}`, 'toggle-recent');
  const tempChevron = () =>
    ui.tempCollapsed
      ? headBtn('chevron-right', '展开临时对话', 'temp-toggle')
      : headBtn('chevron-down', '收起临时对话', 'temp-toggle');

  // ============================================================ 现状 (dsh.8)
  // LeftNav.tsx @ 6ca5bf42: ONE ScrollArea; three L1 sections with sticky h-8
  // titles (two-layer opaque background); `isolate p-2` list root.
  const headerCurrent = (label, actions) =>
    '<div class="sticky top-0 z-10 -mx-2 bg-background" data-sticky>' +
    `<div class="flex h-8 items-center bg-card/40 px-4" data-box="L1">` +
    `<p class="min-w-0 truncate text-ui font-semibold tracking-[0.04em] text-foreground" data-level="1">${label}</p>` +
    `<div class="ml-auto flex shrink-0 items-center gap-0.5">${actions}</div>` +
    '</div></div>';
  const sectionCurrent = (id, label, actions, body, first) =>
    `<section class="-mx-2 px-2${first ? '' : ' mt-2 border-t'}" data-section="${id}">${headerCurrent(label, actions)}${body}</section>`;
  const listCurrent = () => {
    if (!FOLDERS.length) {
      // LeftNav's showAddRepositoryEmptyState: the card, then the temporary chats (none here).
      return (
        '<div class="relative size-full min-h-0 flex-1" data-scroll-root data-list-area>' +
        `<div class="viewport h-full" data-viewport data-scroll="list"><div class="isolate p-2" data-list>${emptyRepoCard()}</div></div>` +
        '</div>'
      );
    }
    const rb = recentInner(false);
    const recent = sectionCurrent('top', '最近', topChevron('最近'), rb ? `<div class="mt-0.5 space-y-0.5">${rb}</div>` : '', true);
    const repos = sectionCurrent(
      'repos',
      '仓库列表',
      headBtn('list-filter', '筛选会话') + headBtn('folder-plus', '添加仓库'),
      `<div class="mt-0.5 space-y-1">${FOLDERS.map((f) => folderBlock(f, false)).join('')}</div>`,
      false
    );
    const tr = tempRows();
    const temp = tr.length
      ? sectionCurrent(
          'temp',
          '临时对话',
          tempChevron(),
          ui.tempCollapsed ? '' : `<div class="mt-0.5 space-y-0.5">${limitFolder(tr, false).rows.map((s) => row(s, 0, false, false)).join('')}</div>`,
          false
        )
      : '';
    return (
      '<div class="relative size-full min-h-0 flex-1" data-scroll-root data-list-area>' +
      `<div class="viewport h-full scroll-pt-8" data-viewport data-scroll="list"><div class="isolate p-2" data-list>${recent}${repos}${temp}</div></div>` +
      '</div>'
    );
  };

  // ================================================================ 方案 (#6)
  // Regions in a flex column. Each region is a two-row grid: the L1 title
  // (auto) and a ScrollArea (minmax(0,1fr)). The top region and Temporary
  // chats are content-sized up to 33% / 25% of the list area; Repositories
  // takes the rest. No sticky titles: no title is inside a scroll viewport.
  // `grid-cols-1` (minmax(0,1fr)) is load-bearing: the implicit `auto` column
  // would grow to the rows' min-content width (nowrap titles) and push every
  // row past the panel's right edge.
  const headerProposal = (label, actions) =>
    `<div class="flex h-8 items-center px-4" data-box="L1">` +
    `<p class="min-w-0 truncate text-section font-semibold tracking-[0.04em] text-foreground" data-level="1">${label}</p>` +
    `<div class="ml-auto flex shrink-0 items-center gap-0.5">${actions}</div>` +
    '</div>';
  const region = (id, label, actions, inner, cls, attrs = '') =>
    `<section class="grid min-h-0 grid-cols-1 grid-rows-[auto_minmax(0,1fr)] ${cls}" data-region="${id}" data-section="${id}"${attrs}>` +
    headerProposal(label, actions) +
    '<div class="relative size-full min-h-0" data-scroll-root>' +
    `<div class="viewport h-full" data-viewport data-scroll="${id}">${inner ? `<div class="px-2 pt-0.5 pb-2" data-list>${inner}</div>` : ''}</div>` +
    '</div></section>';
  const listProposal = () => {
    let top = '';
    if (st.top === 'v1') {
      const rb = recentInner(true);
      top = region('top', '最近', topChevron('最近'), rb ? `<div class="space-y-0.5">${rb}</div>` : '', 'max-h-[33%] shrink-0', ' data-top="v1"');
    } else if (activeRows().length) {
      // v2: only 「正在活动」; the whole region (title included) is gone when nothing is active.
      top = region(
        'top',
        '正在活动',
        topChevron('正在活动'),
        st.recent === 'collapsed' ? '' : `<div class="space-y-0.5">${activeInner()}</div>`,
        'max-h-[33%] shrink-0',
        ' data-top="v2"'
      );
    }
    const repos = !FOLDERS.length
      ? // No repository: dsh.8's empty-state card in place of the region (no title).
        `<section class="grid min-h-0 grid-cols-1 grid-rows-[minmax(0,1fr)] flex-1${top ? ' border-t' : ''}" data-region="repos" data-section="repos">` +
        '<div class="relative size-full min-h-0" data-scroll-root>' +
        `<div class="viewport h-full" data-viewport data-scroll="repos"><div class="px-2 pt-2 pb-2" data-list>${emptyRepoCard()}</div></div>` +
        '</div></section>'
      : region(
      'repos',
      '仓库列表',
      // Ruling 5: collapse all, filter, add — same size-6 / size-3.5 buttons.
      headBtn('chevrons-down-up', '全部折叠', 'collapse-all') + headBtn('list-filter', '筛选会话') + headBtn('folder-plus', '添加仓库'),
      `<div class="space-y-1">${orderedFolders(true).map((f) => folderBlock(f, true)).join('')}</div>`,
      `flex-1${top ? ' border-t' : ''}`
    );
    const tr = tempRows();
    const temp = tr.length
      ? region(
          'temp',
          '临时对话',
          tempChevron(),
          ui.tempCollapsed ? '' : `<div class="space-y-0.5">${limitFolder(tr, false).rows.map((s) => row(s, 0, false, true)).join('')}</div>`,
          'max-h-[25%] shrink-0 border-t'
        )
      : '';
    return `<div class="flex min-h-0 flex-1 flex-col" data-list-area>${top}${repos}${temp}</div>`;
  };

  // ------------------------------------------------------------ app chrome
  // WindowTitleBar (Windows / Linux): h-8 including its border-b.
  const titleBar = () =>
    '<div class="titlebar flex h-8 shrink-0 items-center border-b bg-background" data-titlebar>' +
    '<div class="flex h-8 items-center gap-1.5 px-2"><span class="logo"></span>' +
    '<span class="text-xs font-medium text-muted-foreground">AI Client</span></div></div>';
  // DockTitle (shared by all five panels): 现状 text-ui 15px / 600, 方案 text-section 16px / 600.
  const dockTitle = (P) =>
    `<div class="flex h-9 shrink-0 items-center gap-2 border-b px-3" data-box="L0"><span class="min-w-0 flex-1 truncate ${P ? 'text-section' : 'text-ui'} font-semibold" data-level="0">聊天</span></div>`;
  // Toolbar + search. v2 entry (b): a 「首页」 button left of 「＋新建」.
  const toolbar = (P) =>
    '<div class="space-y-2 border-b p-2" data-toolbar>' +
    '<div class="flex items-center gap-1" data-toolbar-row>' +
    (P && st.entry === 'toolbar'
      ? `<button type="button" data-slot="button" class="btn btn-outline btn-xs h-6 sm:text-meta" title="首页" data-home-entry="toolbar" data-action="go-home">${ic('house', 'h-3.5 w-3.5')}首页</button>`
      : '') +
    `<button type="button" data-slot="button" class="btn btn-outline btn-xs h-6 sm:text-meta" title="${P && st.home !== 'v2' ? '新建对话（回到首页）' : '在 nimbus-agent 中新建对话'}"${P && st.home !== 'v2' ? ' data-action="go-home"' : ''}>${ic('plus', 'h-3.5 w-3.5')}新建</button>` +
    `<button type="button" data-slot="button" class="btn btn-outline btn-xs h-6 min-w-0 sm:text-meta" title="添加仓库">${ic('folder-plus', 'h-3.5 w-3.5 shrink-0')}<span class="min-w-0 truncate">添加仓库</span></button>` +
    `<button type="button" data-slot="button" class="btn btn-ghost btn-icon-xs ml-auto h-6 w-6 shrink-0" aria-label="选择要归档的会话" title="选择要归档的会话">${ic('list-checks', 'h-3.5 w-3.5')}</button></div>` +
    '<div class="input-group h-7 rounded-sm" data-slot="input-group" role="group">' +
    '<span data-slot="input-control" data-size="sm"><input data-slot="input" placeholder="搜索会话" aria-label="搜索会话" /></span>' +
    `<div class="input-group-addon" data-align="inline-start" data-slot="input-group-addon">${ic('search', 'size-4 text-muted-foreground')}</div></div>` +
    '</div>';
  // Rail. v2 entry (a): a 「首页」 button above the five surfaces, set off by a
  // divider — it changes the center column, not the left panel.
  const rail = (P) => {
    const top = [['message-square', 'chat', true], ['git-branch', 'git', false], ['file-code', 'files', false], ['square-terminal', 'terminal', false], ['activity', 'run', false]];
    return (
      '<nav class="flex h-full shrink-0 flex-col items-center gap-0.5 border-r bg-card pb-2" style="width:44px" data-rail>' +
      '<div class="h-9 shrink-0"></div>' +
      (P && st.entry === 'rail'
        ? `<button type="button" class="relative flex h-8 w-8 shrink-0 items-center justify-center rounded-md text-muted-foreground hover:bg-hover" title="首页" aria-label="首页" data-home-entry="rail" data-action="go-home">${ic('house', 'size-4.5')}</button><div class="rail-sep" aria-hidden="true"></div>`
        : '') +
      top
        .map(
          ([n, id, a]) =>
            `<button type="button" class="relative flex h-8 w-8 shrink-0 items-center justify-center rounded-md ${a ? 'bg-selection text-foreground' : 'text-muted-foreground'}" data-surface="${id}">${a ? '<span class="rail-mark"></span>' : ''}${ic(n, 'size-4.5')}</button>`
        )
        .join('') +
      '<div class="flex-1"></div>' +
      ['panel-left-close', 'blocks', 'settings']
        .map(
          (n) =>
            `<button type="button" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md text-muted-foreground">${ic(n, 'size-4.5')}</button>`
        )
        .join('') +
      '</nav>'
    );
  };
  // UserFooterPill: border-t + p-2 + an h-6 trigger = 41px.
  const footer = () =>
    '<div class="flex shrink-0 items-center gap-1 border-t p-2" data-footer><button type="button" class="flex h-6 min-w-0 flex-1 items-center gap-2 rounded-sm px-1">' +
    '<span class="size-4 shrink-0 rounded-full bg-muted border"></span><span class="min-w-0 flex-1 truncate text-left text-meta">demo@example.com</span></button></div>';

  // ----------------------------------------------------------- center column
  // Narrow stub (「整窗」 off): v1's 320px column, only the h-9 bar and a note.
  const centerStub = (P) => {
    const s = SELECTED ? byId.get(SELECTED) : null;
    const titleCls = `min-w-0 truncate ${P ? 'text-section' : 'text-ui'} text-foreground`;
    const note = !s
      ? '中栏是首页；打开「整窗」看全貌。'
      : P
        ? '中栏只为示意同一条 h-9 顶栏。<br />会话栏标题 16px 400，与左栏「聊天」（16px 600）同字号、用字重区分。'
        : '中栏只为示意同一条 h-9 顶栏。<br />会话栏标题 15px 400（决策 167 §6）。';
    const dot = s && s.status === 'running' ? '<span aria-hidden="true" class="size-1.5 shrink-0 rounded-full bg-status-running"></span>' : '';
    return (

        : `<div class="relative flex min-h-18.5 gap-2 rounded-md border border-border bg-card p-2" data-composer-card><div class="flex min-w-0 flex-1 flex-col gap-2">${input}${bar('')}</div></div>`;
    const row = hasRow ? targetRow(geometry, kind, s, folder) : '';
    return (
      `<div class="shrink-0 px-6 pt-0 ${geometry === 'empty' ? 'pb-6' : 'pb-3.5'}" data-composer-host>` +
      `<div class="relative mx-auto w-full max-w-reading" data-composer>${geometry === 'empty' ? row + card : blocked + card + row}${kind === 'home' ? menuPopup(folder) + tipPopup(folder) : ''}</div>` +
      '</div>'
    );
  };
  // The home's composer target: picked on its bar (`target`); by default the
  // most recently active repository; null = no repository (a temporary chat).
  const homeTargetFolder = () => {
    if (st.target === 'unbound') return null;
    const repos = FOLDERS.filter((f) => !f.tempWorkspace);
    const picked = repos.find((f) => f.id === st.target);
    if (picked) return picked;
    const active = repos.filter((f) => lastActivity(f) != null).sort((a, b) => lastActivity(b) - lastActivity(a));
    return active[0] || repos[0] || null;
  };
  const homeTitle = (folder) =>
    folder
      ? `在 <span class="home-ws" title="${esc(folder.name)}" data-home-ws>${ic('folder')}<span>${esc(folder.name)}</span></span> 与 PiLab 一起进行创造吧`
      : '与 PiLab 一起进行创造吧';
  const homeSub = (folder) => {
    if (folder) return '';
    // Two deliberate lines: CJK has no word boundaries, so a free wrap at
    // max-w-md would break mid-phrase (「在下 / 方工作栏」).
    const text = FOLDERS.some((f) => !f.tempWorkspace)
      ? '这次对话不绑定仓库，会在一个私有的临时目录里进行。'
      : '还没有添加仓库，这次对话会在一个私有的临时目录里进行。<br />在下方工作栏可以添加仓库。';
    return `<p class="mx-auto mt-3 max-w-md text-ui text-muted-foreground" data-home-sub>${text}</p>`;
  };
  // v3 home: the title, 最近对话 (v2's list), and the composer docked at the bottom.
  // Spacers 2 : 3 put a short page's title a little above the middle of the area
  // over the composer; a long page scrolls under the title area's bottom fade.
  const homeV3 = () => {
    const folder = homeTargetFolder();
    const rows = homeRows();
    let recent = '';
    if (rows.length) {
      const shown = st.homemore === 'all' ? rows : rows.slice(0, HOME_LIMIT);
      let list = '';
      let group = null;
      for (const s of shown) {
        const g = homeGroup(s.updatedAt);
        if (g !== group) {
          list += `<div class="flex h-6 items-center px-2 text-meta text-muted-foreground${group ? ' mt-3' : ''}" data-home-group data-home-part="meta">${g}</div>`;
          group = g;
        }
        list += homeRow(s);
      }
      if (rows.length > shown.length) list += homeAux(`查看更多（${rows.length - shown.length}）`, 'home-more');

        '<section class="mt-10" data-home-recent>' +
        '<div class="flex h-8 items-center px-2"><h2 class="text-section font-semibold tracking-[0.04em] text-foreground" data-home-heading data-home-part="heading">最近对话</h2></div>' +
        `<div class="mt-0.5 space-y-0.5">${list}</div>` +
        '</section>';
    }
    return (
      '<div class="relative min-h-0 flex-1" data-home-area data-scroll-root>' +
      '<div class="viewport h-full" data-viewport data-scroll="home">' +
      '<div class="flex min-h-full flex-col px-6">' +
      '<div class="home-spacer-top"></div>' +
      '<div class="mx-auto w-full max-w-reading" data-home-v3>' +
      `<div class="text-center" data-home-hero><h1 class="font-heading text-display-v3 font-semibold tracking-[-0.01em] text-foreground" data-home-title>${homeTitle(folder)}</h1>${homeSub(folder)}</div>` +
      recent +
      '</div>' +
      '<div class="home-spacer-bottom"></div>' +
      '</div></div></div>' +
      composerReal('session', 'home', null, folder)
    );
  };
  // ========================================= v4: the anchored title, 5 recent chats
  // User feedback on v3 (2026-10-10): the title was too loud, put it at the
  // middle or the golden section, show fewer recent chats. The layout is pure
  // CSS (see .home4-*): the title's centre at 38.2% / 50% of the area over the
  // composer, the list hanging below it, the block sliding up only when the
  // list would crowd the composer.
  const HOME4_LIMIT = 5;
  const homeTitleV4 = (folder) =>
    folder
      ? `在 <span class="home4-em" title="${esc(folder.name)}" data-home-ws>${esc(folder.name)}</span> 与 PiLab 一起进行创造吧`
      : '与 <span class="home4-em" data-home-brand>PiLab</span> 一起进行创造吧';
  const homeV4 = () => {
    const folder = homeTargetFolder();
    const rows = homeRows();
    const all = st.homemore === 'all';
    let recent = '';
    if (rows.length) {
      const shown = all ? rows : rows.slice(0, HOME4_LIMIT);
      let list = '';
      let group = null;
      for (const s of shown) {
        // Five rows read fine by their own times; the full list keeps v2's day groups.
        if (all) {
          const g = homeGroup(s.updatedAt);
          if (g !== group) {
            list += `<div class="flex h-6 items-center px-2 text-meta text-muted-foreground${group ? ' mt-3' : ''}" data-home-group data-home-part="meta">${g}</div>`;
            group = g;
          }
        }
        list += homeRow(s);
      }
      if (rows.length > shown.length) list += homeAux(`查看更多（${rows.length - shown.length}）`, 'home-more');
      else if (rows.length > HOME4_LIMIT) list += homeAux('收起', 'home-less');
      // Secondary: a quiet 14px label instead of v3's 16px / 600 section title.
      recent =
        '<section class="mt-10" data-home-recent>' +
        '<div class="flex h-7 items-center px-2"><h2 class="text-meta font-normal text-muted-foreground" data-home-heading data-home-part="heading">最近对话</h2></div>' +

    const h1 =
      st.title === 'v3'
        ? `<h1 class="font-heading text-display-v3 font-semibold tracking-[-0.01em] text-foreground" data-home-title>${homeTitle(folder)}</h1>`

    return (
      '<div class="relative min-h-0 flex-1 home4-area" data-home-area data-scroll-root>' +
      '<div class="viewport h-full" data-viewport data-scroll="home">' +

  // v3 conversation: the timeline (placeholder) over the same docked composer.
  const chatBodyV3 = (s) => {

        `<div class="mt-3 space-y-2">${['88%', '72%', '90%', '45%'].map((w) => `<div class="ph-line" style="width:${w}"></div>`).join('')}</div>`;
