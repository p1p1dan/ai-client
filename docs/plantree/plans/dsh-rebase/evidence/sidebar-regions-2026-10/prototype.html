      '<div class="relative min-h-0 flex-1" data-chat-area data-scroll-root>' +
      '<div class="viewport h-full" data-viewport data-scroll="timeline"><div class="px-6 pt-5 pb-2"><div class="mx-auto w-full max-w-reading">' +
      inner +
      '</div></div></div></div>' +
      composerReal('session', 'chat', s, s.folder)
    );
  };
  // dsh.8's start screen with the real composer (empty geometry), for 现状.
  const startScreenV3 = (s) => {
    const folder = s ? s.folder : null;
    return (
      '<div class="flex min-h-0 flex-1 flex-col" data-start-screen>' +
      '<div class="flex min-h-0 flex-1 items-center justify-center px-6"><div class="mb-6 flex flex-col items-center gap-3 text-center">' +
      `<div class="flex size-12 shrink-0 items-center justify-center rounded-lg bg-primary/10 text-primary">${ic('messages-square', 'size-6')}</div>` +
      '<h2 class="font-semibold text-foreground text-title">开始对话</h2>' +
      `<p class="max-w-sm text-meta text-muted-foreground">${folder ? `AI 会在 ${esc(folder.name)} 里干活，直接说你想做什么。` : '直接输入即可，这次对话会在一个私有的临时目录里进行。'}</p>` +
      '</div></div>' +
      composerReal('empty', 'seed', s, folder) +
      '</div>'
    );
  };
  // LeftNav's empty state (no repository): ui/empty.tsx as LeftNav configures it.
  const emptyRepoCard = () =>
    '<div class="flex min-w-0 flex-col items-center justify-center gap-3 p-2 text-center" data-empty-repos>' +
    '<div class="empty-media" aria-hidden="true"><div class="empty-card empty-ghost empty-ghost-l"></div><div class="empty-card empty-ghost empty-ghost-r"></div>' +
    `<div class="empty-card">${ic('folder-git-2', 'size-4.5')}</div></div>` +
    '<div class="flex max-w-sm flex-col items-center text-center"><div class="text-ui" style="line-height:1">添加仓库</div><div class="mt-1 text-meta text-muted-foreground">添加一个仓库开始使用。</div></div>' +
    `<button type="button" data-slot="button" class="btn btn-outline btn-xs h-6 sm:text-meta">${ic('plus', 'h-3.5 w-3.5')}添加仓库</button>` +
    '</div>';
  const centerFull = (P, width) => {
    // v3 / v4 draw the real composer (both views); v2 keeps its stand-ins.
    const real = st.home !== 'v2';
    let kind = 'chat';
    let s = SELECTED ? byId.get(SELECTED) : null;
    let body;
    if (s && SELECTED !== 'seed') body = real ? chatBodyV3(s) : chatBody(s);
    else if (P) {
      kind = 'home';
      s = null;
      body = st.home === 'v4' ? homeV4() : st.home === 'v3' ? homeV3() : homePage();
    } else {
      kind = 'seed';
      body = real ? startScreenV3(s) : startScreen();
    }
    return (
      `<div class="flex min-w-0 shrink-0 flex-col" style="width:${width}px" data-center data-center-kind="${kind}">` +
      sessionBar(P, kind, s) +
      body +
      '</div>'
    );
  };
  // 「顺序标注」: a column beside the panel naming why each folder sits where it does.
  const annCol = () => '<div class="ann-col" style="width:320px" data-ann-col data-proto-overlay></div>';

  const appHtml = (mode, withCenter) => {
    useData(mode);
    const P = mode === 'proposal';
    const W = Number(st.w);
    const centerW = WIN_W[st.h] - 44 - W;
    return (
      `<div class="proto-root" data-proto-root data-mode="${mode}" style="height:${st.h}px">` +
      titleBar() +
      `<div class="app"><div class="dock bg-card/40">${rail(P)}` +
      `<div class="relative flex h-full min-w-0 flex-col overflow-hidden border-r" style="width:${st.w}px" data-panel>` +
      dockTitle(P) +
      // LeftDock's mount stack: the chat surface sits in an `absolute inset-0` layer.
      '<div class="relative isolate min-h-0 flex-1"><div class="absolute inset-0 z-10"><aside class="flex h-full w-full min-w-0 flex-col">' +
      toolbar(P) +
      (P ? listProposal() : listCurrent()) +
      '</aside></div></div>' +
      footer() +
      '<div data-guides data-proto-overlay></div>' +
      '</div></div>' +
      (withCenter ? (st.ann ? annCol() : st.full ? centerFull(P, centerW) : centerStub(P)) : '') +
      '</div></div>'
    );
  };
  const inkLabel = () =>
    ({ mix: '对话标题：派生式（≈ base-850）', soft850: '对话标题：base-850', soft: '对话标题：base-800', fg: '对话标题：正文色（dsh.8）' })[st.ink];
  const compareHtml = () =>
    '<div class="cmp">' +
    [
      ['current', '现状（dsh.8）', 'LeftNav.tsx @ 6ca5bf42'],
      ['proposal', `方案（#6 ${st.top}）`, inkLabel()],
    ]
      .map(([m, label, sub]) => `<div><div class="cmp-label">${label}<small>${sub}</small></div>${appHtml(m, false)}</div>`)
      .join('') +
    '</div>';

  // ------------------------------------------------------------ post-render
  const drawGuides = (root) => {
    const host = root.querySelector('[data-guides]');
    const W = Number(st.w);
    host.innerHTML = [16, 38, 50, W - 1 - 16]
      .map(
        (x, i) =>
          `<div class="guide" style="left:${x}px"></div><div class="guide-label" style="left:${x}px;top:${40 + (i % 2) * 16}px">${x === W - 1 - 16 ? 'R-16' : x}</div>`
      )
      .join('');
    host.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:50';
  };
  const drawOrderAnn = (root) => {
    const col = root.querySelector('[data-ann-col]');
    if (!col) return;
    const P = root.dataset.mode === 'proposal';
    const cr = col.getBoundingClientRect();
    const vp = root.querySelector('[data-section="repos"] [data-viewport]');
    const vr = vp.getBoundingClientRect();
    let html = `<div class="ann-head">${P && st.order === 'activity' ? '仓库顺序：按文件夹内最后一个对话的活动时间' : '仓库顺序：添加仓库的先后（dsh.8）'}</div>`;
    root.querySelectorAll('[data-section="repos"] [data-folder]').forEach((sec, i) => {
      const r = sec.querySelector('[data-folder-row]').getBoundingClientRect();
      if (r.top < vr.top - 0.5 || r.bottom > vr.bottom + 0.5) return;
      const f = FOLDERS.find((x) => x.id === sec.dataset.folder);
      const la = lastActivity(f);
      const why = f.tempWorkspace ? '临时工作区：固定在最后' : la == null ? '没有对话：排在有对话的后面，保持原顺序' : `最后活动 ${relAge(la)}（${absDateTime(la).slice(5)}）`;
      html += `<div class="ann-label" style="top:${Math.round(r.top - cr.top + (r.height - 18) / 2)}px">${i + 1}. ${why}</div>`;
    });
    col.innerHTML = html;
  };
  // Overlay scrollbar (as if hovered) and the bottom fade, per ScrollArea.
  const decorate = (root) => {
    for (const sr of root.querySelectorAll('[data-scroll-root]')) {
      const vp = sr.querySelector(':scope > [data-viewport]');
      // v2 ruling 2: the fade sits on the top region and on Temporary chats.
      // v3: the home's upper area and the timeline always fade (scrollFade="bottom").
      const fades =
        (st.fade && (vp.dataset.scroll === 'top' || vp.dataset.scroll === 'temp')) ||
        vp.dataset.scroll === 'home' ||
        vp.dataset.scroll === 'timeline';
      const update = () => {
        const range = vp.scrollHeight - vp.clientHeight;
        vp.style.setProperty('--oy-end', `${Math.max(0, range - vp.scrollTop)}px`);
        vp.classList.toggle('fade-b', fades);
        let bar = sr.querySelector(':scope > .sa-bar');
        if (!st.bars || range <= 1) {
          if (bar) bar.remove();
          return;
        }
        if (!bar) {
          bar = document.createElement('div');
          bar.className = 'sa-bar';
          bar.innerHTML = '<div class="sa-thumb"></div>';
          sr.appendChild(bar);
        }
        const track = bar.clientHeight;
        const thumb = Math.max(16, (vp.clientHeight / vp.scrollHeight) * track);
        bar.firstChild.style.height = `${thumb}px`;
        bar.firstChild.style.top = `${(vp.scrollTop / range) * (track - thumb)}px`;
      };
      vp.addEventListener('scroll', update, { passive: true });
      update();
    }
  };
  // The work bar's menus open upward (session geometry), 4px above their trigger
  // and flush with its left edge, capped by the room above: the folder Combobox
  // at min(room, 23rem), the branch Select at the room alone.
  const placeMenus = (root) => {
    const rr = root.getBoundingClientRect();
    for (const popup of root.querySelectorAll('[data-menu-popup]')) {
      const wrap = popup.closest('[data-composer]');
      const anchor = wrap.querySelector(popup.dataset.menuPopup === 'repo' ? '[data-folder-trigger]' : '[data-branch-trigger]');
      if (!anchor) continue;
      const w = wrap.getBoundingClientRect();
      const a = anchor.getBoundingClientRect();
      const room = a.top - rr.top - 4 - 5;
      popup.style.left = `${Math.round(a.left - w.left)}px`;
      popup.style.bottom = `${Math.round(w.bottom - a.top + 4)}px`;
      popup.style.maxHeight = `${Math.floor(popup.dataset.menuPopup === 'repo' ? Math.min(368, room) : room)}px`;
      const list = popup.querySelector('[data-menu-list]');
      const range = list.scrollHeight - list.clientHeight;
      list.style.setProperty('--oy-end', `${Math.max(0, range - list.scrollTop)}px`);
      list.classList.toggle('fade-b', range > 1);
    }
    // v4: the lock's tooltip, centred over the lock icon, 4px above it (side top).
    for (const tip of root.querySelectorAll('[data-tip-popup]')) {
      const wrap = tip.closest('[data-composer]');
      const anchor = wrap.querySelector('[data-branch-lock]');
      if (!anchor) {
        tip.remove();
        continue;
      }
      const w = wrap.getBoundingClientRect();
      const a = anchor.getBoundingClientRect();
      const t = tip.getBoundingClientRect();
      tip.style.left = `${Math.round(a.left + a.width / 2 - w.left - t.width / 2)}px`;
      tip.style.bottom = `${Math.round(w.bottom - a.top + 4)}px`;
    }
  };
  const applyListScroll = (vp) => {
    if (st.scroll === 'mid') {
      // Anchor: the folder holding the selected chat, 40px below the viewport top.
      const anchor = vp.querySelector('[data-folder="nimbus"]');
      if (anchor) vp.scrollTop = Math.round(vp.scrollTop + anchor.getBoundingClientRect().top - vp.getBoundingClientRect().top - 40);
    } else if (st.scroll === 'bottom') {
      vp.scrollTop = vp.scrollHeight;
    }
  };
  const captureScroll = () => {
    const saved = {};
    for (const root of document.querySelectorAll('[data-proto-root]')) {
      for (const vp of root.querySelectorAll('[data-viewport], [data-home-scroll]')) {
        saved[`${root.dataset.mode}:${vp.dataset.scroll || 'home'}`] = vp.scrollTop;
      }
    }
    return saved;
  };
  const postRender = (saved) => {
    for (const root of document.querySelectorAll('[data-proto-root]')) {
      useData(root.dataset.mode);
      for (const vp of root.querySelectorAll('[data-viewport], [data-home-scroll]')) {
        const key = `${root.dataset.mode}:${vp.dataset.scroll || 'home'}`;
        if (saved && key in saved) vp.scrollTop = saved[key];
        else if (vp.dataset.scroll === 'list' || vp.dataset.scroll === 'repos') applyListScroll(vp);
        else if (vp.dataset.scroll === 'top' && st.rscroll === 'bottom') vp.scrollTop = vp.scrollHeight;
      }
      if (st.guides) drawGuides(root);
      decorate(root);
      placeMenus(root);
      drawOrderAnn(root);
    }
  };

  // --------------------------------------------------------------- measure
  const round1 = (n) => Math.round(n * 10) / 10;
  const round2 = (n) => Math.round(n * 100) / 100;
  const visible = (el) => el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden';
  const textOf = (el) => (el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 24);
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const CJK = /[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF\u3000-\u303F]/;
  // Computed colour -> OKLab (oklch / oklab / rgb / color(srgb) forms).
  const toLin = (c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
  const fromSrgb = (r, g, b) => {
    const [R, G, B] = [r, g, b].map(toLin);
    const l = Math.cbrt(0.4122214708 * R + 0.5363325363 * G + 0.0514459929 * B);
    const mm = Math.cbrt(0.2119034982 * R + 0.6806995451 * G + 0.1073969566 * B);
    const s = Math.cbrt(0.0883024619 * R + 0.2817188376 * G + 0.6299787005 * B);
    return {
      L: 0.2104542553 * l + 0.793617785 * mm - 0.0040720468 * s,
      a: 1.9779984951 * l - 2.428592205 * mm + 0.4505937099 * s,
      b: 0.0259040371 * l + 0.7827717662 * mm - 0.808675766 * s,
    };
  };
  const lab = (c) => {
    let m = /oklch\(\s*([\d.]+)(%?)\s+([\d.]+)\s+([\d.]+)/.exec(c);
    if (m) {
      const L = m[2] ? Number(m[1]) / 100 : Number(m[1]);
      const h = (Number(m[4]) * Math.PI) / 180;
      return { L, a: Number(m[3]) * Math.cos(h), b: Number(m[3]) * Math.sin(h) };
    }
    m = /oklab\(\s*([\d.]+)(%?)\s+(-?[\d.e-]+)\s+(-?[\d.e-]+)/.exec(c);
    if (m) return { L: m[2] ? Number(m[1]) / 100 : Number(m[1]), a: Number(m[3]), b: Number(m[4]) };
    m = /color\(srgb\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)/.exec(c);
    if (m) return fromSrgb(Number(m[1]), Number(m[2]), Number(m[3]));
    m = /rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)/.exec(c);
    if (m) return fromSrgb(Number(m[1]) / 255, Number(m[2]) / 255, Number(m[3]) / 255);
    return null;
  };
  const dE = (x, y) => (x && y ? Math.hypot(x.L - y.L, x.a - y.a, x.b - y.b) : null);

  const measureRoot = (root) => {
    const mode = root.dataset.mode;
    useData(mode);
    const P = mode === 'proposal';
    const V2 = P && st.top === 'v2';
    const panel = root.querySelector('[data-panel]');
    const pr = panel.getBoundingClientRect();
    const relX = (x) => round1(x - pr.left);
    const W = Math.round(pr.width);
    const H = Number(st.h);
    const listArea = root.querySelector('[data-list-area]');
    const la = listArea.getBoundingClientRect();
    const first = (sel) => [...root.querySelectorAll(sel)].find(visible) || null;
    const hOf = (sel) => {
      const el = root.querySelector(sel);
      return el ? round2(el.getBoundingClientRect().height) : null;
    };
    const out = {
      mode,
      top: P ? st.top : 'dsh.8',
      panelWidth: W,
      windowHeight: H,
      rootWidth: Math.round(root.getBoundingClientRect().width),
      listAreaHeight: round2(la.height),
      checks: {},
      regions: null,
    };

    // (0) the shell chrome adds up like the real app: list area = window - 186
    const chrome = { titleBar: hOf('[data-titlebar]'), dockTitle: hOf('[data-box="L0"]'), toolbar: hOf('[data-toolbar]'), footer: hOf('[data-footer]') };
    out.checks.shellChrome = {
      // The search box is inline-flex, so the toolbar's line box carries a
      // fraction of a pixel of baseline allowance (77.25 here): +-0.5px.
      pass:
        Math.abs(la.height - (H - 186)) <= 0.5 &&
        Object.entries({ titleBar: 32, dockTitle: 36, toolbar: 77, footer: 41 }).every(([k, v]) => Math.abs(chrome[k] - v) <= 0.5),
      chrome,
      expectedListArea: H - 186,
    };

    // (1) font size / weight per level (and the session bar title on the same h-9 line)
    const EXP = P
      ? { 0: [16, 600], 1: [16, 600], 2: [15, 600], 3: [14, 400], 4: [14, 400], bar: [16, 400] }
      : { 0: [15, 600], 1: [15, 600], 2: [15, 600], 3: [15, 400], 4: [14, 400], bar: [15, 400] };
    const wOf = (w) => (st.cjk && w === 600 ? 700 : w);
    const seen = {};
    const fontBad = [];
    const checkFont = (el, key) => {
      const cs = getComputedStyle(el);
      const fs = parseFloat(cs.fontSize);
      const fw = Number(cs.fontWeight);
      (seen[key] = seen[key] || new Set()).add(`${fs}px/${fw}`);
      const [efs, efw] = EXP[key === 'bar' ? 'bar' : key.slice(1)];
      if (fs !== efs || fw !== wOf(efw)) {
        if (!fontBad.some((v) => v.level === key && v.fontSize === fs && v.fontWeight === fw)) {
          fontBad.push({ level: key, text: textOf(el), fontSize: fs, fontWeight: fw, expected: [efs, wOf(efw)] });
        }
      }
    };
    root.querySelectorAll('[data-panel] [data-level]').forEach((el) => {
      if (el.closest('[data-slot="button"],[data-slot="badge"]') || !visible(el)) return;
      checkFont(el, `L${el.dataset.level}`);
    });
    const bar = root.querySelector('[data-sessionbar-title]');
    if (bar) checkFont(bar, 'bar');
    out.checks.levelFonts = {
      // Without a repository the panel shows only the empty-state card (no L1 / L2 / L4).
      pass: fontBad.length === 0 && (FOLDERS.length ? ['L0', 'L1', 'L2', 'L4'] : ['L0']).every((k) => seen[k]),
      expected: Object.fromEntries(Object.entries(EXP).map(([k, [s, w]]) => [k, `${s}px/${wOf(w)}`])),
      seen: Object.fromEntries(Object.entries(seen).sort().map(([k, v]) => [k, [...v]])),
      violations: fontBad,
    };

    // (2) title ink: L3 = --foreground-soft (the open row: foreground); L1 / L2 = foreground.
    // v2 default: --foreground-soft IS color-mix(in oklab, foreground 50%, muted-foreground).
    const probe = (value) => {
      const s = document.createElement('span');
      s.style.color = value;
      panel.appendChild(s);
      const c = getComputedStyle(s).color;
      s.remove();
      return c;
    };
    const fg = probe('var(--foreground)');
    const soft = probe('var(--foreground-soft)');
    const derived = probe('color-mix(in oklab, var(--foreground) 50%, var(--muted-foreground))');
    const accentFg = probe('var(--accent-foreground)');
    const wantSoft = P && st.ink !== 'fg';
    const inkBad = [];
    let nSel = 0;
    let nOther = 0;
    root.querySelectorAll('[data-row] [data-title]').forEach((t) => {
      if (!visible(t)) return;
      const selected = t.closest('[data-row]').classList.contains('bg-selection');
      const want = selected ? accentFg : wantSoft ? soft : fg;
      if (selected) nSel += 1;
      else nOther += 1;
      const got = getComputedStyle(t).color;
      if (got !== want && inkBad.length < 6) inkBad.push({ session: t.closest('[data-row]').dataset.session, selected, got, want });
    });
    root.querySelectorAll('[data-level="1"], [data-level="2"]').forEach((el) => {
      const got = getComputedStyle(el).color;
      if (got !== fg && inkBad.length < 6) inkBad.push({ level: el.dataset.level, text: textOf(el), got, want: fg });
    });
    const derivedOk = !P || st.ink !== 'mix' || soft === derived;
    out.checks.titleInk = {
      pass: inkBad.length === 0 && (nOther > 0 || SESSIONS.every((x) => x.id === SELECTED)) && derivedOk,
      expected: wantSoft ? (st.ink === 'mix' ? 'color-mix(in oklab, foreground 50%, muted-foreground)' : '--foreground-soft') : '--foreground',
      derivedEqualsToken: derivedOk,
      rows: { open: nSel, others: nOther },
      colors: { foreground: fg, foregroundSoft: soft, derived },
      deltaE: {
        foregroundToSoft: round2(dE(lab(fg), lab(soft))),
        softToMuted: round2(dE(lab(soft), lab(probe('var(--muted-foreground)')))),
      },
      violations: inkBad,
    };

    // (3) regions: top <= 33%, Temporary chats <= 25%, tiled, content-sized up to the cap
    if (P) {
      const info = (id, pct) => {
        const el = root.querySelector(`[data-region="${id}"]`);
        if (!el) return null;
        const r = el.getBoundingClientRect();
        const vp = el.querySelector('[data-viewport]');
        const content = vp.firstElementChild ? vp.firstElementChild.getBoundingClientRect().height : 0;
        const hdr = el.querySelector('[data-box="L1"]');
        const header = hdr ? hdr.getBoundingClientRect().height : 0;
        const border = parseFloat(getComputedStyle(el).borderTopWidth);
        const natural = border + header + content;
        const cap = pct ? la.height * pct : null;
        const overflow = vp.scrollHeight - vp.clientHeight > 0.5;
        return {
          title: hdr ? textOf(hdr.querySelector('[data-level="1"]')) : '（空状态卡片）',
          top: round2(r.top - la.top),
          height: round2(r.height),
          pctOfList: round2((r.height / la.height) * 100),
          cap: cap == null ? null : round2(cap),
          natural: round2(natural),
          viewport: round2(vp.clientHeight),
          scrollRange: Math.round(vp.scrollHeight - vp.clientHeight),
          overflow,
          // content-sized: as tall as its content, or at the cap and scrolling
          contentSized: cap == null ? true : overflow ? Math.abs(r.height - cap) <= 1 : Math.abs(r.height - natural) <= 1,
        };
      };
      const R = { top: info('top', 0.33), repos: info('repos', null), temp: info('temp', 0.25) };
      const list = [R.top, R.repos, R.temp].filter(Boolean);
      let tiled = Math.abs(list[0].top) <= 0.5;
      for (let i = 1; i < list.length; i++) tiled = tiled && Math.abs(list[i].top - (list[i - 1].top + list[i - 1].height)) <= 0.5;
      const sum = list.reduce((acc, r) => acc + r.height, 0);
      tiled = tiled && Math.abs(sum - la.height) <= 1;
      out.regions = R;
      out.checks.regions = {
        pass:
          (!R.top || (R.top.height <= R.top.cap + 1 && R.top.contentSized)) &&
          (!R.temp || (R.temp.height <= R.temp.cap + 1 && R.temp.contentSized)) &&
          tiled,
        tiled,
        sum: round2(sum),
        listArea: round2(la.height),
      };
    } else {
      out.checks.regions = { pass: false, note: '现状只有一个滚动区，「最近」「仓库列表」「临时对话」在同一个视口里' };
    }

    // (4) scrolling the repository list leaves the other regions where they are
    {
      const scroller = P ? root.querySelector('[data-region="repos"] [data-viewport]') : root.querySelector('[data-viewport]');
      const watched = [...root.querySelectorAll('[data-section="top"], [data-section="temp"]')].flatMap((sec) =>
        [sec.querySelector('[data-box="L1"]'), sec.querySelector('[data-row]')].filter(Boolean)
      );
      const snap = () => watched.map((el) => el.getBoundingClientRect().top);
      const saved = scroller.scrollTop;
      scroller.scrollTop = 0;
      const a = snap();
      scroller.scrollTop = scroller.scrollHeight;
      const b = snap();
      scroller.scrollTop = saved;
      const range = Math.round(scroller.scrollHeight - scroller.clientHeight);
      const moved = Math.max(0, ...a.map((v, i) => Math.abs(v - b[i])));
      out.checks.regionsIndependent = {
        pass: range === 0 || moved < 0.5,
        reposScrollRange: range,
        otherRegionsMovedPx: round1(moved),
        watched: watched.length,
      };
    }

    // (5) L1 titles sit outside every scroll viewport
    {
      const l1 = [...root.querySelectorAll('[data-level="1"]')];
      const inside = l1.filter((el) => el.closest('[data-viewport]')).map(textOf);
      out.checks.l1OutsideScroll = { pass: (l1.length > 0 || !FOLDERS.length) && inside.length === 0, titles: l1.length, insideViewport: inside };
    }

    // (6a) v1 / dsh.8 「最近」 two segments
    if (!V2) {
      const sec = root.querySelector('[data-section="top"]');
      const L = P ? LIMIT.proposal : LIMIT.current;
      const act = activeRows();
      const lowerAll = recentLower();
      const expectSeg = (total, limit, showAll) =>
        showAll || total <= limit
          ? { rows: total, aux: showAll && total > limit ? '收起' : null }
          : { rows: limit, aux: `查看更多（${total - limit}）` };
      const got = (el) =>
        el ? { rows: el.querySelectorAll('[data-row]').length, aux: textOf(el.querySelector('[data-more]') || document.createElement('i')) || null } : null;
      const eUp = act.length ? expectSeg(act.length, L.active, st.active === 'all') : null;
      const eLow = st.recent === 'collapsed' || !lowerAll.length ? null : expectSeg(lowerAll.length, L.lower, st.lower === 'all');
      const segUp = sec.querySelector('[data-segment="active"]');
      const segLow = sec.querySelector('[data-segment="lower"]');
      const gUp = got(segUp);
      const gLow = got(segLow);
      const ids = [...sec.querySelectorAll('[data-row]')].map((r) => r.dataset.session);
      const dup = [...new Set(ids.filter((id, i) => ids.indexOf(id) !== i))];
      const activeIds = new Set(act.map((s) => s.id));
      const leak = segLow ? [...segLow.querySelectorAll('[data-row]')].map((r) => r.dataset.session).filter((id) => activeIds.has(id)) : [];
      const capOk = !P || ((st.active === 'all' || !gUp || gUp.rows <= 5) && (st.lower === 'all' || !gLow || gLow.rows <= 5));
      out.checks.recentSegments = {
        pass: same(eUp, gUp) && same(eLow, gLow) && dup.length === 0 && leak.length === 0 && capOk,
        upper: { total: act.length, expected: eUp, got: gUp },
        lower: { total: lowerAll.length, expected: eLow, got: gLow },
        duplicates: dup,
        lowerHoldsActiveChats: leak,
        selectedRowHighlights: SELECTED ? root.querySelectorAll(`[data-row][data-session="${SELECTED}"].bg-selection`).length : 0,
      };
    } else {
      out.checks.recentSegments = { applicable: false, pass: true };
    }

    // (6b) v2 「正在活动」: <= 5 + 「查看更多（N）」, hidden (title included) when nothing is active
    if (V2) {
      const act = activeRows();
      const reg = root.querySelector('[data-region="top"]');
      const list = root.querySelector('[data-list-area]');
      let pass;
      let detail;
      if (!act.length) {
        pass = !reg;
        detail = { active: 0, regionShown: !!reg };
      } else {
        const collapsed = st.recent === 'collapsed';
        const rows = reg ? reg.querySelectorAll('[data-row]').length : -1;
        const aux = reg ? textOf(reg.querySelector('[data-more]') || document.createElement('i')) || null : null;
        const expRows = collapsed ? 0 : st.active === 'all' ? act.length : Math.min(5, act.length);
        const expAux = collapsed || act.length <= 5 ? null : st.active === 'all' ? '收起' : `查看更多（${act.length - 5}）`;
        const ids = reg ? [...reg.querySelectorAll('[data-row]')].map((r) => r.dataset.session) : [];
        pass =
          !!reg &&
          list.firstElementChild === reg &&
          textOf(reg.querySelector('[data-level="1"]')) === '正在活动' &&
          rows === expRows &&
          aux === expAux &&
          new Set(ids).size === ids.length &&
          (st.active === 'all' || rows <= 5);
        detail = { active: act.length, rows, expectedRows: expRows, aux, expectedAux: expAux, collapsed };
      }
      out.checks.activeRegion = { pass, ...detail };
      out.checks.noLowerSegment = {
        pass: !root.querySelector('[data-segment="lower"]') && !root.querySelector('[data-sublabel]') && !panel.textContent.includes('48 小时内'),
      };
    } else {
      out.checks.activeRegion = { applicable: false, pass: true };
      out.checks.noLowerSegment = { applicable: false, pass: true };
    }

    // (7) folder order: v2 by last activity (empties after, Temp last); otherwise addition order
    {
      const got = [...root.querySelectorAll('[data-section="repos"] [data-folder]')].map((s) => s.dataset.folder);
      const folderOf = (id) => FOLDERS.find((f) => f.id === id);
      let pass;
      const byActivity = P && st.order === 'activity';
      if (byActivity) {
        const repos = got.filter((id) => !folderOf(id).tempWorkspace);
        const acts = repos.map((id) => lastActivity(folderOf(id)));
        const firstEmpty = acts.findIndex((a) => a == null);
        const withChats = firstEmpty < 0 ? acts : acts.slice(0, firstEmpty);
        const empties = firstEmpty < 0 ? [] : repos.slice(firstEmpty);
        const originalEmpties = FOLDERS.filter((f) => !f.tempWorkspace && lastActivity(f) == null).map((f) => f.id);
        pass =
          got.length === FOLDERS.length &&
          (!FOLDERS.some((f) => f.tempWorkspace) || got[got.length - 1] === 'tempws') &&
          withChats.every((a, i) => a != null && (i === 0 || a <= withChats[i - 1])) &&
          (firstEmpty < 0 || acts.slice(firstEmpty).every((a) => a == null)) &&
          same(empties, originalEmpties);
      } else {
        pass = same(got, FOLDERS.map((f) => f.id));
      }
      out.checks.folderOrder = {
        pass,
        rule: byActivity ? '按最后活动时间（无对话的在后、临时工作区最后）' : '添加仓库的先后',
        order: got.map((id) => {
          const a = lastActivity(folderOf(id));
          return `${folderOf(id).name}${a == null ? '' : `@${relAge(a)}`}`;
        }),
      };
    }

    // (8) issue #3's x coordinates stay
    const left = (el) => (el ? relX(el.getBoundingClientRect().left) : null);
    const time = first('[data-row] [data-time]');
    const coords = {
      L0TextX: left(first('[data-level="0"]')),
      L1TextX: left(first('[data-level="1"]')),
      sublabelTextX: (() => {
        const el = first('[data-sublabel]');
        return el ? relX(el.getBoundingClientRect().left + parseFloat(getComputedStyle(el).paddingLeft)) : null;
      })(),
      folderIconX: left(first('[data-folder-row] [data-icon]')),
      folderNameX: left(first('[data-level="2"]')),
      unnestedSlotX: left(first('[data-row][data-depth="0"] [data-slot-marker]')),
      unnestedTitleX: left(first('[data-row][data-depth="0"] [data-title]')),
      inFolderSlotX: left(first('[data-row][data-depth="1"] [data-slot-marker]')),
      inFolderTitleX: left(first('[data-row][data-depth="1"] [data-title]')),
      timeBoxRightInset: time ? round1(pr.right - 1 - time.getBoundingClientRect().right) : null,
    };
    const want = { L1TextX: 16, sublabelTextX: 16, folderNameX: 38, unnestedTitleX: 38, inFolderTitleX: 50, timeBoxRightInset: 16 };
    const off = Object.entries(want).filter(([k, v]) => coords[k] != null && Math.abs(coords[k] - v) > 0.5);
    out.coords = coords;
    out.checks.coordsKept = { pass: off.length === 0, expected: want, off: Object.fromEntries(off.map(([k]) => [k, coords[k]])) };

    // (9) title widths (280: in-folder rows without context text or alert badges >= 160)
    {
      const plain1 = [];
      const ctx1 = [];
      const badge1 = [];
      const tw1 = [];
      const any0 = [];
      root.querySelectorAll('[data-row]').forEach((r) => {
        if (!visible(r)) return;
        const t = r.querySelector('[data-title]');
        const w = round1(t.getBoundingClientRect().width);
        const hasCtx = !!r.querySelector('[data-context]');
        const hasBadge = !!r.querySelector('[data-slot="badge"]');
        // Temporary-workspace rows: a 60px time box (three hover actions) by design.
        if (r.dataset.depth === '1') (r.hasAttribute('data-tw') ? tw1 : hasCtx ? ctx1 : hasBadge ? badge1 : plain1).push(w);
        else any0.push(w);
      });
      const stats = (a) => (a.length ? { n: a.length, min: Math.min(...a), max: Math.max(...a) } : null);
      const titleFs = (() => {
        const t = first('[data-row] [data-title]');
        return t ? parseFloat(getComputedStyle(t).fontSize) : null;
      })();
      out.titleWidths = {
        inFolderPlain: stats(plain1),
        inFolderWithContext: stats(ctx1),
        inFolderWithAlertBadge: stats(badge1),
        inFolderTempWorkspace: stats(tw1),
        unnested: stats(any0),
        titleFontSize: titleFs,
        cjkCharsInFolderPlain: plain1.length && titleFs ? Math.floor(Math.min(...plain1) / titleFs) : null,
        cjkCharsUnnested: any0.length && titleFs ? Math.floor(Math.max(...any0) / titleFs) : null,
      };
      if (W === 280) {
        const floorOk = ctx1.concat(badge1, tw1).every((w) => w >= 80 - 0.5);
        out.checks.titleWidth160 = {
          applicable: plain1.length > 0,
          pass: plain1.length === 0 || (Math.min(...plain1) >= 160 - 0.5 && floorOk),
          inFolderPlainMin: plain1.length ? Math.min(...plain1) : null,
          othersMin: ctx1.concat(badge1, tw1).length ? Math.min(...ctx1.concat(badge1, tw1)) : null,
        };
      }
    }

    // (10) nothing spills out of a row's content box (sidebar rows, home rows, the toolbar row)
    {
      const overflow = [];
      root
        .querySelectorAll(
          '[data-row],[data-folder-row],[data-folder-row] > button,[data-box="L1"],[data-more],[data-sublabel],[data-home-row],[data-toolbar-row],[data-target-row],[data-composer-bar]'
        )
        .forEach((r) => {
          if (!visible(r)) return;
          const rr = r.getBoundingClientRect();
          const cs = getComputedStyle(r);
          const lo = rr.left + parseFloat(cs.borderLeftWidth) + parseFloat(cs.paddingLeft) - 0.5;
          const hi = rr.right - parseFloat(cs.borderRightWidth) - parseFloat(cs.paddingRight) + 0.5;
          const spill = [];
          for (const c of r.children) {
            if (!visible(c) || getComputedStyle(c).position === 'absolute') continue;
            const cr = c.getBoundingClientRect();
            if (cr.width === 0) continue;
            if (cr.left < lo || cr.right > hi) spill.push({ child: textOf(c) || c.tagName.toLowerCase(), byLeft: round1(lo - cr.left), byRight: round1(cr.right - hi) });
          }
          if (r.scrollWidth > r.clientWidth + 1) spill.push({ scrollWidth: r.scrollWidth, clientWidth: r.clientWidth });
          if (spill.length) overflow.push({ row: r.dataset.session || textOf(r), spill });
        });
      out.checks.noRowOverflow = { pass: overflow.length === 0, count: overflow.length, overflow: overflow.slice(0, 8) };
    }

    // (11) no CJK text under 14px anywhere in the window (prototype overlays excluded)
    {
      const small = [];
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      for (let n = walker.nextNode(); n; n = walker.nextNode()) {
        if (!CJK.test(n.data)) continue;
        const el = n.parentElement;
        if (!visible(el) || el.closest('[data-proto-overlay]')) continue;
        const fs = parseFloat(getComputedStyle(el).fontSize);
        if (fs < 14) small.push({ text: n.data.trim().slice(0, 12), fontSize: fs });
      }
      root.querySelectorAll('input').forEach((inp) => {
        const fs = parseFloat(getComputedStyle(inp).fontSize);
        if (CJK.test(inp.placeholder || '') && fs < 14) small.push({ text: inp.placeholder, fontSize: fs, placeholder: true });
      });
      out.checks.noSmallCjk = { pass: small.length === 0, violations: small };
    }

    // (12) same-depth titles share one x
    {
      const xs = {};
      root.querySelectorAll('[data-panel] [data-align-depth]').forEach((el) => {
        if (!visible(el)) return;
        const d = `depth${el.dataset.alignDepth}`;
        const x = relX(el.getBoundingClientRect().left);
        xs[d] = xs[d] || new Map();
        xs[d].set(x, (xs[d].get(x) || 0) + 1);
      });
      out.checks.sameDepthX = {
        pass: Object.values(xs).every((m) => Math.max(...m.keys()) - Math.min(...m.keys()) <= 0.5),
        xByDepth: Object.fromEntries(
          Object.entries(xs).map(([d, m]) => [d, Object.fromEntries([...m].sort((a, b) => a[0] - b[0]).map(([x, n]) => [String(x), n]))])
        ),
      };
    }

    // (13) carriers between adjacent levels (colour counts at dE_ok >= 0.02)
    {
      const secs = [...root.querySelectorAll('[data-section]')];
      const bgL = (lab(getComputedStyle(root).backgroundColor) || {}).L;
      const describe = (el, lvl) => {
        if (!el) return null;
        const cs = getComputedStyle(el);
        const box = el.closest('[data-box]') || el;
        const er = el.getBoundingClientRect();
        const icon = [...box.querySelectorAll('[data-icon]')].find(
          (i) => visible(i) && !i.closest('[data-slot="button"]') && i.getBoundingClientRect().right <= er.left + 0.5
        );
        const fw = Number(cs.fontWeight);
        const c = lab(cs.color);
        return {
          text: textOf(el),
          fontSize: parseFloat(cs.fontSize),
          fontWeight: fw,
          winWeight: fw === 500 ? 400 : fw >= 600 ? 700 : fw,
          color: cs.color,
          lab: c,
          contrastL: c && bgL != null ? round2(Math.abs(c.L - bgL)) : null,
          letterSpacingEm: round2(parseFloat(cs.letterSpacing) / parseFloat(cs.fontSize) || 0),
          boxHeight: round1(box.getBoundingClientRect().height),
          textX: relX(er.left),
          leadingIcon: !!icon,
          divider:
            lvl === 0
              ? parseFloat(getComputedStyle(box).borderBottomWidth) > 0
              : lvl === 1
                ? secs.some((s) => parseFloat(getComputedStyle(s).borderTopWidth) > 0)
                : false,
        };
      };
      const reps = [
        describe(first('[data-level="0"]'), 0),
        describe(first('[data-level="1"]'), 1),

            .join('')}</div></div>`
      ).join('') +
      `<div class="grp">${TOGGLES.map(([key, t]) => `<label><input type="checkbox" data-toggle="${key}" ${st[key] ? 'checked' : ''} />${t}</label>`).join('')}</div>`;
  };
  document.getElementById('controls').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-key]');
    if (!b) return;
    const key = b.dataset.key;
    st[key] = b.dataset.v;
    // v4: a draft branch belongs to the repository it was picked in.
    if (key === 'target') st.branch = '';
    if (key === 'folders') {
      ui.collapsed.clear();
      if (st.folders === 'collapsed') for (const f of FOLDERS) ui.collapsed.add(f.id);
    }
    apply({ keepScroll: !RESET_SCROLL.has(key) });
  });
  document.getElementById('controls').addEventListener('change', (e) => {
    const t = e.target.closest('input[data-toggle]');
    if (!t) return;
    st[t.dataset.toggle] = t.checked;
    // 「已从首页发送」 shows the conversation it started; off, back to the home page.
    if (t.dataset.toggle === 'sent') {
      st.center = t.checked ? 'chat' : 'home';
      st.menu = 'none';
    }
    // 「发送被锁拦下」: nimbus-agent busy (使用中), a branch picked before the lock, on the home.
    if (t.dataset.toggle === 'blocked' && t.checked) {
      st.home = 'v4';
      st.scene = 'busy';
      st.target = 'auto';
      st.center = 'home';
      st.menu = 'none';
      st.sent = false;
      if (!st.branch) st.branch = 'feature/home-composer';
    }
    apply({ keepScroll: !['full', 'ann', 'sent'].includes(t.dataset.toggle) });
  });
  // Clicks inside the panels: the prototype's own interactions.
  document.getElementById('stage').addEventListener('click', (e) => {
    const a = e.target.closest('[data-action]');
    if (!a) return;
    const fid = a.dataset.fid;
    let keep = true;
    switch (a.dataset.action) {
      case 'toggle-recent':
        st.recent = st.recent === 'collapsed' ? 'expanded' : 'collapsed';
        break;
      case 'active-more':
        st.active = 'all';
        break;
      case 'active-less':
        st.active = 'less';
        break;
      case 'lower-more':
        st.lower = 'all';
        break;
      case 'lower-less':
        st.lower = 'less';
        break;
      case 'home-more':
        st.homemore = 'all';
        break;
      case 'home-less':
        st.homemore = 'less';
        break;
      case 'folder-toggle':
        if (ui.collapsed.has(fid)) ui.collapsed.delete(fid);
        else ui.collapsed.add(fid);
        syncFolders();
        break;
      case 'folder-more':
        ui.showAll.add(fid);
        break;
      case 'folder-less':
        ui.showAll.delete(fid);
        break;
      case 'collapse-all':
        // Every folder in Repositories, the 「临时工作区」 folder included.
        // The 「临时对话」 region is not a folder and keeps its own state.
        for (const f of FOLDERS) ui.collapsed.add(f.id);
        syncFolders();
        break;
      case 'temp-toggle':
        ui.tempCollapsed = !ui.tempCollapsed;
        break;
      case 'open':
        st.center = 'chat';
        st.open = a.dataset.sid && KNOWN.has(a.dataset.sid) ? a.dataset.sid : st.open;
        st.menu = 'none';
        break;
      case 'go-home':
        st.center = 'home';
        st.menu = 'none';
        keep = false;
        break;
      // v3: the work bar on the home page
      case 'new-in-folder':
        st.center = 'home';
        st.target = fid;
        st.branch = '';
        st.menu = 'none';
        keep = false;
        break;
      case 'menu-repo':
        st.menu = st.menu === 'repo' ? 'none' : 'repo';
        break;
      case 'menu-branch':
        st.menu = st.menu === 'branch' ? 'none' : 'branch';
        break;
      case 'pick-repo':
        st.target = fid;
        st.branch = '';
        st.menu = 'none';
        break;
      case 'pick-branch': {
        // v4: a draft for this send; picking the current branch clears it.
        useData('proposal');
        const f = homeTargetFolder();
        const b = a.dataset.branch || '';
        st.branch = st.home === 'v4' && f && b !== f.branch ? b : '';
        st.menu = 'none';
        break;
      }
      case 'send': {
        // v4: a branch picked before a chat started running in this checkout
        // cannot be switched to now: do not send, ask (the text stays).
        useData('proposal');
        const f = homeTargetFolder();
        if (f && homeDraftBranch(f) && checkoutBusy(f, null, null)) {
          st.blocked = true;
          st.typed = true;
          st.menu = 'none';
          st.tip = 'none';
          break;
        }
        st.sent = true;
        st.center = 'chat';
        st.open = 'new1';
        st.menu = 'none';
        st.tip = 'none';
        st.blocked = false;
        st.typed = false;
        keep = false;
        break;
      }
      case 'blocked-current':
        // 「改在 <当前分支> 上发送」: drop the draft branch and send.
        st.branch = '';
        st.blocked = false;
        st.typed = false;
        st.tip = 'none';
        st.sent = true;
        st.center = 'chat';
        st.open = 'new1';
        st.menu = 'none';
        keep = false;
        break;
      case 'blocked-cancel':
        // 「取消」: nothing is sent; the message stays in the composer.
        st.blocked = false;
        break;
      default:
        return;
    }
    apply({ keepScroll: keep });
  });

  const NAMES = {
    shellChrome: '列表区高度 = 窗口高 − 186',
    levelFonts: '字号字重（L0–L4、会话栏标题）',
    titleInk: '对话标题颜色（打开的那行用正文色）',
    regions: '分区：33% / 25% 上限、按内容伸缩、首尾相接',
    regionsIndependent: '滚动仓库列表时另外两区不动',
    l1OutsideScroll: '板块标题不在任何滚动区内',
    recentSegments: '「最近」两段计数、查看更多（N）、不重复',
    activeRegion: '「正在活动」≤5 + 查看更多（N），为空时整区隐藏',
    noLowerSegment: '侧栏没有「48 小时内」段',
    folderOrder: '仓库顺序',
    coordsKept: '#3 横坐标（16 / 38 / 50 / 右 16）',
    titleWidth160: '280 宽文件夹内标题 ≥160px',
    noRowOverflow: '行内不溢出',
    noSmallCjk: '中文 ≥14px',
    sameDepthX: '同深度对齐',
    carriers: '相邻层级 ≥2 个区分载体',
    monotonic: '高一级不弱于低一级（参考）',
    reposHeaderButtons: '「仓库列表」标题栏三个按钮',
    collapseAll: '全部折叠',
    home: '首页 v2：新建对话 + 添加仓库 + 最近对话',
    homeEntry: '回到首页的入口',
    homeV3: '首页 v3：标题 + 最近对话 + 输入框；标题里的仓库 = 工作栏仓库',
    composerStable: '首页与对话页的输入框位置、宽度一致（±1px）',
    menuOpen: '工作栏菜单：在触发器上方、窗口内、内容齐全',
  };
  const summary = (m) =>
    m.roots
      .map((r) => {
        const lines = [`【${r.mode === 'proposal' ? `方案（#6 ${r.top}）` : '现状（dsh.8）'}】面板 ${r.panelWidth}px · 窗口高 ${r.windowHeight} · 列表区 ${r.listAreaHeight}px`];
        for (const [k, v] of Object.entries(r.checks)) {
          if (v.applicable === false) continue;
          lines.push(`  ${v.pass ? '✓' : '✗'} ${NAMES[k] || k}`);
        }
        if (r.regions) {
          for (const [k, v] of Object.entries(r.regions)) {
            if (v) lines.push(`  区 ${k}「${v.title}」: 高 ${v.height}（${v.pctOfList}%${v.cap ? `，上限 ${v.cap}` : ''}），内容 ${v.natural}，${v.overflow ? `区内滚动 ${v.scrollRange}px` : '不滚动'}`);
          }
        }
        lines.push(`  仓库顺序 ${r.checks.folderOrder.order.join(' → ')}`);
        if (r.home) lines.push(`  首页 ${JSON.stringify(r.home)}`);
        if (r.home3) lines.push(`  首页 v3 ${JSON.stringify(r.home3)}`);
        if (r.checks.composerStable && r.checks.composerStable.applicable !== false) {
          const c = r.checks.composerStable;
          lines.push(`  输入框 ${c.from} → ${c.to}：卡片位移 ${JSON.stringify(c.delta)}，工作栏位移 ${c.targetRowDelta}`);
        }
        lines.push(`  坐标 ${JSON.stringify(r.coords)}`);
        lines.push(`  标题宽 ${JSON.stringify(r.titleWidths)}`);
        lines.push(`  颜色 ΔE ${JSON.stringify(r.checks.titleInk.deltaE)}`);
        lines.push(`  载体 ${r.carriers.pairs.map((p) => `${p.pair}:${(p.carriers || []).join('+') || '无'}`).join('  ')}`);
        return lines.join('\n');
      })
      .join('\n\n');

  const apply = (opts = {}) => {
    const saved = opts.keepScroll ? captureScroll() : null;
    document.documentElement.classList.toggle('dark', st.theme === 'dark');
    document.documentElement.classList.toggle('ink-850', st.ink === 'soft850');
    document.documentElement.classList.toggle('ink-800', st.ink === 'soft');
    document.body.classList.toggle('cjkwin', st.cjk);
    const stage = document.getElementById('stage');
    stage.innerHTML = st.mode === 'compare' ? compareHtml() : appHtml(st.mode, true);
    postRender(saved);
    if (!SHOT) {
      renderControls();
      const q = new URLSearchParams();
      for (const [k, v] of Object.entries(st)) if (v !== 'mixed') q.set(k, v === true ? '1' : v === false ? '0' : v);
      // Firefox may refuse history writes on file:// pages; the page works without them.
      try {
        history.replaceState(null, '', `?${q}`);
      } catch {
        // ignore
      }
      document.getElementById('report').textContent = summary(window.__measure());
    }
  };
  apply();
})();
</script>
</body>
</html>
