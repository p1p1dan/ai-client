<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>对话区回放 · 工具与正文（第二版）</title>
<style>
  /* Tokens follow docs/design-system.md v2 (reference values). */
  :root {
    --surface-0: #f9f9f7;
    --surface-1: #fcfcfb;
    --surface-2: #f4f3ef;
    --surface-3: #ffffff;
    --fg: #151515;
    --fg-2: #525252;
    --fg-3: #8a8a8a;
    --border-soft: color-mix(in oklab, var(--fg) 10%, var(--surface-1));
    --border-strong: color-mix(in oklab, var(--fg) 20%, var(--surface-1));
    --hover: color-mix(in oklab, var(--fg) 5%, var(--surface-1));
    --fill-neutral: color-mix(in oklab, var(--fg) 6%, var(--surface-1));
    --primary: #c6613f;
    --success: #4f8a5b;
    --warning: #b9822b;
    --destructive: #c4483e;
    --info: #5b7fa6;
    --code-fg: #5769f7;
    --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", Consolas, "Microsoft YaHei UI", monospace;
  }
  .dark {
    --surface-0: #0b0b0b;
    --surface-1: #151515;
    --surface-2: #1a1a19;
    --surface-3: #20201f;
    --fg: #f5f5f5;
    --fg-2: #a3a3a3;
    --fg-3: #666666;
    --primary: #d97757;
    --success: #6fae7c;
    --warning: #d9a24a;
    --destructive: #e0675c;
    --info: #7f9fc4;
    --code-fg: #b1b9f9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    background: var(--surface-0); color: var(--fg); font-size: 13px; line-height: 1.43;
  }
  svg.i { width: 14px; height: 14px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.125em; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .15; } }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  code { font-family: var(--mono); font-size: 12px; background: var(--fill-neutral); padding: 0 4px; border-radius: 4px; }
  .faint { color: var(--fg-3); }
  .soft { color: var(--fg-2); }
  .ok { color: var(--success); }
  .warn { color: var(--warning); }
  .err { color: var(--destructive); }
  .num { font-variant-numeric: tabular-nums; }
  .clickable { cursor: pointer; }
  .chev { transition: transform .15s; color: var(--fg-3); }
  .open > .chev, .open .chev.own { transform: rotate(90deg); }

  /* ---------- page chrome ---------- */
  .top { flex-shrink: 0; border-bottom: 1px solid var(--border-soft); padding: 8px 16px; display: flex; flex-direction: column; gap: 8px; }
  .top .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .top .title { font-size: 14px; font-weight: 600; margin-right: 4px; }
  .seg { display: inline-flex; background: var(--fill-neutral); border-radius: 8px; padding: 2px; gap: 2px; flex-wrap: wrap; }
  .seg button, .btn {
    border: 0; background: transparent; color: var(--fg-2); font: inherit; font-size: 13px;
    padding: 4px 10px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
  }
  .seg button:hover, .btn:hover { color: var(--fg); }
  .seg button.on { background: var(--surface-3); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .btn { background: var(--fill-neutral); }
  .btn.on { color: var(--fg); background: var(--surface-3); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .btn.primary { background: var(--primary); color: #fff; }
  .btn.primary:hover { color: #fff; filter: brightness(1.05); }
  select { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface-3); border: 1px solid var(--border-soft); border-radius: 6px; padding: 3px 6px; }
  .cmp { color: var(--fg-2); display: inline-flex; gap: 6px; align-items: center; }
  #scrub { flex: 1; min-width: 160px; accent-color: var(--primary); }
  .time { font-family: var(--mono); font-size: 12px; color: var(--fg-2); white-space: nowrap; }
  .main { flex: 1; display: flex; min-height: 0; }
  .stage { flex: 1; display: flex; gap: 12px; padding: 12px; min-width: 0; justify-content: center; }
  .notes { width: 360px; flex-shrink: 0; border-left: 1px solid var(--border-soft); overflow-y: auto; padding: 14px 18px 40px; font-size: 13px; color: var(--fg-2); }
  .notes[hidden] { display: none; }
  .notes h2 { font-size: 14px; color: var(--fg); margin: 0 0 6px; }
  .notes h3 { font-size: 13px; color: var(--fg); margin: 16px 0 6px; }
  .notes ul { padding-left: 18px; margin: 6px 0; }
  .notes li { margin: 4px 0; }
  .notes .pick { color: var(--primary); font-weight: 600; }
  .notes hr { border: 0; border-top: 1px solid var(--border-soft); margin: 16px 0; }

  /* ---------- pane ---------- */
  .pane {
    flex: 1 1 0; max-width: 760px; min-width: 330px; display: flex; flex-direction: column; position: relative;
    background: var(--surface-1); border: 1px solid var(--border-soft); border-radius: 12px; overflow: hidden;
  }
  .pane-head { height: 32px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border-soft); font-size: 12px; color: var(--fg-2); }
  .pane-head b { color: var(--fg); font-weight: 600; }
  .pane-head .st { margin-left: auto; color: var(--fg-3); }
  .vp { flex: 1; overflow-y: auto; min-height: 0; }
  .content { padding: 18px 24px 28px; }
  .turn + .turn { margin-top: 28px; }
  .jump {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 64px; z-index: 3;
    border: 1px solid var(--border-soft); background: var(--surface-3); color: var(--fg-2); border-radius: 999px;
    font: inherit; font-size: 12px; padding: 3px 10px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.08);
  }
  .jump[hidden] { display: none; }
  .composer-wrap { flex-shrink: 0; padding: 0 16px 10px; }
  .composer {
    height: 38px; border: 1px solid var(--border-soft); background: var(--surface-3); border-radius: 12px;
    display: flex; align-items: center; gap: 10px; padding: 0 8px 0 12px; color: var(--fg-3);
  }
  .composer .send { margin-left: auto; width: 24px; height: 24px; border-radius: 6px; background: color-mix(in oklab, var(--primary) 55%, var(--surface-3)); }
  .composer-meta { display: flex; gap: 14px; font-size: 12px; color: var(--fg-3); padding: 6px 4px 0; }
  .user { display: flex; justify-content: flex-end; margin-bottom: 18px; }
  .user > div { background: var(--fill-neutral); border-radius: 18px; padding: 10px 16px; max-width: 80%; }
  .tbl { margin-top: 8px; }
  .tbl p { margin: 8px 0; }
  .tbl table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 6px 0; }
  .tbl td, .tbl th { border-bottom: 1px solid var(--border-soft); padding: 5px 8px; text-align: left; vertical-align: top; }
  .tbl th { color: var(--fg-2); font-weight: 500; }
  .caret { display: inline-block; width: 7px; height: 13px; background: var(--fg-3); vertical-align: -2px; margin-left: 1px; animation: blink 1s steps(1) infinite; }
  .hl { background: color-mix(in oklab, var(--primary) 14%, transparent); border-radius: 6px; }

  /* ---------- 现状 ---------- */
  .vn .head { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--fg-3); padding: 2px 6px; margin: 0 -6px 2px; border-radius: 6px; }
  .vn .head.clickable:hover { background: var(--hover); }
  .vn .say { margin: 10px 0 6px; }
  .vn .t { font-size: 12px; color: var(--fg-3); display: flex; gap: 6px; align-items: center; margin-top: 5px; min-width: 0; }
  .vn .t .verb { color: var(--fg-2); flex-shrink: 0; }
  .vn .t .d { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vn .t .d.mono { font-family: var(--mono); }
  .vn .t2 { font-size: 11.5px; color: var(--fg-2); padding-left: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vn .t2::before { content: "└ "; color: var(--fg-3); }
  .vn .t2.err { color: var(--destructive); }
  .vn .divider { display: flex; align-items: center; gap: 8px; color: var(--fg-3); font-size: 12px; margin: 12px 0 8px; }
  .vn .divider::after { content: ""; flex: 1; border-top: 1px solid var(--border-soft); }
  .vn .end { font-size: 12px; color: var(--fg-3); margin-top: 10px; }

  /* ---------- ① 终端原味 ---------- */
  .v1 { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; }
  .v1 code { background: none; padding: 0; font-size: inherit; color: var(--code-fg); }
  .v1 .u { background: var(--fill-neutral); color: var(--fg-2); padding: 2px 10px; margin: 0 -10px 4px; white-space: pre-wrap; }
  .v1 .blk { display: flex; margin-top: 1.6em; }
  .v1 .dot { width: 2ch; flex-shrink: 0; }
  .v1 .dot.text { color: var(--fg); }
  .v1 .dot.ok { color: var(--success); }
  .v1 .dot.err, .v1 .dot.warn { color: var(--destructive); }
  .v1 .dot.run { color: var(--fg-3); animation: blink 1.2s steps(1) infinite; }
  .v1 .body { min-width: 0; flex: 1; white-space: pre-wrap; word-break: break-word; }
  .v1 .body.clickable:hover { background: var(--hover); }
  .v1 .res { display: flex; color: var(--fg-3); }
  .v1 .res .elb { white-space: pre; flex-shrink: 0; }
  .v1 .res .lines { min-width: 0; flex: 1; white-space: pre-wrap; word-break: break-all; }
  .v1 .res .lines .e { color: var(--destructive); }
  .v1 .more { cursor: pointer; }
  .v1 .more:hover { color: var(--fg-2); }
  .v1 .live { margin-top: 1.6em; color: var(--primary); }
  .v1 .live .dim, .v1 .doneline { color: var(--fg-3); }
  .v1 .doneline { margin-top: 1.6em; }
  .v1 .tbl table { font-family: var(--mono); }

  /* ---------- ② 终端结构 · 界面字体 (also ⑤ and ④'s log) ---------- */
  /* Dots, colours, block spacing and inline code follow ① (user ruling 2026-11-03). */
  .v2 code { background: none; padding: 0; font-size: 12.5px; color: var(--code-fg); }
  .v2 .blk { display: flex; margin-top: 20px; align-items: flex-start; border-radius: 6px; }
  .v2 .blk:first-child { margin-top: 0; }
  .v2 .dot { width: 16px; flex-shrink: 0; font-family: var(--mono); font-size: 12.5px; line-height: 18.6px; color: var(--fg-3); }
  .v2 .dot::before { content: "●"; }
  .v2 .dot.text { color: var(--fg); }
  .v2 .dot.ok { color: var(--success); }
  .v2 .dot.err { color: var(--destructive); }
  .v2 .dot.run { color: var(--fg-3); animation: blink 1.2s steps(1) infinite; }
  .v2 .body { min-width: 0; flex: 1; }
  .v2 .tl { display: flex; gap: 6px; min-width: 0; align-items: baseline; }
  .v2 .tl.clickable:hover .arg { color: var(--fg); }
  .v2 .name { font-weight: 600; color: var(--fg); flex-shrink: 0; }
  .v2 .arg { color: var(--fg-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .v2 .arg.mono { font-family: var(--mono); font-size: 12px; }
  .v2 .tl .tail { flex-shrink: 0; font-size: 12px; color: var(--fg-3); }
  .v2 .res { display: flex; gap: 6px; margin-top: 2px; font-family: var(--mono); font-size: 12px; line-height: 17px; color: var(--fg-3); }
  .v2 .res .elb { flex-shrink: 0; font-family: system-ui, sans-serif; }
  .v2 .res .lines { min-width: 0; flex: 1; }
  .v2 .res .ln { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .v2 .res .ln.e { color: var(--destructive); }
  .v2 .res .ln.w { color: var(--destructive); font-family: system-ui, sans-serif; }
  .v2 .res .exp { white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow: auto; }
  .v2 .more { cursor: pointer; }
  .v2 .more:hover { color: var(--fg-2); text-decoration: underline; }
  .v2 .live { margin-top: 14px; display: flex; gap: 8px; align-items: center; color: var(--primary); }
  .v2 .live .dim { color: var(--fg-3); }
  .v2 .end { margin-top: 14px; color: var(--fg-3); font-size: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .star { display: inline-block; width: 1.1em; text-align: center; }

  /* step strip (⑤) */
  .strip { display: inline-flex; flex-wrap: wrap; gap: 3px; align-items: center; }
  .sq { width: 9px; height: 9px; border-radius: 2px; background: var(--fg-3); cursor: pointer; display: inline-block; }
  .sq:hover { outline: 2px solid var(--border-strong); outline-offset: 1px; }
  .sq.ok { background: var(--success); }
  .sq.warn { background: var(--warning); }
  .sq.err { background: var(--destructive); }
  .sq.bg { background: var(--info); }
  .sq.run { animation: blink 1.2s steps(1) infinite; }
  .dock { margin: 0 16px 8px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface-2); padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
  .dock .r1 { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .dock .r1 .what { min-width: 0; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--fg-2); }
  .dock .r1 .what b { color: var(--fg); font-weight: 600; margin-right: 4px; }
  .dock .r1 .right { flex-shrink: 0; color: var(--fg-3); font-size: 12px; }
  .dock .said { font-size: 12px; color: var(--fg-2); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; border-top: 1px solid var(--border-soft); padding-top: 6px; }
  .dock .said b { font-weight: 500; color: var(--fg-3); margin-right: 6px; }
  .dock .v2dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--fg-3); animation: blink 1.2s steps(1) infinite; }

  /* ---------- ③ 桌面版式 ---------- */
  .v3 .say { margin-top: 14px; }
  .v3 .say:first-child { margin-top: 0; }
  .v3 .grp { margin-top: 10px; display: flex; align-items: center; gap: 6px; color: var(--fg-2); padding: 2px 6px; margin-left: -6px; border-radius: 6px; width: fit-content; max-width: calc(100% + 6px); }
  .v3 .grp:hover { background: var(--hover); }
  .v3 .grp .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .v3 .grp .lbl .verb { color: var(--fg-2); }
  .v3 .grp .lbl .d { color: var(--fg-3); }
  .v3 .shimmer { background: linear-gradient(90deg, var(--fg-3) 0%, var(--fg) 45%, var(--fg-3) 90%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.8s linear infinite; }
  .v3 .rows { margin: 2px 0 0 4px; border-left: 1px solid var(--border-soft); padding-left: 12px; }
  .v3 .row { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--fg-3); padding: 2px 4px; margin-left: -4px; border-radius: 6px; min-width: 0; }
  .v3 .row:hover { background: var(--hover); }
  .v3 .row .d { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .v3 .row .verb { color: var(--fg-2); flex-shrink: 0; }
  .v3 .pre { font-family: var(--mono); font-size: 11.5px; color: var(--fg-3); white-space: pre-wrap; word-break: break-all; margin: 2px 0 6px 20px; }
  .v3 .live { margin-top: 12px; display: flex; gap: 8px; align-items: center; color: var(--primary); }

  /* ---------- ④ 进展卡 ---------- */
  .v4 .card { border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface-2); }
  .v4.card { border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface-2); }
  .v4.card .h { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 12px; color: var(--fg-2); border-bottom: 1px solid var(--border-soft); }
  .v4.card .h .r { margin-left: auto; color: var(--fg-3); }
  .v4.card .b { padding: 10px 12px; }
  .v4 .now { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .v4 .now .d { color: var(--fg); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .v4 .latest { color: var(--fg-2); margin: 6px 0 0 22px; }
  .v4 .recent { margin-top: 10px; border-top: 1px solid var(--border-soft); padding-top: 8px; }
  .v4 .recent .row { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--fg-3); padding: 2px 0; min-width: 0; }
  .v4 .recent .row .d { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .v4 .more, .summary { font-size: 12px; color: var(--fg-2); display: inline-flex; gap: 6px; align-items: center; padding: 2px 6px; margin-left: -6px; border-radius: 6px; }
  .v4 .more { margin-top: 6px; }
  .v4 .more:hover, .summary:hover { background: var(--hover); }
  .log4 { margin: 10px 0 4px; padding-left: 12px; border-left: 1px solid var(--border-soft); }
  .final4 { margin-top: 12px; }
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <span class="title">对话区回放 · 第二版</span>
    <div class="seg" id="vSeg"></div>
    <label class="cmp">对照 <select id="cmpSel"></select></label>
    <div class="seg" id="themeSeg"><button data-theme="light" class="on">亮</button><button data-theme="dark">暗</button></div>
    <button class="btn" id="notesBtn">说明</button>
  </div>
  <div class="row">
    <button class="btn primary" id="playBtn"></button>
    <button class="btn" id="restartBtn">从头播</button>
    <button class="btn" id="endBtn">跳到结束</button>
    <div class="seg" id="speedSeg"><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button></div>
    <input type="range" id="scrub" min="0" step="10" value="0" />
    <span class="time" id="timeLbl"></span>
  </div>
</header>
<div class="main">
  <div class="stage" id="stage"></div>
  <aside class="notes" id="notes"></aside>
</div>

<script>
// ---------------------------------------------------------------- sample data
// Rewritten from the 2026-11-03 field screenshots (branch cleanup session).
// Two reads and one search were added so the grouping rules have something to show.
const TIME_SCALE = 6;   // shown seconds per playback second at 1x
const CHAR_MS = 26;     // streaming speed at 1x
const GAP = 220;

const say = (text) => ({ k: 'say', text });
const tool = (kind, desc, o = {}) => ({ k: 'tool', kind, desc, run: 1400, status: 'ok', out: [], total: 0, ...o });
const fin = (text, table) => ({ k: 'final', text, table });
const DENY = { status: 'denied', reason: '安全审查服务出错', run: 1100 };

const TABLE1 = `
<p><b>分支全景（8 个本地分支，3 类来源）</b></p>
<table>
<tr><th>分支</th><th>状态</th><th>结论</th></tr>
<tr><td><code>main</code></td><td>刚更新到 1.2.0（<code>47409075</code>）</td><td>保留</td></tr>
<tr><td><code>code-snapshot</code></td><td>当前所在分支，跟踪 <code>gitlab/code-snapshot</code></td><td>保留</td></tr>
<tr><td><code>feat/dsh-p0-probe</code> 等 3 个</td><td>已合入 main，各挂着一个临时 worktree</td><td>可清理</td></tr>
<tr><td><code>main-clean</code> 等 3 个</td><td>快照实验分支，内容已在 gitlab 远程或 main 里</td><td>可清理</td></tr>
</table>
<p>共 6 个分支、3 个临时 worktree 可以清理。要我执行吗？</p>`;

const TABLE2 = `
<p><b>清理结果</b></p>
<table>
<tr><th>项目</th><th>结果</th></tr>
<tr><td>6 个本地分支</td><td><span class="ok">已删除</span></td></tr>
<tr><td>3 个 worktree 注册</td><td><span class="ok">已移除</span></td></tr>
<tr><td>p0-probe 调查材料</td><td><span class="ok">已备份</span>（51/51 文件）</td></tr>
<tr><td>2 个残留目录</td><td><span class="err">未删</span>：审查服务拦截，请手动删除</td></tr>
</table>`;

const TURNS = [
  {
    key: 't1', history: true, real: 100, endedAt: '17:01',
    user: '本地怎么这么多分支，有哪些是可以清理的？',
    events: [

/** What a turn looks like at playback time `t` (history turns are always finished). */
function stateOf(turn, t) {
  if (turn.history) t = Infinity;
  const running = t < turn.total;
  const blocks = [];
  for (const e of turn.evs) {
    if (e.start > t) break;
    if (e.k === 'tool') {
      const done = t >= e.end;
      blocks.push({
        type: 'tool', id: e.id, kind: e.kind, desc: e.desc, cmd: e.cmd, out: e.out, total: e.total,
        head: e.head ?? e.out[0], reason: e.reason, status: done ? e.status : 'running',
        elapsed: ((Math.min(t, e.end) - e.start) / 1000) * TIME_SCALE,
      });
    } else {
      const chars = [...e.text];
      const n = t >= e.end ? chars.length : Math.max(0, Math.floor((t - e.start) / CHAR_MS));
      blocks.push({
        type: 'say', id: e.id, text: chars.slice(0, n).join(''), streaming: t < e.end,
        isFinal: e.k === 'final' && !running, table: e.k === 'final' && t >= e.end ? e.table : '',
      });
    }
  }
  const tools = blocks.filter((b) => b.type === 'tool');
  return {
    key: turn.key, user: turn.user, blocks, running, endedAt: turn.endedAt, history: turn.history,
    elapsed: turn.history ? turn.real : (Math.min(t, turn.total) / 1000) * TIME_SCALE,
    calls: tools.length,
    denied: tools.filter((b) => b.status === 'denied').length,
    failed: tools.filter((b) => b.status === 'error').length,
  };

    h += `<div class="end">${STAR[4]} ${bits.join(' · ')}${opts.strip ? stripOf(s) : ''}</div>`;
  }
  return h;
}
function log2(blocks, ctx) {
  let h = '';
  for (const b of groupReads(blocks)) {
    if (b.type === 'say') {
      h += `<div class="blk" data-bid="${b.id}"><span class="dot text"></span><div class="body">${md(b.text)}${caret(b)}${finalTable(b)}</div></div>`;
    } else if (b.type === 'rgroup') {
      const running = b.items.some((x) => x.status === 'running');
      const key = `g-${b.id}`;
      const open = ctx.open(key);
      h += `<div class="blk" data-bid="${bidOf(b)}"><span class="dot ${running ? 'run' : 'ok'}"></span><div class="body">`
        + `<div class="tl clickable" data-toggle="${key}"><span class="name">${readGroupLabel(b.items, running)}</span><span class="tail">${open ? '收起' : '展开'}</span></div>`;
      if (open) {
        h += `<div class="res"><span class="elb">⎿</span><div class="lines">${b.items.map((x) =>
          `<div class="ln">${VERB[x.kind]} ${esc(x.desc)} · ${x.kind === 'read' ? `${x.total} 行` : esc(x.out[0] || '')}</div>`).join('')}</div></div>`;
      }
      h += '</div></div>';
    } else {
      h += tool2(b, ctx);
    }
  }
  return h;
}
function tool2(b, ctx) {
  const dot = { running: 'run', ok: 'ok', denied: 'err', error: 'err', bg: 'ok' }[b.status];
  const key = `o-${b.id}`;
  const open = ctx.open(key);
  const canOpen = b.out.length > 0 && b.status !== 'running' && b.status !== 'denied' && b.kind !== 'read';
  let lines;
  if (b.status === 'running') lines = `<div class="ln">运行中…${b.elapsed >= 3 ? ` ${durShort(b.elapsed)}` : ''}</div>`;
  else if (b.status === 'denied') lines = `<div class="ln w">已拒绝 · ${esc(b.reason)}</div>`;
  else if (b.status === 'bg') lines = '<div class="ln">已转入后台 · pwsh-18</div>';
  else if (b.kind === 'read') lines = `<div class="ln">读取了 ${b.total} 行</div>`;
  else if (open) {
    lines = `<div class="exp">${[...(b.cmd ? [`$ ${b.cmd}`] : []), ...b.out].map(esc).join('\n')}${b.total > b.out.length ? `\n…（示意稿只录了 ${b.out.length} 行）` : ''}</div>`
      + `<div class="ln"><span class="more" data-toggle="${key}">收起</span></div>`;
  } else {
    const shown = b.status === 'error' ? b.out.slice(-2) : b.out.slice(0, 2);
    lines = shown.map((l) => `<div class="ln ${/error|exit code/i.test(l) ? 'e' : ''}">${esc(l)}</div>`).join('');
    const rest = Math.max(b.total, b.out.length) - shown.length;
    if (rest > 0) lines += `<div class="ln"><span class="more" data-toggle="${key}">… +${rest} 行</span></div>`;
  }
  const arg = b.kind === 'read' || b.kind === 'bg' ? 'mono' : '';
  return `<div class="blk" data-bid="${b.id}"><span class="dot ${dot}"></span><div class="body">`
    + `<div class="tl ${canOpen ? 'clickable' : ''}" ${canOpen ? `data-toggle="${key}"` : ''}><span class="name">${VERB[b.kind]}</span><span class="arg ${arg}">${esc(b.desc)}</span></div>`
    + `<div class="res"><span class="elb">⎿</span><div class="lines">${lines}</div></div></div></div>`;
}

// ---------------------------------------------------------------- ③ 桌面版式
function r3(s, ctx) {
  let h = userBubble(s);
  for (const b of groupAll(s.blocks)) {
    if (b.type === 'say') { h += `<div class="say" data-bid="${b.id}">${md(b.text)}${caret(b)}${finalTable(b)}</div>`; continue; }
    const key = `g-${b.id}`;
    const open = ctx.open(key);
    const cur = b.items.find((x) => x.status === 'running');
    let label;
    if (cur) label = `<span class="shimmer">${VERB[cur.kind]} ${esc(cur.desc)}</span>`;
    else if (b.items.length === 1) label = `<span class="verb">${VERB[b.items[0].kind]}</span> <span class="d">${esc(b.items[0].desc)}</span>`;
    else label = `<span class="verb">${deskSummary(b.items)}</span>`;
    const denied = b.items.filter((x) => x.status === 'denied').length;
    const failed = b.items.filter((x) => x.status === 'error').length;
    let tail = '';
    if (denied) tail += ` <span class="warn">${b.items.length === 1 ? '已拒绝' : `${denied} 条被拒`}</span>`;
    if (failed) tail += ' <span class="err">失败</span>';
    h += `<div class="grp clickable ${open ? 'open' : ''}" data-toggle="${key}" data-bid="${bidOf(b)}"><span class="lbl">${label}</span>${tail}${svg('chev', 'chev own')}</div>`;
    if (open) {
      h += '<div class="rows">';
      for (const x of b.items) {
        const okey = `o-${x.id}`;
        const icon = x.status === 'running' ? svg('spin', 'spin') : x.status === 'denied' ? `<span class="warn">${svg('ban')}</span>` : x.status === 'error' ? `<span class="err">${svg('x')}</span>` : svg(x.kind);
        h += `<div class="row clickable" data-toggle="${okey}">${icon}<span class="verb">${VERB[x.kind]}</span><span class="d">${esc(x.desc)}</span></div>`;
        if (ctx.open(okey)) {
          const text = x.status === 'denied' ? `已拒绝：${x.reason}` : x.kind === 'read' ? `读取了 ${x.total} 行` : [...(x.cmd ? [`$ ${x.cmd}`] : []), ...x.out].join('\n');
          h += `<div class="pre">${esc(text)}</div>`;
        }
      }
      h += '</div>';
    }
  }
  if (s.running) h += `<div class="live">${star()}<span class="shimmer">${esc(activity(s).text)}</span></div>`;
  return h;
}
function deskSummary(items) {
  const n = (k) => items.filter((x) => x.kind === k).length;
  const parts = [];
  if (n('term')) parts.push(`运行了 ${n('term')} 条命令`);
  if (n('read')) parts.push(`读取了 ${n('read')} 个文件`);
  if (n('search')) parts.push(`搜索了 ${n('search')} 次`);
  if (n('bg')) parts.push(`查看了 ${n('bg')} 次后台输出`);
  return parts.join('，');
}

// ---------------------------------------------------------------- ④ 进展卡（上一版 D）
function r4(s, ctx) {
  let h = userBubble(s);
  const tools = s.blocks.filter((b) => b.type === 'tool');
  const key = `log-${s.key}`;
  const open = ctx.open(key);
  if (s.running) {
    const said = lastSay(s);
    const a = activity(s);
    h += `<div class="v4 card"><div class="h">${svg('spin', 'spin')}<span>正在处理</span><span class="r num">第 ${tools.length} 步 · 已用 ${clockOf(s.elapsed)} · ${s.denied} 次被拒</span></div><div class="b">`;
    if (a.tool) h += `<div class="now">${svg(a.kind)}<span class="soft">${VERB[a.kind]}</span><span class="d">${esc(a.text)}</span></div>`;
    else h += `<div class="now"><span class="faint">${esc(a.text)}…</span></div>`;
    if (said) h += `<div class="latest">${md(said.text)}${caret(said)}</div>`;
    const recent = tools.filter((b) => b !== a.tool).slice(-4).reverse();
    if (recent.length) {
      h += '<div class="recent">';
      for (const b of recent) {
        const icon = b.status === 'denied' ? `<span class="warn">${svg('ban')}</span>` : b.status === 'error' ? `<span class="err">${svg('x')}</span>` : svg(b.kind);
        h += `<div class="row">${icon}<span class="d">${esc(b.desc)}</span>${b.status === 'denied' ? '<span class="warn">已拒绝</span>' : ''}</div>`;
      }
      h += '</div>';
    }
    h += `<div class="more clickable" data-toggle="${key}">${svg('list')}${open ? '收起记录' : `查看全部 ${tools.length} 步`}</div></div></div>`;
    if (open) h += `<div class="log4 v2">${log2(s.blocks, ctx)}</div>`;
  } else {
    const fin = s.blocks.find((b) => b.isFinal);
    const bits = [`处理了 ${tools.length} 步`, `用时 ${dur(s.elapsed)}`];
    if (s.denied) bits.push(`${s.denied} 次被拒`);
    if (s.failed) bits.push(`${s.failed} 次失败`);
    h += `<div class="summary clickable ${open ? 'open' : ''}" data-toggle="${key}">${svg('chev', 'chev')}${bits.join(' · ')}</div>`;
    if (open) h += `<div class="log4 v2">${log2(s.blocks.filter((b) => !b.isFinal), ctx)}</div>`;
    if (fin) h += `<div class="final4" data-bid="${fin.id}">${md(fin.text)}${finalTable(fin)}</div>`;
  }
  return h;
}

// ---------------------------------------------------------------- ⑤ 终端结构 + 实时条
function r5(s, ctx) { return r2(s, ctx, { live: false, strip: true }); }
function dock5(s, ctx) {
  if (!s.running) return '';
  const a = activity(s);
  const said = lastSay(s);
  const what = a.tool
    ? `<b>${VERB[a.kind]}</b>${esc(a.text)} <span class="faint num">· ${durShort(a.tool.elapsed)}</span>`
    : `<span>${esc(a.text)}…</span>`;
  let h = `<div class="dock"><div class="r1"><span class="v2dot"></span><span class="what">${what}</span><span class="right num">第 ${s.calls} 步 · ${clockOf(s.elapsed)}${s.denied ? ` · <span class="err">${s.denied} 次被拒</span>` : ''}</span></div>`;

  if (!ctx.follow && said) h += `<div class="said"><b>刚才说</b>${esc(said.text.replace(/[`*]/g, ''))}</div>`;
  return h + '</div>';

// ---------------------------------------------------------------- player
const clock = { t: 0, playing: true, speed: 1, last: performance.now() };
const expanded = new Set();
let variant = 'term';
let compare = 'none';
let panes = [];

function buildPanes() {
  const stage = document.getElementById('stage');
  const keys = compare !== 'none' && compare !== variant ? [compare, variant] : [variant];
  stage.innerHTML = '';
  panes = keys.map((v) => {
    const root = document.createElement('div');
    root.className = 'pane';
    root.innerHTML = `<div class="pane-head"><b>${VARIANTS[v].name}</b><span class="st"></span></div>
      <div class="vp"><div class="content"></div></div>
      <button class="jump" hidden>↓ 回到最新</button>
      <div class="dockwrap"></div>
      <div class="composer-wrap"><div class="composer"><span>+</span><span>继续输入…</span><span class="send"></span></div>
      <div class="composer-meta"><span>全自动</span><span>ai-client</span><span>code-snapshot</span><span style="margin-left:auto">glm-5.3 高</span></div></div>`;
    stage.appendChild(root);
    const p = {
      variant: v, root, follow: true, hl: null,
      vp: root.querySelector('.vp'), content: root.querySelector('.content'),
      dock: root.querySelector('.dockwrap'), jump: root.querySelector('.jump'), st: root.querySelector('.st'),
    };
    p.vp.addEventListener('scroll', () => {
      p.follow = p.vp.scrollTop + p.vp.clientHeight >= p.vp.scrollHeight - 24;
      p.jump.hidden = p.follow;
    });
    p.jump.addEventListener('click', () => { p.follow = true; render(true); });
    root.addEventListener('pointerdown', (e) => {
      const j = e.target.closest('[data-jump]');
      if (j) { e.preventDefault(); jumpTo(p, j.dataset.jump); return; }
      const tg = e.target.closest('[data-toggle]');
      if (tg) {
        e.preventDefault();
        const k = `${p.variant}:${tg.dataset.toggle}`;
        expanded.has(k) ? expanded.delete(k) : expanded.add(k);
        if (!p.follow) p.keepTop = p.vp.scrollTop;
        render(true);
      }
    });
    return p;
  });
  document.getElementById('notes').innerHTML = NOTES_TOP + NOTES[variant];
  render(true);
}

function jumpTo(p, id) {
  p.follow = false;
  p.hl = { id, until: performance.now() + 1600 };
  render(true);
  const el = p.vp.querySelector(`[data-bid~="${id}"]`);
  if (el) el.scrollIntoView({ block: 'center' });
}

function renderPane(p, states) {
  const v = VARIANTS[p.variant];
  const ctx = { open: (k) => expanded.has(`${p.variant}:${k}`), follow: p.follow };
  p.content.className = `content ${v.cls}`;
  p.content.innerHTML = states.map((s) => `<section class="turn">${v.render(s, ctx)}</section>`).join('');
  p.dock.innerHTML = v.dock ? v.dock(states[1], ctx) : '';
  if (p.hl && performance.now() < p.hl.until) {
    const el = p.content.querySelector(`[data-bid~="${p.hl.id}"]`);
    if (el) el.classList.add('hl');
  }
  if (p.follow) p.vp.scrollTop = p.vp.scrollHeight;
  else if (p.keepTop !== undefined) { p.vp.scrollTop = p.keepTop; p.keepTop = undefined; }
  p.jump.hidden = p.follow;
  // Sit above whatever is docked over the composer.
  p.jump.style.bottom = `${p.root.querySelector('.composer-wrap').offsetHeight + p.dock.offsetHeight + 8}px`;
  const s = states[1];
  p.st.textContent = s.running ? `运行中 · 第 ${s.calls} 步 · ${clockOf(s.elapsed)}` : `已结束 · ${s.calls} 次调用 · ${clockOf(s.elapsed)}`;
}

let lastRender = 0;
function render(force) {
  const now = performance.now();
  if (!force && now - lastRender < 90) return;
  lastRender = now;
  const states = TURNS.map((tr) => stateOf(tr, clock.t));
  for (const p of panes) renderPane(p, states);
  document.getElementById('scrub').value = String(Math.round(clock.t));
  const shown = (Math.min(clock.t, TURNS[1].total) / 1000) * TIME_SCALE;
  document.getElementById('timeLbl').textContent =
    `${clockOf(clock.t / 1000)} / ${clockOf(TOTAL / 1000)}　（这一轮 ${clockOf(shown)}）`;
  document.getElementById('playBtn').innerHTML = clock.playing ? `${svg('pause')}暂停` : `${svg('play')}${clock.t >= TOTAL ? '重播' : '播放'}`;
}

function tick(now) {
  if (clock.playing) {
    clock.t = Math.min(TOTAL, clock.t + (now - clock.last) * clock.speed);
    if (clock.t >= TOTAL) { clock.playing = false; render(true); } else render(false);
  } else if (now - lastRender > 120) {
    // Keep the CLI spinner glyphs turning while paused without rebuilding the DOM.
    document.querySelectorAll('.star').forEach((el) => { el.textContent = STAR[Math.floor(now / 120) % STAR.length]; });
  }
  clock.last = now;
  requestAnimationFrame(tick);
}

// ---------------------------------------------------------------- controls
const vSeg = document.getElementById('vSeg');
vSeg.innerHTML = Object.entries(VARIANTS).map(([k, v]) => `<button data-v="${k}" class="${k === variant ? 'on' : ''}">${v.name}</button>`).join('');
vSeg.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  variant = b.dataset.v;
  vSeg.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
  buildPanes();
});
const cmpSel = document.getElementById('cmpSel');
cmpSel.innerHTML = '<option value="none">不对照</option>' + Object.entries(VARIANTS).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join('');
cmpSel.addEventListener('change', () => { compare = cmpSel.value; buildPanes(); });
document.getElementById('themeSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.documentElement.classList.toggle('dark', b.dataset.theme === 'dark');
  document.querySelectorAll('#themeSeg button').forEach((x) => x.classList.toggle('on', x === b));
});
const notesEl = document.getElementById('notes');
const notesBtn = document.getElementById('notesBtn');
notesEl.hidden = window.innerWidth < 1180;
notesBtn.classList.toggle('on', !notesEl.hidden);
notesBtn.addEventListener('click', () => { notesEl.hidden = !notesEl.hidden; notesBtn.classList.toggle('on', !notesEl.hidden); });
document.getElementById('playBtn').addEventListener('click', () => {
  if (clock.t >= TOTAL) { clock.t = 0; panes.forEach((p) => { p.follow = true; }); }
  clock.playing = !clock.playing;
  render(true);
});
document.getElementById('restartBtn').addEventListener('click', () => {
  clock.t = 0; clock.playing = true; panes.forEach((p) => { p.follow = true; }); render(true);
});
document.getElementById('endBtn').addEventListener('click', () => { clock.t = TOTAL; clock.playing = false; render(true); });
document.getElementById('speedSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  clock.speed = Number(b.dataset.s);
  document.querySelectorAll('#speedSeg button').forEach((x) => x.classList.toggle('on', x === b));
});
const scrub = document.getElementById('scrub');
scrub.max = String(TOTAL);
scrub.addEventListener('input', () => { clock.t = Number(scrub.value); clock.playing = false; render(true); });

buildPanes();
requestAnimationFrame(tick);
</script>
</body>
</html>
