appId: com.aiclient.app
productName: AiClient
copyright: Copyright © 2025

directories:
  output: dist
  buildResources: build

files:
  - "out/**/*"
  - "node_modules/**/*"
  - "!node_modules/**/README.md"
  - "!node_modules/**/CHANGELOG.md"
  - "!node_modules/**/LICENSE*"
  - "!node_modules/**/*.md"
  - "!node_modules/**/*.ts"
  - "!node_modules/**/*.map"
  - "!node_modules/**/test/**"
  - "!node_modules/**/tests/**"
  - "!node_modules/**/__tests__/**"
  - "!node_modules/**/docs/**"
  - "!node_modules/**/example/**"
  - "!node_modules/**/examples/**"
  # Exclude build tools that shouldn't be in production
  - "!node_modules/lightningcss-*/**"
  - "!node_modules/@tailwindcss/**"
  - "!node_modules/tailwindcss/**"
  - "!node_modules/jiti/**"
  # Exclude native module build artifacts (source not needed at runtime)
  - "!node_modules/node-pty/src/**"
  - "!node_modules/node-pty/deps/**"
  # Exclude lucide-react source maps and types
  - "!node_modules/lucide-react/dist/*.mjs.map"
  - "!node_modules/lucide-react/dist/*.d.ts"
  - "!node_modules/lucide-react/dist/*.d.mts"
  # Exclude lucide-react unused formats (keep esm only)
  - "!node_modules/lucide-react/dist/cjs/**"
  - "!node_modules/lucide-react/dist/umd/**"
  # Exclude monaco-editor dev and min versions (keep esm only, saves ~42MB)
  - "!node_modules/monaco-editor/dev/**"
  - "!node_modules/monaco-editor/min/**"
  # Exclude shiki unused themes and languages
  - "!node_modules/shiki/dist/langs/**"
  - "!node_modules/shiki/dist/themes/**"
  - "!node_modules/@shikijs/langs/**"
  - "!node_modules/@shikijs/themes/**"
  # Exclude the Agent SDK's bundled CLI binaries from the root asar. Both agent
  # CLIs (Claude and Codex) are shipped inside resources/agent-host by
  # scripts/afterPack.mjs instead, so the root bundle carries no agent CLI at
  # all. Do NOT add exclusions for agent CLI packages that are not root
  # dependencies — a rule that can never match reads as evidence that the
  # package IS a root dependency, which is how the previous Codex rule survived
  # for so long.
  # @anthropic-ai/claude-agent-sdk: ~68MB of CLI and WASM files
  - "!node_modules/@anthropic-ai/claude-agent-sdk/vendor/**"
  - "!node_modules/@anthropic-ai/claude-agent-sdk/cli.js"
  - "!node_modules/@anthropic-ai/claude-agent-sdk/*.wasm"
  # Cloudflared: ~38MB pre-downloaded binary (we download at runtime to userData/bin)
  - "!node_modules/cloudflared/bin/**"
  # Mermaid and its heavy dependencies (~60MB total) - loaded from CDN at runtime
  - "!node_modules/mermaid/**"
  - "!node_modules/@mermaid-js/**"
  - "!node_modules/cytoscape/**"
  - "!node_modules/cytoscape-*/**"
  - "!node_modules/@chevrotain/**"
  - "!node_modules/chevrotain/**"
  - "!node_modules/langium/**"
  - "!node_modules/katex/**"
  - "!node_modules/lodash-es/**"
  - "!node_modules/d3/**"
  - "!node_modules/d3-*/**"
  - "!node_modules/dagre-d3-es/**"
  - "!node_modules/elkjs/**"
  - "!node_modules/web-tree-sitter/**"
  - "!node_modules/khroma/**"
  - "!node_modules/dompurify/**"
  # PDF.js (~5MB) - loaded from CDN at runtime
  - "!node_modules/pdfjs-dist/**"
  - "!node_modules/react-pdf/**"

asar: true
asarUnpack:
  - "node_modules/@vscode/ripgrep/**"
  - "node_modules/sqlite3/**"
  - "node_modules/@parcel/watcher/**"
  - "node_modules/@parcel/watcher-win32-x64/**"
  - "node_modules/node-pty/**"
npmRebuild: false
extraResources:
  - from: node_modules/node-pty
    to: node_modules/node-pty
    filter:
      - "package.json"
      - "lib/**/*"
      - "prebuilds/win32-x64/**/*"
  - from: node_modules/sqlite3
    to: node_modules/sqlite3
    filter:
      - "package.json"
      - "lib/**/*"
      - "build/Release/**/*"
  - from: node_modules/bindings
    to: node_modules/bindings
    filter:
      - "package.json"
      - "bindings.js"
  - from: node_modules/file-uri-to-path
    to: node_modules/file-uri-to-path
    filter:
      - "package.json"
      - "index.js"
  # Keep @parcel/watcher and its runtime dependencies in sync here.
  - from: node_modules/@parcel/watcher
    to: node_modules/@parcel/watcher
    filter:
      - "package.json"
      - "index.js"
      - "wrapper.js"
      - "build/Release/**/*"
  - from: node_modules/picomatch
    to: node_modules/picomatch
    filter:
      - "package.json"
      - "index.js"
      - "lib/**/*"
  - from: node_modules/is-glob
    to: node_modules/is-glob
    filter:
      - "package.json"
      - "index.js"
  - from: node_modules/is-extglob
    to: node_modules/is-extglob
    filter:
      - "package.json"
      - "index.js"
  - from: node_modules/ws
    to: node_modules/ws
    filter:
      - "package.json"
      - "index.js"
      - "lib/**/*"
  - from: node_modules/@vscode/ripgrep
    to: node_modules/@vscode/ripgrep
    filter:
      - "package.json"
      - "lib/index.js"
      - "bin/**/*"
  - from: node_modules/isbinaryfile
    to: node_modules/isbinaryfile
    filter:
      - "package.json"
      - "lib/**/*"
  - from: node_modules/cloudflared
    to: node_modules/cloudflared
    filter:
      - "package.json"
      - "lib/**/*"
  # NOTE: the Agent Host artifact (out-agent-host -> resources/agent-host) is
  # deliberately NOT an extraResources entry — electron-builder drops its
  # node_modules tree and the parallel copy races rcedit. It is copied by
  # scripts/afterPack.mjs instead (plain files, never asar: on TSD machines
  # only the whitelisted external node.exe can read them).
  # SIZE: that artifact now carries the bundled Codex CLI and its platform
  # package, taking it from ~51MB to ~388MB (measured linux-x64, 2026-08-20).
  # Moving it back under extraResources would therefore be expensive as well as
  # broken — the parallel copy would race rcedit over ~388MB.
compression: maximum

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  # Register aiclient:// URL scheme
  extendInfo:
    CFBundleURLTypes:
      - CFBundleURLName: AiClient
        CFBundleURLSchemes:
          - aiclient

dmg:
  sign: true
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  executableName: AiClient
  target:
    # NSIS supports delta updates automatically
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

portable:
  artifactName: ${productName}-${version}-portable.exe

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  # Enable differential download for NSIS
  differentialPackage: true
  # Register aiclient:// URL scheme
  include: build/installer.nsh

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  executableName: aiclient
  maintainer: baseOnEnso <admin@123.com>
  category: Development
  # Register aiclient:// URL scheme
  mimeTypes:
    - x-scheme-handler/aiclient

afterPack: scripts/afterPack.mjs

publish:
  provider: github
  owner: p1p1dan
  repo: ai-client
  releaseType: draft
