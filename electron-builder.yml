appId: com.aiclient.app
productName: PiLab Ai
copyright: Copyright © 2025

directories:
  output: dist
  buildResources: build

files:
  - "out/**/*"
  # Decision 200: node_modules ships only the packages Main loads at run time.
  # Main, preload and the renderer are bundled into out/, so every other
  # dependency is already there. electron-builder copies every production
  # dependency and applies only exclusions to node_modules, hence "exclude all
  # but": the patterns are scripts/runtime-packages.mjs `runtimeFilePatterns()`
  # (runtime-packages test); verify-packaged-app checks the archive and loads
  # each package.
  - "!node_modules/!(node-pty|sqlite3|@parcel|@vscode|isbinaryfile|bindings|file-uri-to-path|detect-libc|picomatch|is-glob|is-extglob){,/**}"
  - "!node_modules/@parcel/!(watcher|watcher-*){,/**}"
  - "!node_modules/@vscode/!(ripgrep){,/**}"
  - "!node_modules/**/README.md"
  - "!node_modules/**/CHANGELOG.md"
  - "!node_modules/**/LICENSE*"
  - "!node_modules/**/*.md"
  - "!node_modules/**/*.ts"
  - "!node_modules/**/*.map"
  - "!node_modules/**/test/**"
  - "!node_modules/**/tests/**"
  - "!node_modules/**/__tests__/**"
  - "!node_modules/**/docs/**"
  - "!node_modules/**/example/**"
  - "!node_modules/**/examples/**"
  # Exclude native module build artifacts (source not needed at runtime)
  - "!node_modules/node-pty/src/**"
  - "!node_modules/node-pty/deps/**"
  # Decision 200: native build leftovers that are never loaded — MSVC link and
  # debug files and logs, sources, Windows ARM64 builds, and @parcel/watcher's
  # own build (its platform package, e.g. @parcel/watcher-win32-x64, loads).
  - "!node_modules/**/*.{iobj,ipdb,obj,tlog,lastbuildstate,recipe,vcxproj,filters,lib,exp,ilk}"
  - "!node_modules/node-pty/build/{Release/obj,deps}/**"
  - "!node_modules/node-pty/prebuilds/win32-arm64/**"
  - "!node_modules/node-pty/third_party/conpty/*/win10-arm64/**"
  - "!node_modules/sqlite3/{deps,src}/**"
  - "!node_modules/@parcel/watcher/{build,src}/**"

asar: true
asarUnpack:
  - "node_modules/@vscode/ripgrep/**"
  - "node_modules/sqlite3/**"
  - "node_modules/@parcel/watcher/**"
  - "node_modules/@parcel/watcher-win32-x64/**"
  - "node_modules/node-pty/**"
npmRebuild: false
extraResources:
  # A3 — the offline model catalog baseline. Read with no network I/O at the
  # point the client would otherwise report `unavailable`; without it a first
  # launch, a weak network or a management endpoint that is down all leave an
  # empty model menu. Refreshed only by scripts/refresh-model-catalog.mjs before
  # a release is tagged; the running app never writes it (ADR 0134 §3).
  - from: resources/model-catalog/snapshot.json
    to: model-catalog/snapshot.json
  # Distributed legal notices are explicit resources because the application
  # allow-list excludes dependency Markdown and LICENSE files.
  - from: LICENSE
    to: licenses/LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  # Decision 200: no second copy of the native modules in resources/node_modules.
  # Main resolves them from app.asar (unpacked), so that copy was never loaded.
compression: maximum

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  # Keep the `-mac` suffix: the Build workflow uploads `dist/*-mac.zip`.
  artifactName: pilab-v${version}-${arch}-mac.${ext}
  # Register aiclient:// URL scheme
  extendInfo:
    CFBundleURLTypes:
      - CFBundleURLName: PiLab Ai
        CFBundleURLSchemes:
          - aiclient

dmg:
  sign: true
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  # No space, unlike `productName`: this is the file every shortcut, registry
  # entry and `installer.nsh` line spells out by hand.
  executableName: PiLabAi
  # Decision 200: Chromium's own UI strings in Chinese and English only.
  # zh-TW stays so a Traditional Chinese system keeps navigator.language on
  # `zh` (the app's default locale) instead of falling back to en-US.
  electronLanguages:
    - zh-CN
    - zh-TW
    - en-US
  # No `files` here: with a platform `files` list, electron-builder 26 dropped
  # the top-level patterns for the app directory and packed the whole repo.
  target:
    # NSIS supports delta updates automatically. The portable target was
    # dropped (user decision, 2026-09-23 — 「就生产个 linux window macos 的
    # 安装包」): it produced a second 500MB-class exe nobody installed, and
    # electron-updater cannot update it anyway.
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  # Enable differential download for NSIS
  differentialPackage: true
  # `Setup` stays in the name: the Build workflow uploads `dist/*Setup*.exe`.
  artifactName: pilab-v${version}-Setup.${ext}
  shortcutName: PiLab Ai
  # Register aiclient:// URL scheme
  include: build/installer.nsh

linux:
  target:
    # AppImage only (same user decision as `win.target`). It stays instead of
    # `deb` because electron-updater can update an AppImage and cannot update a
    # deb, so dropping the other way round would have cost Linux auto-update.
    # `maintainer` / `category` below are deb/rpm fields — left in place so the
    # target can come back without re-deriving them.
    - target: AppImage
      arch: [x64]
  # Linux can consume the multi-size PNG set directly. Keep it independent
  # from the macOS ICNS container, which app-builder cannot convert reliably
  # on the hosted Linux runner.
  icon: build/icons
  executableName: aiclient
  maintainer: baseOnEnso <admin@123.com>
  category: Development
  # Register aiclient:// URL scheme
  mimeTypes:
    - x-scheme-handler/aiclient

appImage:
  artifactName: pilab-v${version}.${ext}

afterPack: scripts/afterPack.mjs

# Writes the Markdown into `latest.yml` as `releaseNotes`. electron-updater
# prefers that over the GitHub feed entry, which is the body rendered to HTML —
# and builds before 1.0.5 print whatever arrives as plain text, so HTML showed
# up in their update dialog as a wall of tags.
releaseInfo:
  releaseNotesFile: docs/release-notes/unreleased.md

publish:
  provider: github
  owner: p1p1dan
  repo: ai-client
  releaseType: draft
