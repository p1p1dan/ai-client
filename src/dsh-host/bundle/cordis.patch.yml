# @aiclient/dsh-app — ai-client's worker-engine bundle, stacked over dsh-base
# (profile bundles: ['@deepseek-ai/dsh-base', '@aiclient/dsh-app']).
#
# Host-only composition: no Web client, no HTTP endpoint. `host/webserver` and
# `host/frontend-static` are rows of dsh-web-app, which this profile never
# stacks, so they are absent rather than disabled; host.ts asserts that absence
# on the composed entry list. This file ships in the packaged host
# (resources/dsh-host, dsh-rebase decision 011). Probe-only rows live in the
# test bundle src/dsh-host/tools/probe-bundle, never here (decision 015).

# Never export session logs. The launcher also sets DSH_TELEMETRY_DISABLED,
# which makes readProfilePatches append the same disable patch.
- id: session-telemetry-otel
  disabled: true

# DeepSeek Platform sign-in (system-browser login); ai-client keeps its own
# login and quota.
- id: deepseek-account
  disabled: true

# The account-backed LLM route has nothing to route through once the account
# provider above is off.
- id: llm-deepseek-account
  disabled: true

# A worker engine takes configuration changes through a restart, not file
# watchers (same choice as dsh-sdk-app).
- id: hmr
  disabled: true

# ---- P0-2: no DeepSeek official endpoint anywhere in this composition -------

# The native deepseek-official route and its request extensions.
- id: llm-deepseek
  disabled: true

- id: deepseek-llm-api-extensions
  disabled: true

# Attaches the installed-plugin list to official DeepSeek requests.
- id: plugin-package-inventory-deepseek
  disabled: true

# Uploads the canonical session log, incrementally, inside official DeepSeek
# requests (`dsh_session_log` field). Off for privacy, not only for routing.
- id: session-log-deepseek
  disabled: true

# First-prompt titles are an extra model request per session.
- id: session-title-llm
  disabled: true

# web_search is the official DeepSeek search endpoint and web_fetch reaches the
# public internet; neither belongs in the probe. P1 routes search through the
# ai-client gateway instead.
- id: tool-web
  disabled: true

- id: web
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: web-fetch-http
  disabled: true

# Every model request goes through llm-pi-ai to the ai-client gateway route.
# The probe points it at a local fake gateway; unset, it points at the discard
# port, never at a real provider.
- id: llm-pi-ai
  config:
    providers:
      aiclient-gateway:
        displayName: ai-client gateway (P0 probe)
        api: anthropic-messages
        baseURL: !!js "process.env.AICLIENT_DSH_GATEWAY_URL ?? 'http://127.0.0.1:9'"
        apiKeyEnv: AICLIENT_DSH_GATEWAY_KEY
        models:
          - id: fake-1
            name: P0 fake model
            contextWindow: 200000
            maxTokens: 8192
            reasoningEfforts: false
        retryPolicy:
          mode: normal
          maxRetries: 0

- id: agent-default-model
  config:
    provider: aiclient-gateway
    model: fake-1

# Plugin installs ask npm's own registry only; no mirror fallback.
- id: plugin-manager
  config:
    registry: https://registry.npmjs.org/
    fallbackRegistries: []

- insert:
    # P1-3a (decision 019): ai-client's worker RPC for every chat session of the
    # app, one channel per session over the IPC link Main's DshHostSupervisor
    # opened. Always on; inert only when the host has no IPC channel.
    - id: aiclient-bridge
      name: '@aiclient/dsh-app/bridge'

    # P1-6b (decisions 041, 042): ai-client's permission gate. Routes every
    # tool call to the gate the bridge attached for its chat session and
    # refuses calls nobody attached, so it stays off until the bridge attaches
    # gates (P1-6b part 2).
    - id: aiclient-permissions
      name: '@aiclient/dsh-app/permissions'
      disabled: true

    # P1-8 (decisions 065, 066): cuts a reply that keeps repeating delegation
    # or job calls while it streams, and stops an agent after `stepCeiling`
    # steps with a tool-less wrap-up. Always on; host.ts refuses a composition
    # that disables it. AICLIENT_RUNTIME_LOOP_GUARD=0 is the emergency switch.
    - id: aiclient-loop-guard
      name: '@aiclient/dsh-app/loop-guard'
      config:
        stepCeiling: 500
