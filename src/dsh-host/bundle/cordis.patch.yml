# @aiclient/dsh-app — ai-client's worker-engine bundle, stacked over dsh-base
# (profile bundles: ['@deepseek-ai/dsh-base', '@aiclient/dsh-app']).
#
# Host-only composition: no Web client, no HTTP endpoint. `host/webserver` and
# `host/frontend-static` are rows of dsh-web-app, which this profile never
# stacks, so they are absent rather than disabled; host.ts asserts that absence
# on the composed entry list. This file ships in the packaged host
# (resources/dsh-host, dsh-rebase decision 011). Probe-only rows live in the
# test bundle src/dsh-host/tools/probe-bundle, never here (decision 015).

# Never export session logs. The launcher also sets DSH_TELEMETRY_DISABLED,
# which makes readProfilePatches append the same disable patch.
- id: session-telemetry-otel
  disabled: true

# DeepSeek Platform sign-in (system-browser login); ai-client keeps its own
# login and quota.
- id: deepseek-account
  disabled: true

# The account-backed LLM route has nothing to route through once the account
# provider above is off.
- id: llm-deepseek-account
  disabled: true

# A worker engine takes configuration changes through a restart, not file
# watchers (same choice as dsh-sdk-app).
- id: hmr
  disabled: true

# ---- P0-2: no DeepSeek official endpoint anywhere in this composition -------

# The native deepseek-official route and its request extensions.
- id: llm-deepseek
  disabled: true

- id: deepseek-llm-api-extensions
  disabled: true

# Attaches the installed-plugin list to official DeepSeek requests.
- id: plugin-package-inventory-deepseek
  disabled: true

# Uploads the canonical session log, incrementally, inside official DeepSeek
# requests (`dsh_session_log` field). Off for privacy, not only for routing.
- id: session-log-deepseek
  disabled: true

# First-prompt titles are an extra model request per session.
- id: session-title-llm
  disabled: true

# web_search is the official DeepSeek search endpoint and web_fetch reaches the
# public internet; neither belongs in the probe. P1 routes search through the
# ai-client gateway instead.
- id: tool-web
  disabled: true

- id: web
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: web-fetch-http
  disabled: true

# Every model request goes through llm-pi-ai. Its routes and the default model
# are not here: Main's model plan brings them at every start (`configure`, P1-5a,
# decision 033), and host.ts injects the `llm-pi-ai` and `agent-default-model`
# rows as in-memory overlays after every user layer. A route names its key by
# reference only (`apiKeyEnv`).

# P1-5b (decision 034): dsh-credentials-local keeps keys in plain text in
# $DSH_HOME/.credentials.yaml. aiclient-credentials below pulls each key from
# Main per request instead; host.ts restates this row off after every layer.
- id: credentials
  disabled: true

# Decision 082 (closing decisions 016, 058): plugin installs never run on
# the user's machine; the plugin allowlist ships preinstalled instead.
# host.ts restates this row off after every user layer (hostProfile.ts
# REQUIRED_DISABLED), same as credentials above.
- id: plugin-manager
  disabled: true

# ---- P1-6b: approvals come from ai-client's gate alone ----------------------

# Decisions 044 and 045: DSH's sandbox is off on every platform in P1, so the
# only approval a tool call meets is aiclient-permissions' (the 1.0.x model)
# and no operation is asked twice. Literal values: DSH_PERMISSION_MODE is
# never read (Main strips DSH_* from the host's environment as well). An id
# patch replaces the whole config, so the workspace root is restated. With
# danger-full-access the sandbox provider is never called, which also keeps
# the Windows ACL rung (and its standing ACEs) out of the picture.
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

# Asked only by DSH itself (a sandbox escalation, a third-party plugin's
# `ask`); aiclient-permissions is the answerer. Never `never`: a denial must
# stay a denial the user can see.
- id: approval
  config:
    policy: ask

# Decision 047: DSH's permission presets (`/permission`) would be a second
# gear selector beside ours. host.ts restates this row off after every user
# layer (hostProfile.ts REQUIRED_DISABLED).
- id: permission
  disabled: true

- insert:
    # P1-5b (decision 034): ctx.credentials, read-only. A key reference of the
    # model plan resolves to the key Main hands over for that one request;
    # nothing is cached, every write is refused. Always on; host.ts refuses a
    # composition without it.
    - id: aiclient-credentials
      name: '@aiclient/dsh-app/credentials'

    # P1-3a (decision 019): ai-client's worker RPC for every chat session of the
    # app, one channel per session over the IPC link Main's DshHostSupervisor
    # opened. Always on; inert only when the host has no IPC channel.
    - id: aiclient-bridge
      name: '@aiclient/dsh-app/bridge'

    # P1-6b (decisions 041, 042): ai-client's permission gate. Routes every
    # tool call to the gate the bridge attached for its chat session and
    # refuses calls nobody attached. Always on: the bridge injects it, host.ts
    # restates it on after every user layer and refuses a composition without
    # it (hostProfile.ts REQUIRED_ENABLED, RESTATED_ENABLED).
    - id: aiclient-permissions
      name: '@aiclient/dsh-app/permissions'

    # P1-8 (decisions 065, 066): cuts a reply that keeps repeating delegation
    # or job calls while it streams, and stops an agent after `stepCeiling`
    # steps with a tool-less wrap-up. Always on; host.ts refuses a composition
    # that disables it. AICLIENT_RUNTIME_LOOP_GUARD=0 is the emergency switch.
    - id: aiclient-loop-guard
      name: '@aiclient/dsh-app/loop-guard'
      config:
        stepCeiling: 500

    # P1-13c (decision 091): on Windows, files the company disk-encryption
    # policy hands node as ciphertext are re-read through Windows PowerShell
    # 5.1, which the policy decrypts for. Wraps the fs service's read
    # entrances only after its own 16-byte prefix check trips, so a normal
    # read pays nothing but that check; everything the fallback cannot turn
    # into trusted plaintext is refused as FS_ENCRYPTED, never handed over as
    # ciphertext. Inert on Linux and macOS; always on, like the rows above.
    - id: aiclient-encrypted-read
      name: '@aiclient/dsh-app/encrypted-read'
